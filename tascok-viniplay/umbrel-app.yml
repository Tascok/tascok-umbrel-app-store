category: files & productivity
version: "0.10.1"
port: 8998
description: >-
  📺 ViniPlay é um aplicativo de streaming de IPTV que reúne canais de televisão, dados de programas eletrônicos e conteúdo de vídeo sob demanda em uma interface limpa e intuitiva. Ele lê listas de reprodução M3U e fontes EPG e as transforma em uma experiência de visualização estruturada com categorias, detalhes do canal e informações do programa. O aplicativo permite que os usuários naveguem pelos canais ao vivo, verifiquem o que está sendo reproduzido no momento e explorem as próximas programações por meio de um guia integrado. Ele suporta a reprodução de diferentes formatos de stream e pode transcodificar mídia para garantir uma visualização suave em vários dispositivos.


  ViniPlay também oferece a capacidade de criar contas de usuário e gerenciar preferências individuais, como favoritos ou histórico de visualização. Inclui um recurso de pesquisa que ajuda os usuários a encontrar rapidamente canais ou programas em grandes listas de reprodução. A interface do player concentra-se na simplicidade e clareza, facilitando a troca de canais ou o ajuste das configurações de reprodução enquanto assiste.


  Para espectadores que desejam mais controle, o aplicativo oferece ferramentas para organizar playlists, agrupar canais e personalizar a estrutura de seu conteúdo. Também pode lidar com fontes de vídeo sob demanda, apresentando filmes e séries com metadados quando disponíveis. No geral, o ViniPlay transforma listas brutas de IPTV em uma experiência de televisão refinada e agradável que parece coesa e acessível.
