name: Domain Locker
tagline: Uma ferramenta completa para acompanhar seu portfólio de nomes de domínio
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-domain-locker/logo.png
category: networking
version: "0.0.6"
port: 8839
description: >-
  Domain Locker é uma plataforma poderosa e de código aberto projetada para gerenciar e monitorar nomes de domínio em vários registradores e serviços. Ele fornece aos usuários uma interface unificada para organizar, rastrear e proteger seus ativos de domínio com forte ênfase em automação, segurança e privacidade de dados. A ferramenta coleta automaticamente informações abrangentes sobre cada domínio, incluindo registros DNS, certificados SSL, dados WHOIS, subdomínios e endereços IP relacionados. Esse rastreamento de ativos em tempo real garante que os usuários estejam sempre cientes do estado atual e da integridade de seus domínios.


  Mecanismos de alerta integrados notificam os usuários sobre alterações críticas, como expirações iminentes de domínio, modificações de DNS e possíveis problemas de segurança. Esses alertas podem ser entregues por e-mail, webhooks ou plataformas de mensagens como Telegram e Signal, ajudando os usuários a responder rapidamente a ameaças emergentes ou mudanças operacionais. O Domain Locker também apresenta análises e visualizações detalhadas, incluindo gráficos interativos e cronogramas que destacam o desempenho do domínio e o histórico de configuração ao longo do tempo. Esse nível de percepção torna mais fácil para os usuários otimizar o uso do domínio, identificar anomalias e tomar decisões informadas.


  Para aqueles preocupados com segurança, o Domain Locker inclui ferramentas integradas para auditar configurações de domínio e sugerir melhorias, tornando-o ideal para desenvolvedores, empresas e profissionais de TI que desejam garantir uma higiene robusta do domínio. Além disso, oferece recursos de rastreamento de custos, permitindo aos usuários registrar preços de compra, monitorar despesas contínuas e estimar o valor atual de mercado de seus portfólios de domínios.


  A plataforma oferece suporte à internacionalização, uma interface personalizável no modo escuro e opções de layout flexíveis para atender às diferentes preferências do usuário. 
