releaseNotes: >-
  The v2.15.7 update improves port forwarding by preventing circular redirects, enhances DDNS functionality with fixes for Cloudflare and domain checks, and updates the default STUN server list. 


  SSL certificate matching logic has been refined for non-direct public network environments, while web service optimizations include support for Encrypted Client Hello (ECH) and better connection management. Overall, the update fixes bugs and improves system stability and performance.
