releaseNotes: >-
  Version 1.14.0 introduces several useful improvements: you can now reorder subtasks and assign users to them, while linking cards is easier thanks to a new search bar.


  The board view now updates in real time, new info and feedback modals were added, and various UI refinements and bug fixes make everything smoother.
