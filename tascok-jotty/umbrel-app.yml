releaseNotes: >-
  This version focuses on refining the overall experience with several important bug fixes and small but useful improvements. It resolves issues with OIDC group claims, filename handling, mobile text wrapping, and checkbox behavior, while finally preserving line breaks correctly.


  A compact mode for notes, persistent user settings, and customizable themes and landing pages have also been introduced, making Jotty smoother and more personalized to use.
