description: >-
  Reubah é um aplicativo da web auto-hospedado projetado para conversão fácil e rápida de arquivos e imagens em vários formatos. O aplicativo permite aos usuários fazer upload de arquivos diretamente no navegador e convertê-los no formato de saída desejado com apenas alguns cliques. Ele suporta uma ampla variedade de formatos de imagem populares, como JPEG, PNG, WebP, GIF e BMP, bem como formatos modernos como HEIC e PDF. Para documentos de texto, Reubah oferece amplas opções de conversão, incluindo suporte para DOCX, ODT, RTF, TXT e PDF.


  Um dos principais recursos do Reubah é sua interface de usuário simples, que torna a conversão de arquivos acessível mesmo sem conhecimento técnico. O aplicativo lida com arquivos individuais e processamento em lote, permitindo que vários arquivos sejam convertidos de uma só vez. Além da conversão de formatos, o Reubah inclui recursos de processamento de imagens, como redimensionamento e, futuramente, remoção de fundo.


  Com sua API integrada, os recursos do Reubah também podem ser integrados a outros aplicativos ou usados ​​em fluxos de trabalho automatizados. Destina-se a quem necessita regularmente de converter ficheiros ou editar imagens e procura uma solução simples, rápida e flexível.
