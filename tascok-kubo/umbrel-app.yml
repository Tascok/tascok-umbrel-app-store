description: >-
  🧊 Kubo é a implementação mais amplamente usada do InterPlanetary File System, um protocolo ponto a ponto para armazenar, endereçar, compartilhar e recuperar dados em uma rede distribuída.


  Sua interface web integrada fornece uma visão geral clara do nó, dos peers conectados, da atividade da largura de banda, do uso do repositório e do conteúdo fixado. Arquivos e pastas podem ser importados diretamente por meio do navegador, atribuídos identificadores de conteúdo, organizados dentro do sistema de arquivos mutável e fixados localmente para que permaneçam disponíveis neste nó.


  Kubo também inclui um gateway HTTP local para recuperar conteúdo IPFS e IPNS, uma interface RPC completa para administração de nós, conectividade ponto a ponto sobre TCP e QUIC, roteamento de conteúdo através da tabela hash distribuída e ferramentas para gerenciar chaves, pinos, pares e dados de repositório.


  Todos os dados do nó, incluindo a identidade de peer gerada, configuração, blocos importados, pinos e sistema de arquivos mutável, são armazenados persistentemente no dispositivo Umbrel.
