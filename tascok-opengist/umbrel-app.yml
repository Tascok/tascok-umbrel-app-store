name: Opengist
tagline: Um pastebin baseado em Git para trechos de código e notas
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-opengist/logo.png
category: developer tools
version: "1.13.1"
port: 6157
description: >-
  Opengist é uma plataforma de pastebin e snippet de código de código aberto desenvolvida por Git. Ele permite criar, editar, organizar, versionar e compartilhar trechos de código, notas, arquivos Markdown, scripts, exemplos de configuração e pequenas coleções de arquivos em uma interface limpa e leve.


  Cada snippet é armazenado como seu próprio repositório Git, para que as alterações possam ser rastreadas ao longo do tempo e gerenciadas por meio da interface da web ou com comandos Git padrão por HTTP ou SSH. Os snippets podem ser públicos, não listados ou privados, dando a você controle sobre o que permanece pessoal e o que pode ser compartilhado com outras pessoas.


  Opengist inclui destaque de sintaxe, renderização Markdown, vários arquivos por snippet, uploads de arrastar e soltar, downloads ZIP, histórico de revisões, diferenças, pesquisa, tópicos, curtidas, bifurcações, incorporações e acesso JSON. Ele também oferece suporte a diferentes opções de autenticação, tornando-o flexível para uso pessoal, pequenas equipes e configurações de homelab.


  É uma alternativa prática ao GitHub Gist para desenvolvedores, auto-hosters, administradores e qualquer pessoa que queira um local simples para armazenar e compartilhar código reutilizável, comandos, exemplos de configuração ou notas técnicas.
