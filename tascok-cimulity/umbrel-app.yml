description: >-
  🏙️ Cimulity é uma encantadora simulação de construção de cidades baseada em navegador, inspirada em jogos clássicos de estratégia. Comece com uma paisagem isométrica vazia e gradualmente transforme-a em uma cidade animada repleta de estradas, casas, empresas, indústrias, parques e serviços públicos. Cada decisão influencia o crescimento da sua cidade, a eficiência do tráfego e o quão atraente cada bairro se torna.


  ⚡ Construa infraestruturas essenciais, como redes de energia e água, ao mesmo tempo que fornece polícia, proteção contra incêndio, saúde, escolas e áreas recreativas para seus cidadãos. Fique de olho na população, no emprego, no valor da terra, no fluxo de tráfego, na demanda e nas finanças da cidade à medida que novos distritos se desenvolvem em torno de suas escolhas de planejamento.


  🌳 Molde o terreno, expanda para novas áreas, melhore bairros em dificuldades e equilibre o crescimento residencial, comercial e industrial. Múltiplas velocidades de simulação permitem planejar cuidadosamente ou observar a evolução da sua cidade em tempo real. O progresso é salvo automaticamente no seu navegador, permitindo que você retorne à sua cidade quando quiser.
