description: >-
  🎬 Yamtrack é um aplicativo de rastreamento de mídia auto-hospedado de código aberto projetado para ajudar os usuários a organizar e acompanhar uma ampla variedade de conteúdo de entretenimento, incluindo filmes, programas de TV, anime, mangá, videogames, livros e quadrinhos. Ele fornece uma plataforma abrangente onde os usuários podem registrar informações detalhadas sobre seu consumo de mídia, como classificações, status de visualização, progresso, datas de início e término e notas pessoais. Cada ação realizada no aplicativo é registrada, permitindo que os usuários mantenham um histórico de suas interações, como adicionar novas mídias, começar a assistir ou ler e retomar o conteúdo pausado.


  Um dos recursos notáveis ​​do Yamtrack é sua flexibilidade no gerenciamento de dados importados automaticamente de serviços populares e entradas criadas manualmente para itens de mídia que podem não estar disponíveis por meio de APIs externas. Isso permite uma experiência de rastreamento personalizada e completa. Os usuários podem organizar suas mídias rastreadas em listas personalizadas e compartilhar essas coleções com outras pessoas, melhorando a interação da comunidade. Uma visualização de calendário fornece uma visão geral dos próximos lançamentos, mantendo os usuários informados sobre novos conteúdos relevantes aos seus interesses. As notificações podem ser configuradas através de diversas plataformas como Discord, Telegram, Slack e e-mail usando Apprise, permitindo que os usuários fiquem atualizados sobre novos lançamentos ou outros eventos significativos.


  O Yamtrack oferece suporte a vários usuários, cada um com suas próprias contas e dados de rastreamento personalizados, tornando-o adequado para residências ou pequenos grupos de entusiastas da mídia. A integração com Jellyfin permite o rastreamento automático de episódios assim que são assistidos, conectando perfeitamente a reprodução de mídia com dados de rastreamento. A importação de dados é suportada por vários serviços conhecidos, incluindo Trakt, Simkl, MyAnimeList, The Movie Database, AniList e Kitsu, permitindo aos usuários migrar facilmente suas informações de rastreamento de mídia existentes. Os usuários também têm a opção de exportar todos os dados rastreados para um arquivo CSV e reimportá-los quando necessário.


  O Yamtrack é desenvolvido ativamente com atualizações regulares que aprimoram sua funcionalidade, como melhor integração com servidores de mídia e melhores recursos de pesquisa para videogames. Os usuários apreciam o aplicativo por sua facilidade de uso, recursos abrangentes de rastreamento e capacidade de hospedar seus próprios dados de forma privada, sem depender de plataformas de terceiros. É uma ferramenta valiosa para quem deseja manter um registro detalhado e organizado de seu consumo diversificado de mídia em um local centralizado.
