category: files & productivity
version: "2.4.2"
port: 8744
description: >-
  🗺️ Reitti é um aplicativo desenvolvido para monitorar e registrar seus movimentos de forma abrangente e automatizada. Ele rastreia continuamente sua localização ao longo do dia e identifica os lugares que você visita, criando um registro detalhado de suas atividades diárias. Ao analisar seus movimentos, ele pode detectar o meio de transporte que você usa, seja caminhando, pedalando ou dirigindo, e fornece informações sobre como você viaja entre diferentes locais.


  O aplicativo também identifica lugares importantes que você visita com frequência e permite atribuir nomes personalizados a eles, ajudando você a entender melhor os locais mais importantes em sua vida. Ele organiza essas informações em uma linha do tempo interativa que mostra quando e por quanto tempo você permaneceu em cada local, bem como as distâncias percorridas entre eles. Esta linha do tempo oferece uma visão geral clara de suas rotinas e padrões diários.


  Reitti oferece visualizações detalhadas de seus caminhos de viagem completos usando dados GPS precisos. Essas representações visuais facilitam a visualização de seus hábitos de movimento, rotas recorrentes e tendências gerais de mobilidade. Ao fornecer esses insights, o aplicativo ajuda os usuários a obter uma compreensão mais profunda de seus comportamentos pessoais de viagem, dos lugares que frequentam e da maneira como navegam em seu ambiente diário.


  No geral, Reitti se concentra em fornecer aos usuários uma imagem abrangente de seus padrões de mobilidade e do contexto espacial de sua vida diária, transformando dados brutos de localização em informações significativas sobre como eles se movem e interagem com o ambiente.


  ⚙️ Após iniciar o aplicativo, o primeiro passo é gerar um token de API nas Configurações em Tokens de API, necessário para integração do aplicativo móvel. Em seguida, os serviços de geocodificação devem ser adicionados em Configurações em Geocodificação para permitir uma resolução precisa de endereços. Você pode então importar seus dados de localização existentes por meio de Configurações em Importar dados. Por fim, configure aplicativos móveis como OwnTracks ou GPSLogger para permitir o rastreamento em tempo real de seus movimentos.


  🔧 Para obter instruções detalhadas sobre como configurar o Reitti, consulte a documentação oficial em https://www.dedicatedcode.com/projects/reitti/getting-started/.
