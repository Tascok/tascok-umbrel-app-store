description: >-
  ⏱️ Titra é um aplicativo moderno de controle de tempo de código aberto projetado para freelancers, pequenas empresas e equipes que precisam de uma maneira simples de registrar e gerenciar horas de trabalho. Sua abordagem baseada em projetos permite atribuir rapidamente o tempo monitorado a clientes, projetos, tarefas ou atividades internas, sem configurações complicadas ou distrações desnecessárias.


  Inicie e pare cronômetros com apenas alguns cliques, adicione descrições às suas entradas e use o preenchimento automático inteligente para acelerar tarefas recorrentes. O Titra também apoia projetos de ausência, possibilitando o registro de feriados, licenças médicas e outros períodos de folga junto com as horas normais do projeto.


  Os relatórios em tempo real fornecem uma visão geral clara de como o tempo está sendo gasto nos projetos e nos membros da equipe. As horas monitoradas podem ser revisadas por meio de relatórios tabulares ou gráficos e exportadas para processamento posterior, faturamento, folha de pagamento ou análise interna. Uma interface limpa e um modo escuro integrado tornam o uso do Titra confortável durante todo o dia de trabalho.


  Ao executar o Titra no seu Umbrel, seus dados de controle de tempo permanecem armazenados na infraestrutura que você controla. Isso o torna uma alternativa amigável à privacidade aos serviços de controle de tempo hospedados externamente, ao mesmo tempo que fornece acesso conveniente por meio de uma interface web moderna.


  Esteja você acompanhando o trabalho faturável do cliente, gerenciando vários projetos internos ou simplesmente desejando uma melhor visão geral do seu tempo de trabalho diário, o Titra oferece uma solução focada e direta, sem complexidade desnecessária.
