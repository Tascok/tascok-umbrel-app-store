releaseNotes: >-
  Version 1.8.0 includes several important bug fixes such as resolving signup invitation issues, search errors in person view, and crashes related to automation and record deletion. 


  New features were added, including an enterprise adapter, support for field duplication, API endpoints for collaborators, template support, and AI field configuration. 


  Additionally, performance improvements and UI optimizations were made, along with various minor corrections and enhancements to improve overall stability and usability.
