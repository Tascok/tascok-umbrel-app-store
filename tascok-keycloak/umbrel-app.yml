description: >-
  🔐 Keycloak é uma solução de código aberto de gerenciamento de identidade e acesso que fornece serviços de autenticação e autorização para aplicativos e serviços modernos. Ele permite que desenvolvedores e administradores de sistemas deleguem a responsabilidade de gerenciar identidades de usuários, funções e permissões de acesso a uma plataforma centralizada, o que simplifica os processos de desenvolvimento e segurança de sistemas distribuídos.


  Basicamente, o Keycloak foi projetado para oferecer suporte a protocolos de segurança modernos, como OpenID Connect, OAuth 2.0 e SAML 2.0. Esses padrões permitem integração perfeita com uma ampla variedade de aplicativos web, APIs e provedores de identidade. Uma das principais características do Keycloak é a capacidade de oferecer login único. Isso significa que os usuários podem fazer login uma vez e obter acesso a vários aplicativos conectados sem precisar se autenticar novamente para cada serviço. Isso melhora a experiência do usuário e reduz a complexidade do gerenciamento de vários sistemas de login.


  Keycloak também suporta integração de login social. Isso permite que os usuários se autentiquem usando suas contas existentes em plataformas populares como Google ou GitHub. Além disso, Keycloak oferece autenticação de dois fatores, opções de recuperação de conta e recursos detalhados de gerenciamento de sessão para melhorar a segurança.


  A plataforma inclui um console administrativo onde os administradores podem criar e gerenciar contas de usuários, definir funções e grupos, configurar provedores de identidade e monitorar eventos de login. Os usuários também podem acessar um portal de gerenciamento de contas de autoatendimento, onde podem atualizar suas informações de perfil, alterar senhas e visualizar o histórico de login.


  Outro aspecto importante do Keycloak é o suporte para multilocação por meio de um conceito chamado reinos. Um domínio é um espaço separado onde configurações, usuários e funções são isolados de outros. Isso permite que as organizações gerenciem diferentes ambientes ou bases de clientes de forma independente na mesma instância do Keycloak.


  No geral, o Keycloak ajuda desenvolvedores e organizações a proteger seus aplicativos centralizando o gerenciamento de identidades. Ele elimina a necessidade de criar e manter sistemas de login personalizados e garante autenticação de usuário consistente e segura em diferentes serviços.
