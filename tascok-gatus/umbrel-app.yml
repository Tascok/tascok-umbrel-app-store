description: >-
  ⚙️ Gatus é uma solução de monitoramento de código aberto que fornece uma maneira intuitiva, confiável e eficiente de garantir o tempo de atividade e o desempenho de serviços, APIs e infraestrutura críticos. Projetado para ser simples, ele usa uma configuração baseada em YAML para definir endpoints, intervalos e condições, tornando-o acessível tanto para equipes pequenas quanto para operações de grande escala. Com suporte a diversos protocolos como HTTP, TCP e DNS, o Gatus se adapta perfeitamente a diversas necessidades de monitoramento.


  Seu painel fácil de usar visualiza a integridade e o desempenho dos endpoints, enquanto seu sistema de alerta robusto garante que os problemas sejam resolvidos antes que aumentem. As notificações podem ser enviadas por meio de plataformas populares como Slack, Telegram, Discord e muito mais, mantendo as equipes informadas em tempo real. Gatus também se destaca em casos de uso avançados, como verificações de expiração de certificados SSL, monitoramento de tempo de resposta e validação de conteúdo.


  Esteja você gerenciando APIs, sites ou serviços de back-end, Gatus é uma ferramenta versátil projetada para aumentar a confiabilidade e minimizar o tempo de inatividade, proporcionando tranquilidade na manutenção de sistemas de missão crítica.


  ⚠️ Configuração do caminho de configuração personalizada: 


  Por padrão, espera-se que o arquivo de configuração esteja localizado em config/config.yaml na pasta do aplicativo Umbrel. Para especificar um caminho customizado, defina a variável de ambiente GATUS_CONFIG_PATH. Se GATUS_CONFIG_PATH apontar para um diretório, todos os arquivos *.yaml e *.yml dentro desse diretório e seus subdiretórios serão mesclados. Todos os mapas e objetos serão mesclados profundamente, o que significa que você pode definir alerting.slack em um arquivo e alerting.pagerduty em outro. Fatias e matrizes são anexadas, permitindo definir vários pontos de extremidade em arquivos diferentes, com cada ponto de extremidade sendo adicionado à lista final. Parâmetros com valores primitivos (por exemplo, métricas, alerting.slack.webhook-url) só podem ser definidos uma vez para evitar ambiguidade. Por exemplo, você não pode definir alerting.slack.webhook-url em dois arquivos com valores diferentes. Todos os arquivos são mesclados em um antes do processamento e esse comportamento ocorre por design.


  🌐 Para obter um guia de configuração completo, visite: https://github.com/TwiN/gatus.
