manifestVersion: 1
id: tascok-spooty
name: Spooty
tagline: Um downloader Spotify auto-hospedado
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-spooty/logo.png
category: media
version: "2.0.9"
port: 3381
description: >-
  Spooty é um aplicativo auto-hospedado projetado para baixar músicas usando URLs do Spotify. Ele funciona extraindo metadados como títulos de músicas, artistas e informações de álbuns do Spotify e, em seguida, localizando o conteúdo de áudio correspondente no YouTube, onde baixa os arquivos de áudio. O aplicativo é desenvolvido em TypeScript e lançado sob a licença MIT, permitindo aos usuários modificá-lo e distribuí-lo livremente. Spooty também inclui suporte Docker, permitindo fácil implantação em vários ambientes. Além disso, oferece um recurso para assinar playlists ou páginas de artistas, baixando automaticamente novos lançamentos assim que estiverem disponíveis. 


  ⚠️ Embora a ferramenta forneça acesso conveniente à música, os usuários devem estar cientes das possíveis implicações legais de baixar conteúdo protegido por direitos autorais sem a devida autorização.
