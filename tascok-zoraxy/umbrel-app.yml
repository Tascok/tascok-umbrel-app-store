version: "3.1.2"
port: 8400
description: >-
  Zoraxy é um servidor proxy reverso e ferramenta de encaminhamento poderoso e fácil de usar, projetado para fornecer um método direto, flexível e seguro para gerenciar o tráfego da Web em laboratórios domésticos e ambientes de desenvolvedores. Escrito em Go, o Zoraxy atende usuários novatos e experientes, simplificando o processo de roteamento de solicitações HTTP para servidores backend, permitindo gerenciamento de serviços eficiente e confiável sem depender de servidores tradicionais e mais complexos como NGINX ou Apache.


  Principais recursos:


  🔀 Suporte a proxy reverso e WebSocket: Zoraxy lida com conexões HTTP/2 e suporta automaticamente proxy WebSocket, tornando-o ideal para aplicativos em tempo real que precisam de uma conexão estável e de baixa latência, como serviços de bate-papo ou painéis. Ele também permite proxy reverso em diretórios virtuais e oferece suporte a nomes de host alternativos e cabeçalhos personalizados para maior flexibilidade.


  🤖 TLS/SSL com automação ACME: Zoraxy simplifica a configuração de HTTPS usando ACME, que permite a renovação automática de certificados SSL por meio de provedores como Let's Encrypt. Este recurso oferece suporte a certificados SNI (Server Name Indication) e SAN (Subject Alternative Name), ajudando os usuários a atender vários domínios com segurança com intervenção manual mínima.


  📍 Lista negra e lista branca de Geo-IP: A segurança é aprimorada ao oferecer listas negras e listas brancas baseadas em IP e geo-IP, permitindo que os usuários restrinjam o acesso com base na localização ou em endereços IP específicos. Este recurso é especialmente útil para proteger aplicações e serviços de regiões específicas ou IPs não confiáveis.


  🌐 Controlador de rede de área global e integração ZeroTier: Para redes distribuídas, Zoraxy fornece uma interface de controlador integrada para gerenciar redes ZeroTier, facilitando conexões seguras e escalonáveis ​​em vários nós. Este recurso é particularmente valioso para entusiastas e desenvolvedores de homelab que criam configurações de rede privada com acesso externo limitado Zoraxy DEV Community.


  🛠️ Utilitários integrados: Zoraxy vai além da funcionalidade tradicional de proxy reverso, incluindo utilitários como conversão CIDR IP, um scanner mDNS para descoberta de rede local e ferramentas para depuração de conexões proxy. Um terminal Web-SSH permite o gerenciamento remoto de dispositivos conectados na rede, e seu suporte Wake-on-LAN amplia ainda mais a usabilidade do Zoraxy para administradores de rede.


  📊 Proxy e monitoramento de fluxo: além do HTTP/HTTPS, o Zoraxy suporta proxy de fluxo TCP e UDP, tornando-o uma escolha versátil para lidar com vários fluxos de dados. O monitoramento integrado do tempo de atividade e a análise de tráfego não personalizada fornecem insights sobre a atividade da rede sem cookies, aumentando a privacidade e permitindo que os usuários acompanhem o desempenho do serviço diretamente no Zoraxy.


  🖥️ UI e integração simples: A interface do Zoraxy foi projetada para ser intuitiva, com instruções de configuração detalhadas para usuários menos experientes. Configurações avançadas podem desabilitar a autenticação para integração com infraestruturas existentes que usam gerenciamento de permissões. Além disso, um modo de gerenciamento de administrador único facilita a operação em redes privadas, semelhante ao gerenciamento de um roteador doméstico.


  Zoraxy é particularmente popular nas comunidades de homelab e desenvolvedores por seu extenso conjunto de recursos, confiabilidade e natureza de código aberto. Ele pode ser executado em dispositivos de baixo consumo de energia, tornando-o adequado para uma variedade de ambientes de hospedagem, desde configurações pessoais até arquiteturas de rede distribuídas maiores. Sua flexibilidade, combinada com um conjunto robusto de recursos, torna-o uma escolha atraente para quem deseja agilizar a configuração de gerenciamento de rede ou hospedar serviços da Web com segurança e eficiência.

