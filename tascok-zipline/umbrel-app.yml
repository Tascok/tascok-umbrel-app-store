id: tascok-zipline
name: Zipline
tagline: Uma solução avançada para compartilhamento de arquivos seguro e contínuo
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-zipline/logo.png
category: files & productivity
version: "4.6.4"
port: 3472
description: >-
  Zipline é um servidor de compartilhamento e upload de arquivos auto-hospedado de código aberto projetado principalmente para uso com ShareX, mas também oferece suporte a outros métodos de upload. Ele permite que os usuários carreguem e compartilhem arquivos, capturas de tela e trechos de texto por meio de um domínio personalizado, mantendo o controle sobre seus dados.


  Zipline simplifica a implantação com Docker e oferece instalação manual para personalização. Ele suporta vários métodos de upload, incluindo ShareX, cURL, Web UI e uma API pública. Os usuários podem gerenciar arquivos de forma eficiente com um painel baseado na web, excluir arquivos ou definir datas de expiração. Recursos de segurança como proteção por senha, limitação de taxa e autenticação de token de API melhoram a segurança dos dados.


  A plataforma permite uploads temporários com exclusão automática e oferece opções de armazenamento como armazenamento local, Amazon S3 e Google Cloud Storage. Domínios personalizados e links curtos oferecem maior personalização. Os usuários podem acessar estatísticas e registros de upload para monitorar o uso.


  Zipline é adequado para criadores de conteúdo, equipes e entusiastas de auto-hospedagem que precisam de uma solução de compartilhamento de arquivos privada e controlada. Os desenvolvedores podem aproveitar sua API extensível para automação e integração. A instalação via Docker é simples, com um processo de configuração rápido. Para mais detalhes e opções de configuração, o repositório oficial do GitHub fornece orientações abrangentes.


  Ao oferecer uma solução privada, eficiente e altamente personalizável, a Zipline garante controle total sobre os dados carregados, tornando-se uma alternativa ideal aos serviços centralizados.
