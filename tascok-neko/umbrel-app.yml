manifestVersion: 1
id: tascok-neko
name: Neko
tagline: Um navegador virtual auto-hospedado desenvolvido com WebRTC
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-neko/logo.png
category: networking
version: "3.0.3"
port: 3880
description: >-
  🐈 Neko é um navegador virtual auto-hospedado que transmite uma experiência de navegação na web totalmente interativa diretamente para o dispositivo do usuário usando WebRTC. Ele fornece acesso a um ambiente de navegador seguro e em área restrita que funciona independentemente do sistema local do usuário, garantindo privacidade e isolamento. O navegador é renderizado remotamente e todas as interações são transmitidas em tempo real, resultando em uma experiência tranquila e de baixa latência.


  Projetado com a colaboração em mente, o Neko permite que vários usuários participem e compartilhem a mesma sessão, tornando-o ideal para atividades como navegação conjunta, assistir a grupos ou suporte remoto. A interface é otimizada para capacidade de resposta, com atraso mínimo entre a entrada e o feedback, criando uma experiência que parece nativa, apesar de ser executada remotamente.


  Quando integrado ao Umbrel, o Neko oferece uma instância de navegador privada e sempre disponível que pode ser acessada com segurança na rede doméstica ou pela Internet por meio das opções de tunelamento do Umbrel. Ele se encaixa perfeitamente no ecossistema auto-hospedado, fornecendo uma maneira confiável e fácil de navegar na web sem depender de serviços de terceiros ou expor seu dispositivo local.


  Neko é especialmente útil em cenários onde privacidade, simplicidade e facilidade de acesso são importantes – seja para uso pessoal, tarefas colaborativas ou navegação remota segura.


  💡 Neko oferece uma ampla gama de opções de configuração, incluindo configuração WebRTC, configurações de plugins e captura de áudio e vídeo. Para informações mais detalhadas, confira a documentação oficial aqui: https://neko.m1k1o.net/docs/v3/configuration.
