description: >-
  NetBird é uma plataforma de rede segura que cria conexões privadas ponto a ponto entre dispositivos usando canais de comunicação criptografados. Ele cria uma camada de rede confiável que permite uma comunicação direta e contínua, sem expor os dados a intermediários. Cada conexão é protegida com padrões modernos de criptografia e gerenciada automaticamente por meio de um modelo de segurança de confiança zero que autentica identidades em vez de redes.


  O NetBird Client é o componente que dá vida a este sistema. Ele lida com toda a comunicação criptografada, gerenciamento de chaves e controle de acesso entre pares conectados. Uma vez ativo, ele conecta o dispositivo com segurança à rede NetBird e gerencia continuamente todas as operações em segundo plano para manter uma conexão confiável e privada.


  Ao combinar simplicidade, automação e criptografia forte, o NetBird Client permite redes seguras sem configuração. Ele fornece uma base estável para comunicação e colaboração privadas, ao mesmo tempo que garante que cada conexão permaneça totalmente criptografada, autenticada e resiliente.


  ⚙️ Conecte seu Umbrel com NetBird


  Clique com o botão direito no aplicativo e selecione Solucionar problemas para abrir o console. No console, você verá o endereço que contém seu código de login exclusivo, por exemplo:


  https://login.netbird.io/activate?user_code=[YOUR-CODE]


  Abra este link no navegador do seu computador ou dispositivo móvel e faça login com a mesma conta NetBird que você usa para o painel. Aprove o dispositivo quando solicitado. Após a confirmação, seu cliente Umbrel se registrará automaticamente e permanecerá conectado durante as reinicializações.
