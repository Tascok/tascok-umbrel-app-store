manifestVersion: 1
id: tascok-nerdqaxe
name: Nerd*axe Webflasher
tagline: Uma ferramenta fácil para atualizar dispositivos Nerd*axe
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-nerdqaxe/logo.png
category: bitcoin
version: "1.0.1"
port: 3639
description: >-
  O Nerd*axe Web Flasher é uma ferramenta projetada para atualizar firmware em dispositivos Nerdaxe. É um fork do Bitaxe Web Flasher.


  A ferramenta simplifica o processo de atualização, oferecendo suporte à detecção automática de dispositivos, incluindo modelos e versões de placa. Ele oferece uma interface web amigável para selecionar o firmware correto e iniciar o processo.


  ⚠️ O Nerd*axe Web Flasher não funciona em dispositivos ARM como o Raspberry Pi. Além disso, é recomendável usar um navegador baseado em Chromium para obter a melhor experiência com a ferramenta.
developer: Thomas Shufps
