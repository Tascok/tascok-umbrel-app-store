name: mStream
tagline: Um servidor de música privado
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-mstream/logo.png
category: media
version: "5.13.1"
port: 3840
description: >-
  💿 mStream é um servidor de streaming de música auto-hospedado que permite transmitir sua coleção pessoal de músicas de qualquer lugar usando um navegador da web ou aplicativo compatível. Uma vez instalado, ele verifica seu diretório de músicas local e cria uma biblioteca que você pode acessar remotamente, disponibilizando suas músicas em seu telefone, tablet ou computador sem depender de serviços de terceiros.


  Ele suporta formatos de áudio de alta qualidade, como FLAC, e oferece reprodução contínua para uma experiência auditiva suave e ininterrupta. A interface do usuário é limpa, responsiva e fácil de navegar, proporcionando uma experiência familiar semelhante às plataformas musicais comerciais.


  Como o mStream é de código aberto e funciona inteiramente em seu próprio hardware, todas as suas músicas e dados permanecem privados. Não há anúncios, assinaturas e coleta de dados, o que o torna uma solução confiável e focada na privacidade para gerenciar e desfrutar de sua biblioteca de música em seus próprios termos.
