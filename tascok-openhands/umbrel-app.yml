releaseNotes: >-
  Version 0.32.0 of OpenHands introduces several enhancements and new features. Vision-based browsing is now enabled by default, allowing OpenHands to view PDFs and images in the browser. The update also adds support for multiple providers (like GitHub and GitLab) and includes improvements to error handling, pull request behavior, and onboarding workflows.
