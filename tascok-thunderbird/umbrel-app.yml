id: tascok-thunderbird
name: Thunderbird
tagline: Um cliente de e-mail seguro, flexível e eficiente
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-thunderbird/logo.png
category: networking
version: "24.12.1"
port: 5858
description: >-
  ✉️ Thunderbird é um cliente de e-mail gratuito e de código aberto desenvolvido pela Mozilla Foundation, projetado para oferecer aos usuários uma plataforma segura, personalizável e rica em recursos para gerenciar e-mails, calendários, contatos e tarefas. Ele suporta múltiplas contas de e-mail, permitindo aos usuários gerenciar vários endereços de e-mail (via IMAP, POP e SMTP) a partir de uma única interface.


  O cliente oferece ferramentas organizacionais avançadas, como filtragem de mensagens, marcação e estruturas de pastas personalizáveis, facilitando a classificação e localização de e-mails. Ele também se integra a calendários e ferramentas de gerenciamento de tarefas, suportando calendários locais e online, com a capacidade de adicionar extensões para recursos aprimorados de calendário.


  A segurança é uma prioridade no Thunderbird, com opções integradas para criptografia de e-mail, proteção contra phishing e filtragem de spam. Os usuários também podem adicionar assinaturas digitais para aumentar a segurança do e-mail.


  Um ponto forte do Thunderbird é o suporte para uma ampla gama de complementos, permitindo aos usuários ampliar sua funcionalidade. Esses complementos cobrem tudo, desde ajustes de layout e aparência até ferramentas de produtividade e melhorias de privacidade.


  Com atualizações regulares e uma comunidade dedicada de desenvolvedores, o Thunderbird continua sendo uma escolha confiável para usuários que buscam uma solução de e-mail de código aberto, privada e flexível para uso pessoal e profissional.
