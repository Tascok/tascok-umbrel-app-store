name: Peppermint
tagline: Uma solução de gerenciamento de problemas e help desk
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-peppermint/logo.png
category: developer tools
version: "0.5.5"
port: 3588
description: >-
  🍵 Peppermint é um aplicativo de gerenciamento de tickets e helpdesk que ajuda as equipes a organizar e responder às solicitações de suporte de forma estruturada e eficiente. Ele coleta mensagens recebidas, geralmente de e-mail, e as transforma automaticamente em tickets individuais que podem ser rastreados, atribuídos e atualizados à medida que a conversa continua. Cada ticket mantém o histórico completo de respostas, anexos e notas internas, permitindo que os agentes de suporte vejam rapidamente todo o contexto de um problema e respondam com confiança.


  As equipes podem se comunicar diretamente com os usuários por meio da interface do ticket e, ao mesmo tempo, discutir assuntos em particular por meio de comentários internos. Os tickets podem receber um status como aberto, pendente ou resolvido e podem ser atribuídos a membros específicos da equipe para prestação de contas. O sistema agrupa e classifica os tickets por vários critérios, como data ou status, facilitando a priorização do trabalho e evitando que questões importantes sejam ignoradas.


  O Peppermint também inclui ferramentas de marcação e filtragem para que as equipes possam categorizar tickets e encontrar casos relacionados rapidamente. Sua função de pesquisa facilita a localização de conversas anteriores ou o rastreamento de problemas em andamento ao longo do tempo. A interface é limpa e projetada para manter o foco na tarefa de suporte em si, sem adicionar complexidade ou distrações desnecessárias.


  O aplicativo funciona com endereços de e-mail existentes e pode converter automaticamente e-mails recebidos em tickets. Quando um agente de suporte responde dentro do aplicativo, a resposta é enviada de volta ao remetente original por e-mail e sua resposta será capturada como parte do ticket em andamento. Isso cria um fluxo contínuo entre o usuário e a equipe de suporte, sem exigir qualquer configuração especial por parte do usuário.


  O Peppermint ajuda as equipes a se manterem organizadas, melhora a velocidade e a qualidade das respostas e fornece um sistema claro e simples para lidar com as interações de suporte do início ao fim.
