releaseNotes: >-
  Version 4.0 introduces a completely refactored backend along with partial frontend updates that include multiple bug fixes and new features. 


  It adds recurring expenses, optional tags for better categorization, improved UI elements, support for negative expenses and positive income, smart CSV import, the option to use Postgres as a backend, and expanded currency options with customizable decimal and separator formats.
