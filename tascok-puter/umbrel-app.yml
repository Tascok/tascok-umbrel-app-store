manifestVersion: 1
id: tascok-puter
name: Puter
tagline: Um sistema operacional de Internet avançado e de código aberto
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-puter/logo.png
category: files & productivity
version: "2.4.2"
port: 4100
description: >-
  Puter é um sistema operacional de Internet avançado e de código aberto, projetado para ser rico em recursos, excepcionalmente rápido e altamente extensível. Puter pode ser usado como:


  🔒 Uma nuvem pessoal que prioriza a privacidade para manter todos os seus arquivos, aplicativos e jogos em um local seguro, acessível de qualquer lugar e a qualquer hora.


  🕹️ Uma plataforma para construção e publicação de sites, aplicativos web e jogos.


  💾 Uma alternativa ao Dropbox, Google Drive, OneDrive, etc. com uma interface nova e recursos poderosos.


  📡 Um ambiente de desktop remoto para servidores e estações de trabalho.


  🤝 Um projeto e comunidade amigável e de código aberto para aprender sobre desenvolvimento web, computação em nuvem, sistemas distribuídos e muito mais!


developer: Puter Technologies Inc.
website: https://puter.com/
submitter: Tascok
submission: https://github.com/dennysubke/dennys-umbrel-app-store
