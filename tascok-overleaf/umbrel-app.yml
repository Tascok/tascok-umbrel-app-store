description: >-
  Overleaf é uma plataforma baseada na web que fornece um ambiente amigável para criação e edição de documentos LaTeX. LaTeX é um sistema de composição amplamente utilizado, especialmente em áreas acadêmicas e técnicas, para criar documentos profissionais bem formatados, como artigos de pesquisa, dissertações, relatórios técnicos e artigos acadêmicos.


  A plataforma permite aos usuários escrever e editar documentos LaTeX diretamente em seus navegadores, sem a necessidade de instalar o LaTeX localmente. Overleaf cuida da compilação do código LaTeX em seus próprios servidores, reduzindo a carga de trabalho dos usuários e fornecendo resultados rápidos. Isso é especialmente benéfico para iniciantes, pois eles não precisam lidar com a instalação e configuração muitas vezes complexas do LaTeX em suas máquinas pessoais.


  Um recurso de destaque do Overleaf é sua funcionalidade de colaboração em tempo real. Equipes, grupos de pesquisa ou turmas podem trabalhar em um documento simultaneamente, com todas as alterações exibidas instantaneamente. Este recurso é particularmente útil para projetos acadêmicos que envolvem múltiplas pessoas contribuindo para um único documento. Overleaf também oferece controle completo de versão, permitindo que os usuários acessem versões anteriores de um documento e rastreiem alterações feitas por colaboradores.


  Overleaf também oferece suporte à integração com plataformas externas como GitHub, Dropbox e Zotero, facilitando o gerenciamento de referências e a colaboração. Ele fornece modelos para vários tipos de documentos, desde artigos de pesquisa até apresentações e currículos, facilitando aos usuários a introdução a formatos específicos. A plataforma também oferece uma ampla gama de pacotes e recursos LaTeX, permitindo aos usuários incorporar fórmulas matemáticas, tabelas complexas e figuras com facilidade.


  Além disso, os usuários podem exportar seus documentos em diferentes formatos, incluindo PDF, HTML e Word. Overleaf inclui extensa documentação e tutoriais para ajudar usuários iniciantes e avançados a utilizar plenamente os recursos do LaTeX. Com sua combinação de facilidade de uso, recursos de colaboração e funcionalidades poderosas, o Overleaf se tornou uma das plataformas mais populares para usuários de LaTeX em todo o mundo.


  🔑 Assim que a instância Overleaf estiver em execução, visite "umbrel.local:8063/launchpad" para configurar seu primeiro usuário administrador.
