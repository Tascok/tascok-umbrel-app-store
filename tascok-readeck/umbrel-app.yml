description: >-
  📚 Readeck é um aplicativo de código aberto auto-hospedado projetado para ajudar os usuários a salvar, organizar e arquivar conteúdo da web para leitura posterior. Ao contrário das ferramentas tradicionais de bookmarking ou dos serviços comerciais de leitura posterior, Readeck enfatiza a privacidade, o controle e o acesso de longo prazo. É uma alternativa poderosa para quem deseja coletar e revisitar artigos, postagens de blogs ou outros textos baseados na web sem depender de serviços de terceiros.


  Basicamente, o Readeck permite capturar o conteúdo de páginas da web e armazená-los em um arquivo local ou remoto. Este arquivo inclui todas as mídias, como imagens e formatação, garantindo que o conteúdo salvo permaneça acessível mesmo se o site original ficar offline ou mudar. Cada artigo pode ser armazenado permanentemente e acessado por meio de uma interface limpa e sem distrações, otimizada para uma leitura confortável.


  Uma das características mais distintivas do Readeck é a capacidade de exportar artigos salvos como arquivos EPUB. Isso facilita a leitura de coleções de conteúdo selecionadas em leitores de e-books, como o Kindle ou outros dispositivos portáteis. Esteja você salvando um único artigo ou uma série inteira, o Readeck empacota tudo em um formato que pode viajar com você e ser consumido offline.


  Readeck é escrito em Go e não requer uma infraestrutura complexa para funcionar. Pode operar sem banco de dados, mas também oferece suporte a PostgreSQL para usuários que preferem armazenamento estruturado e configurações avançadas. O aplicativo é leve e projetado para ser eficiente sem sacrificar a funcionalidade.


  Ao combinar a confiabilidade do acesso offline com modernas tecnologias web, Readeck oferece uma solução refrescante e independente para gerenciamento de material de leitura. Ele coloca os usuários de volta no controle de suas próprias listas de leitura, livres de anúncios, rastreamento e dependência de plataforma.
