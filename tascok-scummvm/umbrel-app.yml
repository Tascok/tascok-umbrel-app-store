description: >-
  ScummVM traz décadas de história de jogos clássicos diretamente para o seu Umbrel. Ele permite que você jogue centenas de aventuras de apontar e clicar, jogos de RPG e histórias interativas através de uma interface conveniente baseada em navegador. Redescubra títulos lendários de séries como Monkey Island, King’s Quest, Broken Sword, Simon the Sorcerer e muito mais, sem precisar dos sistemas operacionais ou hardware originais para os quais foram projetados.


  Em vez de emular um computador inteiro, o ScummVM recria os motores de jogo individuais usados ​​pelos títulos suportados. Essa abordagem fornece compatibilidade aprimorada em sistemas modernos, preservando os gráficos, áudio, jogabilidade e atmosfera originais. Os jogos podem ser adicionados a uma biblioteca central, pesquisados, agrupados e iniciados através do iniciador ScummVM integrado.


  ScummVM oferece dimensionamento gráfico configurável, configurações de áudio, legendas, seleção de idioma, mapeamentos de teclado e opções específicas de jogos. O gerenciamento integrado de salvamento e carregamento facilita a continuação de uma aventura, enquanto os salvamentos automáticos ajudam a proteger seu progresso. Muitos jogos também se beneficiam de correções específicas de motor, controles aprimorados e melhorias de qualidade de vida que não estavam disponíveis em seus lançamentos originais.


  Executar o ScummVM no Umbrel oferece uma biblioteca pessoal de jogos retrô que pode ser acessada a partir de um navegador da web em sua rede local. Seus arquivos de jogos, configurações e jogos salvos permanecem armazenados em seu próprio Umbrel, proporcionando um local privado e centralizado para sua coleção de aventuras clássicas.


  ⚠️ ScummVM não inclui jogos comerciais ou dados de jogos protegidos por direitos autorais. Para jogar um título compatível, você deve fornecer os arquivos de dados necessários de uma cópia do jogo que você possui legalmente.
