name: Super Productivity
tagline: Uma maneira eficiente de gerenciar tarefas, tempo e projetos em um só lugar
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-superproductivity/logo.png
