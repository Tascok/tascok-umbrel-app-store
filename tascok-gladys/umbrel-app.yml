description: >-
  🏠 Gladys Assistant é uma plataforma de automação residencial de código aberto e rica em recursos, projetada para tornar o gerenciamento e o controle de dispositivos domésticos inteligentes simples, seguros e altamente personalizáveis. Quer você seja novo na automação residencial ou um usuário avançado, a Gladys oferece uma solução abrangente que centraliza o controle de vários dispositivos IoT, permitindo criar uma experiência doméstica inteligente totalmente automatizada e personalizada.


  Um dos principais pontos fortes do Gladys Assistant é sua capacidade de integração com uma ampla variedade de produtos e serviços domésticos inteligentes, desde luzes, termostatos e câmeras de segurança até monitores de energia e detectores de movimento. Essa compatibilidade permite reunir todos os seus dispositivos em uma plataforma, eliminando a necessidade de conciliar vários aplicativos ou sistemas. Você pode gerenciar tudo facilmente a partir de um painel fácil de usar, disponível no desktop ou no celular, oferecendo controle em tempo real e informações sobre o status da sua casa.


  No coração do Gladys Assistant está seu poderoso mecanismo de automação. Ele permite que você configure rotinas e automações personalizadas que respondem a gatilhos específicos, como ajustar seu termostato com base no clima, desligar eletrodomésticos ao sair de casa ou receber alertas instantâneos quando for detectado movimento em determinadas áreas. Essas automações podem ser adaptadas às suas necessidades específicas, ajudando você a criar um ambiente doméstico mais inteligente e eficiente.


  Um dos principais benefícios do Gladys Assistant é sua ênfase na privacidade e na auto-hospedagem. Ao contrário de muitas outras plataformas domésticas inteligentes que dependem de serviços em nuvem, o Gladys pode ser hospedado em seu próprio servidor ou em dispositivos como Raspberry Pi, garantindo que todos os seus dados permaneçam em sua própria rede e permaneçam privados. Você tem controle total sobre seus dados, sem acesso de terceiros, sendo a escolha perfeita para quem valoriza segurança e privacidade em seus sistemas de automação residencial.


  Além disso, Gladys Assistant oferece suporte a assistentes de voz populares, como Google Assistant e Amazon Alexa, permitindo o controle de voz sem usar as mãos em sua casa inteligente. Você pode comandar seus dispositivos facilmente por meio de comandos de voz simples, agregando ainda mais comodidade ao seu dia a dia.


  Gladys Assistant também possui uma comunidade ativa de desenvolvedores e usuários que contribuem continuamente para o seu desenvolvimento. Isso significa que novos recursos, integrações e atualizações são adicionados regularmente, mantendo a plataforma atualizada com as mais recentes tecnologias de casa inteligente. Esteja você automatizando suas luzes, gerenciando a segurança doméstica ou otimizando o uso de energia, o Gladys Assistant oferece uma solução poderosa, flexível e focada na privacidade para construir sua casa inteligente ideal.

