description: >-
  📝 ZenNotes é um poderoso aplicativo de anotações para criar, editar e organizar notas Markdown. Ele ajuda os usuários a construir coleções de conhecimento estruturadas, conectar ideias relacionadas e encontrar informações rapidamente por meio de pesquisa de texto completo.


  As notas podem ser organizadas com tags, listas de tarefas, Wikilinks e backlinks. Links no formato [[Nome da nota]] conectam notas relacionadas, enquanto backlinks mostram quais outras notas fazem referência à página aberta no momento. As notas diárias e semanais facilitam o registro de tarefas, eventos, ideias e informações recorrentes.


  ZenNotes fornece ampla navegação por teclado com comandos Vim, atalhos personalizáveis, macros e registros. Várias notas podem ser abertas lado a lado em visualizações divididas, enquanto as notas usadas com frequência podem ser fixadas e mantidas visíveis para referência rápida.


  O aplicativo oferece suporte a fórmulas matemáticas, diagramas e visualizações gráficas. KaTeX pode ser usado para exibir equações, enquanto Mermaid, TikZ, JSXGraph e gráficos de funções permitem aos usuários criar fluxogramas, desenhos técnicos, ilustrações matemáticas e gráficos interativos.


  Uma visualização integrada renderiza texto formatado, tabelas, listas de tarefas, fórmulas e diagramas diretamente no aplicativo. Coleções Markdown existentes e cofres Obsidian também podem ser usados, preservando estruturas de pastas atuais, Wikilinks e notas conectadas.


  ZenNotes também inclui uma ferramenta de linha de comando para pesquisar, abrir, criar e processar notas. Seu servidor MCP integrado permite que assistentes de IA compatíveis pesquisem, resumam, conectem e ajudem a editar informações armazenadas na coleção de notas.
