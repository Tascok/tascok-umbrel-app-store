manifestVersion: 1
id: tascok-bookstack
name: BookStack
tagline: Uma maneira organizada de gerenciar e compartilhar seu conhecimento
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-bookstack/logo.png
category: files & productivity
version: "25.02.5"
port: 8875
description: >-
  📘 BookStack é um aplicativo de código aberto projetado para ajudar indivíduos e equipes a organizar, gerenciar e compartilhar bases de conhecimento e documentação. Possui uma estrutura semelhante a um livro, onde o conteúdo é claramente dividido em livros, capítulos e páginas. Essa abordagem hierárquica facilita a criação, estruturação e navegação em grandes quantidades de informações, seja para um pequeno projeto pessoal ou para uma extensa base de conhecimento baseada em equipe.


  A plataforma oferece suporte a Markdown para formatação de conteúdo, permitindo aos usuários criar rapidamente conteúdo bem estruturado e legível com o mínimo de esforço. Além disso, o BookStack oferece uma poderosa função de pesquisa de texto completo, permitindo que os usuários encontrem rapidamente informações relevantes em sua base de conhecimento. Isto é particularmente útil ao lidar com uma grande coleção de documentos e garante que os usuários possam acessar com eficiência os dados de que necessitam.


  BookStack também inclui recursos flexíveis de controle de acesso de usuário, permitindo que os administradores definam permissões específicas para usuários ou grupos. Isso o torna uma solução ideal para ambientes colaborativos, pois as equipes podem trabalhar juntas enquanto mantêm o controle sobre quem pode visualizar, editar ou gerenciar diferentes partes da documentação.


  Como uma solução auto-hospedada na Umbrel, o BookStack oferece aos usuários controle total sobre o gerenciamento de seus dados e conteúdo. Quer seja usado para gerenciamento de conhecimento pessoal ou documentação baseada em equipe, o BookStack fornece uma plataforma confiável, fácil de usar e personalizável para organizar e compartilhar informações de maneira eficaz.


  🔑 O primeiro login é feito utilizando as credenciais de administrador padrão: nome de usuário “admin@admin.com” e senha “senha”, que devem ser alteradas imediatamente após o primeiro login.
