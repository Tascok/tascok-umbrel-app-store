name: FileBrowser Quantum
tagline: Um navegador de arquivos melhor que o Filebrowser
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-filebrowser-quantum/logo.png
category: files & productivity
version: "0.7.8"
port: 8633
description: >-
  📂 Filebrowser Quantum é uma versão moderna e avançada do conhecido aplicativo File Browser escrito em Go. Ele oferece uma interface web rápida, limpa e amigável que permite aos usuários gerenciar arquivos e diretórios diretamente em seus navegadores. Com o Filebrowser Quantum, os usuários podem fazer upload, download, mover, renomear, excluir e editar arquivos sem a necessidade de nenhum software adicional. Cada usuário pode ter um diretório inicial pessoal com permissões personalizadas que controlam o acesso a arquivos e pastas.


  O que diferencia o Filebrowser Quantum é seu poderoso mecanismo de pesquisa baseado em índice. Ao contrário dos gerenciadores de arquivos tradicionais que verificam diretórios sob demanda, esta versão cria e mantém um índice de pesquisa em segundo plano. Isso significa que os resultados da pesquisa aparecem instantaneamente conforme o usuário digita, mesmo quando trabalha com estruturas de arquivos grandes e complexas. Isso torna o gerenciamento e a localização de arquivos muito mais rápidos e eficientes.


  O aplicativo também apresenta recursos de autenticação modernos, incluindo suporte para tokens ao portador. Isso permite a integração com serviços de autenticação externos e possibilita o acesso programático ao aplicativo usando sua API REST bem projetada. A API oferece aos desenvolvedores e administradores controle total sobre arquivos e diretórios por meio de ferramentas ou scripts automatizados.


  Filebrowser Quantum concentra-se em desempenho, segurança e facilidade de uso. Ele atualiza e simplifica a base de código subjacente usando dependências atuais e removendo componentes desatualizados. Isso garante que o aplicativo permaneça confiável, de fácil manutenção e pronto para desenvolvimento futuro. É uma solução ideal para usuários que desejam um poderoso gerenciador de arquivos auto-hospedado com recursos de pesquisa rápida e controles de acesso flexíveis.
