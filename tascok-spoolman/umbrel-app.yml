releaseNotes: >-
  This release includes several new features and improvements:

    - Removed country flags from language selector for clarity  
    - Added Japanese, Brazilian Portuguese, Tamil, and Thai languages  
    - Fixed broken elements like the archive spool button  
    - Fixed crash when adding numeric extra fields without defaults  
    - Fixed number input overriding user input behavior  
    - Fixed excessive trimming of trailing zeroes on locations page  
    - Fixed color type selection in filament color picker  
    - Added autofocus to number input in adjust spool popup
