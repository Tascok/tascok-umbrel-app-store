description: >-
  🗺️ Wanderer é uma plataforma auto-hospedada e de código aberto projetada para entusiastas de atividades ao ar livre que desejam gerenciar, explorar e compartilhar rotas de caminhada e ciclismo em seus próprios termos. Ele fornece uma interface limpa e moderna para fazer upload de arquivos GPX, desenhar novas rotas em um mapa interativo e organizá-las com metadados detalhados, como dificuldade, duração e ganho de elevação. O Wanderer suporta pesquisa de texto completo e filtragem poderosa para ajudar os usuários a encontrar exatamente a rota que procuram com base em vários critérios, como região, duração ou tipo de atividade.


  O aplicativo dá grande ênfase à privacidade do usuário e à propriedade dos dados, oferecendo uma experiência totalmente offline que pode ser executada em seu próprio servidor sem qualquer envolvimento de terceiros. Ele usa camadas de mapas abertas de provedores como OpenStreetMap e permite a exportação GPX para que as rotas possam ser usadas com dispositivos de navegação comuns.


  O Wanderer é especialmente popular entre pessoas que gostam de organizar sua coleção pessoal de trilhas ou de compartilhar experiências ao ar livre com um grupo, clube ou comunidade local. É fácil de implantar em plataformas de auto-hospedagem, como YunoHost, e oferece suporte a recursos colaborativos que o tornam útil para pequenas equipes ou famílias que planejam atividades ao ar livre juntas. Seu design limpo, forte foco na privacidade e independência de plataformas comerciais fazem dele uma solução ideal para quem valoriza o controle sobre seus dados externos.
