name: Doom
tagline: Uma passagem só de ida para o Inferno, e você está dirigindo o ônibus
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-doom/logo.png
category: gaming
version: "0.1"
port: 4113
description: >-
  Doom é o clássico de ação definitivo que mudou para sempre o mundo dos videogames em 1993. Em um mundo onde "atirar e correr" se tornou o lema da vida, você assume o papel de um fuzileiro naval sem nome, abrindo caminho através dos portões do Inferno - sem medo, sem piedade. Sua missão? Salve a Terra de uma invasão de criaturas demoníacas do Inferno. Parece simples, certo? Bem, o Inferno está cheio de surpresas e os demônios estão realmente de mau humor!


  Armado com nada além de sua confiança nas balas e uma arma na mão, você deve explodir hordas intermináveis ​​de monstros – e fazer isso nos cantos mais escuros das estações marcianas e nas fortalezas subterrâneas do Inferno. De Diabretes assustadores a enormes Ciberdemônios, Doom oferece tudo o que o coração de um fã de ação poderia desejar. E a melhor parte? A velocidade do jogo é tão rápida que você dificilmente notará como você mergulha ainda mais na loucura ao conquistar o Inferno, nível por nível.


  Doom prova que tudo que você precisa é de uma arma rápida, um instinto de sobrevivência inabalável e uma boa dose de loucura para abrir caminho pelo submundo. Pode ser antigo, mas o Inferno nunca foi tão divertido.


  Doom roda em praticamente qualquer coisa! Do seu antigo PC para jogos a um cortador de grama, uma máquina de café e agora até mesmo ao seu servidor Umbrel - os demônios nunca descansam, nem o seu hardware!


  ⚠️ Doom funciona melhor em navegadores baseados em Chromium. O Firefox pode encontrar problemas de compatibilidade devido ao WebGL ou restrições de segurança.
