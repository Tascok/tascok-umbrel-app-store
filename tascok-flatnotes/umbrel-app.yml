id: tascok-flatnotes
name: Flatnotes
tagline: Um aplicativo de anotações auto-hospedado com armazenamento de arquivos Markdown simples
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-flatnotes/logo.png
category: files & productivity
version: "5.5.4"
port: 8061
description: >-
  Flatnotes é um aplicativo de anotações de código aberto projetado com foco na simplicidade e facilidade de uso. Permite aos usuários criar e gerenciar suas anotações em um formato claro e estruturado, facilitando a organização de pensamentos e ideias. 


  Aqui estão alguns dos principais recursos que fazem o Flatnotes se destacar:


  ✍️ Suporte Markdown: Flatnotes suporta o formato Markdown, o que significa que os usuários podem formatar e estruturar facilmente seu texto, permitindo notas mais expressivas e visualmente atraentes.


  ✨ Interface de usuário simples: O aplicativo possui uma interface de usuário minimalista que garante uma navegação rápida e intuitiva, permitindo que os usuários se concentrem em suas anotações sem distrações desnecessárias.


  🔄 Sincronização: Flatnotes pode sincronizar com vários serviços em nuvem, proporcionando aos usuários acesso às suas notas em diferentes dispositivos e garantindo que suas informações estejam sempre atualizadas.


  🌐 Open Source: Por ser um projeto de código aberto, o Flatnotes convida os desenvolvedores a customizar e ampliar suas funcionalidades, promovendo um ambiente colaborativo para inovação e melhoria.


  Em resumo, Flatnotes é uma excelente escolha para usuários que procuram uma solução descomplicada e eficiente para suas necessidades de anotações. Com ênfase na facilidade de uso e flexibilidade, ele atende a qualquer pessoa, desde usuários casuais até desenvolvedores que buscam uma ferramenta simples para gerenciar suas anotações.


  🔑 O nome de usuário inicial é “admin” e a senha é “umbrel”.

