releaseNotes: >-
  GIMP 2.10.38 introduces support for Windows Ink, resolving issues with drawing tablets such as unresponsive buttons, incorrect pressure sensitivity, and lagging brush movement. Additionally, several bugs have been fixed, including crashes on exit, issues with very small selections, and improvements in transparent PNG exports and filter controls.
