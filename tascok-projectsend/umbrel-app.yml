releaseNotes: >-
  The latest ProjectSend update (r1720) introduces highly requested folders and subfolders with drag-and-drop rearrangement and breadcrumb navigation. It also adds features like showing image dimensions, support for SVG branding images, improved file management options, SMTP environment variable support, and multiple bug fixes including PHP 8 warnings and 2FA validation. Admin pages have been improved for session handling, and security updates address vulnerabilities and dependency upgrades.
