description: >-
  🛡️ Bisq é uma bolsa ponto a ponto descentralizada que permite comprar e vender Bitcoin diretamente com outras pessoas, sem entregar a custódia de seus fundos a uma bolsa centralizada.


  🌐 A interface completa do desktop Bisq é executada continuamente no seu Umbrel e está disponível através do seu navegador. Ofertas, comunicação comercial, conectividade Tor, carteira integrada, contas de pagamento e tratamento de disputas permanecem acessíveis mesmo quando o computador está desligado.


  🔐 Dados da carteira, informações da conta de pagamento, histórico de negociações e configurações são armazenados localmente no seu Umbrel. A interface do navegador é protegida pela autenticação Umbrel e nenhuma porta VNC é exposta diretamente.


  ⚠️ Bisq contém uma carteira quente. Armazene apenas o valor necessário para negociações ativas e depósitos de segurança e faça backup da semente da sua carteira e dos dados do Bisq antes de financiá-la.


  💻 Este aplicativo está disponível apenas para sistemas AMD64/x86-64 e não é compatível com Raspberry Pi ou outros dispositivos ARM64. Bisq consome muitos recursos porque executa Java, um ambiente de desktop completo, Tor, serviços de carteira e grandes conjuntos de dados de rede. Recomenda-se pelo menos 8 GB de RAM e 4 núcleos de CPU, especialmente para a inicialização inicial e importação de dados DAO.


  📖 Para orientações detalhadas de instalação, requisitos do sistema e mais informações, consulte o README: 


  https://github.com/dennysubke/dennys-umbrel-app-store/blob/master/tascok-bisq/README.md
