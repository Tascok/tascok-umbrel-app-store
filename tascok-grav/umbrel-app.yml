name: Grav
tagline: Uma plataforma Web baseada em arquivos rápida, simples e flexível
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-grav/logo.png
category: developer tools
version: "1.7.48"
port: 8888
description: >-
  👨‍🚀 Grav é um sistema de gerenciamento de conteúdo (CMS) moderno, de código aberto e de arquivo simples que prioriza velocidade, simplicidade e flexibilidade. Ao contrário das plataformas CMS tradicionais como WordPress ou Joomla, Grav não depende de um banco de dados para armazenar conteúdo. Em vez disso, ele usa uma arquitetura de arquivo simples, onde o conteúdo é armazenado em arquivos Markdown e as configurações são tratadas com YAML, tornando-o leve e altamente portátil.


  O que torna o Grav único?


  📂 Arquitetura de arquivo simples: Grav elimina a necessidade de configurações complexas de banco de dados, o que reduz a sobrecarga do servidor e simplifica a instalação e manutenção. O conteúdo é armazenado em uma estrutura de pastas intuitiva, permitindo fácil edição diretamente em arquivos de texto.


  ⚡ Velocidade e desempenho: com requisitos mínimos de servidor, o Grav é otimizado para velocidade. Ele usa cache, redimensionamento dinâmico de imagens e outras ferramentas integradas para garantir tempos de carregamento rápidos, mesmo em servidores com poucos recursos.


  ✨ Facilidade de uso: embora o Grav possa ser gerenciado por desenvolvedores usando editores de texto e linha de comando, ele também oferece um plug-in opcional do painel de administração. Isso fornece uma interface amigável para usuários não técnicos gerenciarem páginas, plug-ins, temas e configurações do site.


  🎨 Flexibilidade e Personalização: O design modular do Grav permite aos usuários estender sua funcionalidade com vários plug-ins e personalizar sua aparência com temas flexíveis. Os desenvolvedores podem aproveitar ferramentas como modelos Twig, Markdown para conteúdo e YAML para configuração para criar soluções personalizadas.


  💻 Amigável ao desenvolvedor: a API do Grav e a base de código bem documentada tornam mais fácil para os desenvolvedores criarem plug-ins, temas ou integrações personalizados. Ele usa tecnologias e princípios modernos, como Composer para gerenciamento de dependências e ferramentas CLI para configuração e atualizações rápidas.


  🌍 Comunidade e ecossistema ativos: A comunidade Grav contribui com uma ampla gama de temas e plugins, garantindo que os usuários tenham acesso a ferramentas de SEO, mídias sociais, e-commerce, formulários e muito mais. Atualizações regulares mantêm o Grav seguro e compatível com as tecnologias mais recentes.


  Casos de uso ideais:


  📝 Blogs pessoais: configuração simples e rápida para uma plataforma de blog pessoal.


  🖼️ Portfólios: designs impressionantes e tempos de carregamento rápidos são ótimos para apresentar trabalhos criativos.


  📚 Sites de documentação: sua estrutura de arquivo simples e suporte Markdown tornam o Grav perfeito para documentação técnica.


  💼 Sites para pequenas empresas: crie facilmente sites profissionais sem muita sobrecarga de CMS.


  Por que escolher a Grav?


  🌌 Grav é ideal para usuários que valorizam simplicidade, velocidade e flexibilidade. Sua abordagem de arquivo simples atrai desenvolvedores e usuários avançados que desejam controle total, enquanto o painel de administração opcional o torna acessível para iniciantes. Quer você precise de um site rápido, uma solução leve ou uma plataforma personalizável, Grav combina tecnologia moderna com facilidade de uso para oferecer uma experiência CMS excepcional.


  ⚠️ Após a instalação, pode demorar um pouco para o Grav iniciar pela primeira vez. O Painel de Administração estará acessível após a configuração do usuário em: http://umbrel.local:8888/admin.

