releaseNotes: >-
  The R4.4.2 release includes several updates and fixes, such as automatic updates to container definition files, improvements in the installation process with the use of gdebi-core to install RStudio, and fixes to the devel builds of rocker/tidyverse and rocker/verse platforms. Additionally, it addresses cache issues for rocker/rstudio:devel and rocker/tidyverse:devel, removes outdated workarounds for old RStudio Server versions, and updates dependencies. 


  The release also includes minor version updates and general maintenance improvements.
