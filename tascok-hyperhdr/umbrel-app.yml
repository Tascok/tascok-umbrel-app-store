description: >-
  🌈 HyperHDR é um sistema avançado de iluminação ambiente que analisa fontes de vídeo e áudio em tempo real e transforma suas cores em efeitos de iluminação dinâmicos em torno de uma televisão, monitor ou configuração de entretenimento.


  O aplicativo captura conteúdo visual de capturadores de vídeo compatíveis, clientes de captura de software, fluxos de rede e fontes externas suportadas. Ele processa a imagem recebida, detecta as cores dominantes em regiões configuráveis ​​da tela e envia informações de cores sincronizadas para faixas de LED e luzes inteligentes conectadas.


  O HyperHDR oferece suporte a uma ampla variedade de controladores de LED e sistemas de iluminação, incluindo WLED, Philips Hue, luzes Home Assistant, dispositivos Zigbee2MQTT, controladores compatíveis com Adalight e vários drivers de LED baseados em rede. Várias instâncias de iluminação podem ser configuradas independentemente para diferentes telas, salas ou layouts de LED.


  A interface web integrada fornece ferramentas para organizar LEDs ao redor da tela, ajustar brilho, gama, equilíbrio de cores, suavização, taxas de atualização e configurações de processamento de imagem. Os usuários podem visualizar o vídeo capturado, testar LEDs individuais, criar efeitos personalizados, gerenciar prioridades e alternar entre diferentes fontes de entrada.


  O HyperHDR inclui mapeamento automático de tons HDR, calibração de cores baseada em LUT, suporte de vídeo HDR10 e P010, corte de imagem, detecção de barra preta e correção de cores configurável. Esses recursos ajudam a produzir iluminação ambiente precisa e responsiva em conteúdo SDR e HDR.


  APIs e protocolos de rede integrados permitem que aplicativos externos, reprodutores de mídia, clientes de captura e sistemas de automação residencial controlem os estados de iluminação, transmitam dados de imagem, acionem efeitos e integrem o HyperHDR em entretenimento mais amplo ou fluxos de trabalho domésticos inteligentes.
