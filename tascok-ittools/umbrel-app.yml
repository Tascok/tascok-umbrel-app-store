releaseNotes: >-
  The v2024.10.22 release of IT-tools introduces several new features, including a Regex Tester, Markdown to HTML converter, email normalizer, and tools for converting JSON to XML and vice versa. It also includes bug fixes such as improvements to favorites storage, debounced search input for the emoji picker, and UI adjustments for various tools.
