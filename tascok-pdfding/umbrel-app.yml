description: >-
  PdfDing é um gerenciador, visualizador e editor de PDF auto-hospedado, projetado para fornecer uma experiência de leitura perfeita em vários dispositivos. Ele permite que os usuários organizem, anotem e gerenciem sua coleção de PDFs de maneira eficiente, ao mesmo tempo em que acompanham a última posição lida. Com uma interface minimalista e rápida, o aplicativo concentra-se na facilidade de uso e na configuração direta, tornando-o uma escolha atraente para entusiastas de auto-hospedagem.


  O software oferece suporte a recursos como marcação em vários níveis, marcadores e arquivamento para ajudar os usuários a manter seus documentos bem organizados. Suas ferramentas de edição integradas permitem anotações, destaques e desenhos à mão livre diretamente em PDFs. Uma interface de usuário personalizável, incluindo modo escuro e opções de temas, aprimora a experiência de leitura.


  O PdfDing foi projetado para segurança e conveniência, com suporte para Single Sign-On (SSO) via OpenID Connect, garantindo integração suave com sistemas de autenticação existentes. O aplicativo pode ser facilmente implantado usando Docker, tornando-o acessível para usuários com conhecimento básico de auto-hospedagem. Uma versão demo está disponível online, mas para total controle e privacidade, recomenda-se executá-la em um servidor pessoal.
