name: Super Mario War
tagline: Um jogo de festa multijogador caótico
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-smw/logo.png
category: gaming
version: "2.0"
port: 8791
description: >-
  🍄💥 Super Mario War transforma seu Umbrel em um pequeno console de festa que acidentalmente iniciou um torneio de fim de amizade. Este aplicativo é sobre batalhas multijogador caóticas, onde o único objetivo é simplesmente pular sobre seus amigos antes que eles saltem sobre você.


  Os jogadores correm, pulam, pulam paredes, pisam e entram em pânico em pequenas arenas repletas de plataformas, armadilhas e pura bobagem. Um salto na hora certa pode nocautear um oponente, enquanto um movimento errado pode mandar você de volta à tela de respawn, questionando suas escolhas de vida.


  Power-ups aparecem constantemente e transformam cada partida em um belo caos. Bolas de fogo voam pela tela, projéteis saltam em todas as direções, bombas explodem exatamente onde alguém estava há um segundo e ninguém está realmente seguro. A habilidade é importante, mas a sorte e a traição são igualmente importantes.


  Diferentes modos de jogo mantêm as coisas novas e barulhentas. Às vezes é todos contra todos. Às vezes são as equipes que esquecem imediatamente que são equipes. Às vezes, trata-se de controlar áreas ou roubar objetivos enquanto é perseguido por encanadores furiosos. Cada modo garante gritos, risadas e pelo menos um jogador alegando que os controles estão quebrados.


  As rodadas são curtas, intensas e perfeitas para pausas rápidas ou longas noites de jogos com energia da Umbrel que deveriam ser produtivas. As regras são fáceis, a ação é rápida e o caos se adapta perfeitamente ao número de jogadores.


  Super Mario War é pura loucura multijogador com mecânica de plataforma clássica, piedade zero e diversão máxima. Um lembrete perfeito de que seu Umbrel não serve apenas para auto-hospedagem séria, mas também para bobagens sérias.
