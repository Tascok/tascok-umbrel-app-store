category: gaming
version: "1.0"
port: 5999
description: >-
  👾 RetroAssembly é uma plataforma projetada para permitir que os usuários criem e desfrutem de sua própria biblioteca pessoal de videogames retrô. Ele pega os arquivos ROM fornecidos pelo usuário e os transforma em uma coleção lindamente apresentada, completa com capa e informações detalhadas. A interface facilita a exploração da biblioteca, a busca por títulos específicos e a redescoberta de clássicos esquecidos de forma envolvente e organizada.


  Depois que um jogo é selecionado, ele pode ser iniciado imediatamente, proporcionando uma transição perfeita entre a navegação e o jogo. Todo o progresso é salvo automaticamente, permitindo que os jogadores retornem ao ponto exato do jogo a qualquer momento. Essa persistência garante que mesmo títulos longos e desafiadores possam ser concluídos em várias sessões sem perder nenhuma conquista.


  A experiência de jogo é aprimorada por uma variedade de recursos que recriam a sensação do hardware original ao mesmo tempo que adicionam conveniências modernas. Os filtros visuais imitam a aparência dos CRT clássicos e das telas portáteis, trazendo uma atmosfera autêntica a cada sessão. Uma função de retrocesso permite aos jogadores reverter o jogo em tempo real, oferecendo a oportunidade de repetir seções difíceis sem recomeçar completamente. Os estados de salvamento fornecem outra camada de controle, permitindo que os usuários preservem pontos específicos em um jogo para recargas rápidas.


  A navegação pela biblioteca e durante o jogo é suave e intuitiva, com suporte total para entrada de teclado e controlador. Cada elemento foi projetado para manter o foco nos próprios jogos, eliminando distrações desnecessárias e simplificando a diversão de tudo, desde sessões rápidas de ação no estilo arcade até longas aventuras que duram muitas horas.
