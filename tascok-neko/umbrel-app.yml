releaseNotes: >-
  Neko v3.0.0 marks a major milestone with significant updates to both the server and the application. The default registry has changed, multiarch builds are now available, and a REST API with OpenAPI 3.0 documentation has been introduced. Key features include new support for additional browsers, improved capture and desktop functionalities, and the addition of a plugin system. The server also now includes advanced user management, authentication options, and WebRTC enhancements, while the client is yet to be updated with these new features.
