releaseNotes: >-
  This update introduces support for Backblaze B2 and Azure Blob storage, webhook management, API keys, and editable searchable document content. It also adds a tag creation button, fixes ingestion configuration, properly handles file names without extensions, and excludes deleted documents from the document count.
