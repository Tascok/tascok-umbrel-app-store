version: "0.1.2"
port: 8377
description: >-
  O Pages transforma seu Umbrel em uma plataforma privada e lindamente projetada para publicação de sites estáticos. Comece com um modelo criado profissionalmente, importe um projeto existente como um arquivo ZIP ou crie um site do zero fazendo upload e editando HTML, CSS, JavaScript, JSON, Markdown e outros arquivos baseados em texto diretamente em seu navegador. Cada alteração pode ser revisada instantaneamente através da visualização ao vivo integrada.


  Um painel limpo mantém todos os seus sites organizados em um só lugar. Prepare novos projetos de forma privada como rascunhos, publique-os quando estiverem prontos e compartilhe-os através de sua rede local, um domínio personalizado, o serviço Onion compartilhado da Umbrel ou um endereço Onion persistente dedicado criado exclusivamente para um site individual.


  O Pages também inclui gerenciamento de arquivos, exportações ZIP, backups restauráveis, estatísticas de visualização de página, insights de armazenamento, compartilhamento de código QR, controles CORS, opções de cache e substituto de SPA. Esteja você hospedando um portfólio pessoal, documentação, uma landing page, um blog ou um perfil Nostr, o Pages fornece tudo o que você precisa para publicá-lo e gerenciá-lo diretamente do seu Umbrel.


  Seus sites, configurações, backups e identidades Onion permanecem armazenados localmente em seu Umbrel. O Pages fornece apenas conteúdo estático pré-construído e nunca executa código carregado no servidor.


  ⚙️ O acesso remoto ao Tor deve estar habilitado nas configurações do Umbrel para que o Pages use o endereço Onion compartilhado do Umbrel.
developer: dennysubke
