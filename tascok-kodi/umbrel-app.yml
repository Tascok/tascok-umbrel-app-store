manifestVersion: 1
id: tascok-kodi
name: Kodi Headless
tagline: Uma maneira simples de sincronizar e transmitir com Kodi
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-kodi/logo.png
category: media
version: "21.1"
port: 8585
description: >-
  Kodi Headless é uma versão do Kodi que opera sem interface gráfica de usuário. É usado principalmente quando o Kodi pretende funcionar como um servidor de mídia central, rodando em segundo plano sem a necessidade de uma tela ou interação direta do usuário. Isso significa que o Kodi pode atualizar e gerenciar automaticamente a biblioteca de mídia sem exigir que o usuário interaja com a interface visual usual.


  Esta configuração é especialmente útil para usuários que desejam tornar sua coleção de mídia acessível em vários dispositivos. Ao usar o Kodi Headless, pode ser utilizado um banco de dados central para a biblioteca de mídia, que pode ser acessado por vários clientes Kodi simultaneamente. Isso facilita o gerenciamento da biblioteca de mídia e a manutenção da sincronização entre diferentes dispositivos, pois todos os clientes exibem a mesma biblioteca.


  Outra vantagem do Kodi Headless é o menor consumo de recursos em comparação com a instalação padrão do Kodi com interface gráfica. Como nenhuma interface precisa ser renderizada, o Kodi Headless é particularmente eficiente em termos de recursos e funciona bem em dispositivos de baixo consumo de energia, como o Raspberry Pi ou em contêineres Docker. Isso permite que o Kodi atue como um servidor back-end que transmite mídia para outros dispositivos na rede, enquanto a interface do usuário é renderizada nesses dispositivos.


  No geral, o Kodi Headless é uma solução ideal para usuários que desejam gerenciamento e distribuição centralizados de mídia sem interagir constantemente com a interface gráfica do usuário do Kodi.
