manifestVersion: 1
id: tascok-ytptube
name: YTPTube
tagline: Uma WebGUI para yt-dlp com suporte para downloads simultâneos
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-ytptube/logo.png
category: media
version: "1.0.1"
port: 8562
description: >-
  📥 YTPTube é uma interface baseada na web para yt-dlp, projetada para agilizar o processo de download de vídeos de diversas plataformas online. Originalmente um fork do MeTube, o YTPTube evoluiu significativamente, introduzindo uma ampla gama de recursos adicionais para aprimorar a experiência do usuário. O projeto visa fornecer uma solução mais flexível e poderosa para gerenciamento de downloads de vídeos, mantendo uma interface intuitiva e amigável.


  Um dos principais aspectos do YTPTube é a capacidade de lidar com vários downloads simultaneamente, permitindo aos usuários colocar e processar vários vídeos ao mesmo tempo, sem intervenção manual. Isso é particularmente útil para aqueles que baixam frequentemente conteúdo em massa. Além disso, a plataforma suporta download de transmissões ao vivo, tornando-se uma ferramenta versátil para captura de conteúdo em tempo real.


  O YTPTube também oferece recursos de automação que permitem aos usuários agendar downloads para horários específicos. Isto é especialmente benéfico para aqueles que desejam recuperar automaticamente o conteúdo de canais ou listas de reprodução específicas sem precisar iniciar o processo manualmente. Paralelamente, a plataforma inclui um sistema de notificação que pode alertar os usuários quando um download for concluído ou se ocorrer algum problema durante o processo.


  Uma característica distintiva do YTPTube é sua capacidade de permitir configurações personalizadas por link. Os usuários podem definir configurações JSON específicas do yt-dlp, fornecer cookies personalizados ou definir formatos de saída individuais para cada download. Este nível de personalização garante que os usuários possam adaptar a experiência às suas necessidades específicas.


  Além dos recursos de download, o YTPTube integra um reprodutor de vídeo integrado que suporta uma ampla variedade de formatos, possibilitando a visualização do conteúdo baixado diretamente na interface. Também oferece suporte para arquivos de legenda externos, melhorando ainda mais a experiência de visualização.


  No geral, o YTPTube serve como uma ferramenta abrangente e rica em recursos para gerenciar downloads de vídeos com eficiência. Com suas opções avançadas e design fácil de usar, oferece uma solução completa para quem deseja baixar e organizar conteúdo de vídeo online com facilidade.


  🔑 O nome de usuário é ‘admin’ e a senha é ‘umbrel’.
