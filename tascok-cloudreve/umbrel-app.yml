name: Cloudreve
tagline: Um sistema de gerenciamento de arquivos auto-hospedado com suporte para várias nuvens
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-cloudreve/logo.png
