manifestVersion: 1
id: tascok-kokoro
name: Kokoro
tagline: Uma solução TTS inteligente e de alta qualidade
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-kokoro/logo.png
category: AI
version: "0.2.2"
port: 8877
description: >-
  Kokoro é um modelo avançado de conversão de texto em fala (TTS) que oferece qualidade de fala impressionante com apenas 82 milhões de parâmetros, tornando-o competitivo com modelos muito maiores e que consomem mais recursos. Apesar de sua arquitetura relativamente compacta, o Kokoro transforma efetivamente texto em fala clara e com som natural, tornando-o uma excelente escolha para aplicações que dependem de síntese de fala. O modelo foi projetado especificamente para garantir alta eficiência e processamento rápido, tornando-o adequado tanto para ambientes com recursos limitados quanto para sistemas de produção. Em comparação com os modelos TTS tradicionais, que muitas vezes requerem recursos computacionais substanciais, o Kokoro oferece uma alternativa mais económica e mais rápida, sem comprometer a qualidade da saída de voz.


  Sua arquitetura leve garante que o Kokoro possa ser implantado mesmo em dispositivos menos potentes, facilitando a integração em vários aplicativos. Os desenvolvedores podem usar o Kokoro em uma ampla variedade de projetos, seja para assistentes virtuais, sistemas interativos ou para melhorar a acessibilidade. O modelo não apenas fornece uma fala precisa e inteligível, mas também introduz nuances emocionais que melhoram a experiência do usuário. Com sua flexibilidade e capacidade de aplicação em diversos cenários, o Kokoro é um recurso valioso para quem busca uma solução de síntese de voz eficiente, leve e poderosa em seus projetos.


  ⚠️ Este aplicativo funciona apenas em navegadores baseados em Chromium (por exemplo, Chrome, Edge, Brave) e está disponível em "umbrel.local:8877/web/". Observe que o aplicativo tem aproximadamente 4 GB de tamanho, portanto o processo de carregamento pode demorar alguns instantes.


  ⚙️ A API está disponível em "umbrel.local:8877", e a documentação da API pode ser encontrada em "umbrel.local:8877/docs".
