releaseNotes: >-
  Version 0.17.0 of Wanderer brings improved performance when displaying many trails on the map and now recalculates elevation data on import for more accurate stats. It also fixes several issues, including missing tags on the front page, broken direct links to lists, and problems with uploading trails containing waypoints or summit logs.
