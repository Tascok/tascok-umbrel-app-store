description: >-
  🗺️ TRIP é um planejador de viagens minimalista e focado na privacidade que ajuda você a organizar suas ideias de viagem e pontos de interesse em um mapa interativo. Projetado para auto-hospedagem, permite gerenciar seus dados de viagem sem depender de serviços de terceiros ou armazenamento em nuvem. O aplicativo combina uma interface visual limpa com uma ferramenta de planejamento estruturada que lembra uma planilha, facilitando a documentação e categorização de cada destino.


  Com o TRIP, você pode adicionar metadados detalhados aos seus pontos de interesse, como se um local aceita cães, quanto custa ou quanto tempo leva para ser explorado. A interface suporta funções de filtragem e pesquisa para que você possa navegar rapidamente pelas suas entradas e refinar seus planos de viagem conforme necessário. Você também pode importar e exportar seus dados a qualquer momento, garantindo que suas informações permaneçam portáteis e sob seu controle.


  A plataforma dá grande ênfase à privacidade, oferecendo uma experiência livre de telemetria, onde nada é rastreado ou compartilhado. Tudo é executado localmente e o código-fonte é totalmente aberto, permitindo que você inspecione, adapte ou contribua conforme achar necessário. Esteja você planejando uma escapadela de fim de semana ou uma aventura em vários países, o TRIP ajuda você a se manter organizado enquanto mantém seus dados seguros e totalmente em suas mãos.
