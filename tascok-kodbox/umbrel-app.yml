manifestVersion: 1
id: tascok-kodbox
name: kodbox
tagline: Um gerenciador de arquivos baseado na Web para armazenamento em nuvem sem esforço
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-kodbox/logo.png
category: files & productivity
version: "1.56"
port: 8383
description: >-
  KodCloud é uma plataforma avançada de gerenciamento de arquivos baseada na web que traz eficiência e facilidade ao armazenamento em nuvem e organização de arquivos. Ele oferece aos usuários uma interface altamente intuitiva e fácil de usar, simplificando o gerenciamento, o armazenamento e o compartilhamento de arquivos entre dispositivos. Esteja você lidando com documentos, imagens ou outros tipos de conteúdo, o KodCloud oferece uma experiência perfeita para acessar e organizar seus arquivos.


  A plataforma foi projetada pensando na colaboração, permitindo que os usuários compartilhem facilmente arquivos e pastas com outras pessoas, mantendo o controle sobre permissões e acesso. Além disso, o KodCloud pode ser integrado a outros serviços em nuvem, aumentando sua flexibilidade e usabilidade tanto para uso pessoal quanto profissional. Com suas ferramentas poderosas e recursos personalizáveis, KodCloud é uma excelente escolha para quem procura uma maneira robusta e eficiente de gerenciar seus arquivos baseados em nuvem.
