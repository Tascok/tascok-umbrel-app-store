description: >-
  Appwrite é uma plataforma de back-end de código aberto para desenvolvedores que desejam construir aplicativos modernos para web, dispositivos móveis e servidores sem configurar todos os componentes de back-end do zero.


  Ele fornece um conjunto completo de serviços de back-end prontos para uso em um só lugar, incluindo autenticação, gerenciamento de usuários, bancos de dados, armazenamento de arquivos, funções sem servidor, atualizações em tempo real, mensagens e hospedagem na web. Com o Appwrite, os desenvolvedores podem se concentrar na construção de seus aplicativos, enquanto o Appwrite lida com muitos dos principais recursos de back-end que geralmente são necessários para projetos prontos para produção.


  A plataforma é especialmente útil para criar painéis, aplicativos móveis, produtos SaaS, ferramentas internas, protótipos e aplicativos web personalizados. Oferece SDKs e APIs que facilitam a conexão de aplicativos front-end com um back-end seguro e estruturado. Recursos como permissões baseadas em funções, gerenciamento de projetos, coleções de bancos de dados, depósitos de arquivos, chaves de API, provedores OAuth e assinaturas em tempo real tornam o Appwrite uma base poderosa para muitos fluxos de trabalho de desenvolvimento diferentes.


  O Appwrite pode ser visto como uma alternativa de código aberto a serviços como Firebase ou Supabase, com forte foco na auto-hospedagem e controle sobre sua própria infraestrutura. Isso o torna uma boa escolha para desenvolvedores que desejam manter back-end, dados de usuário, arquivos e lógica de aplicativo sob seu próprio gerenciamento.


  Após a instalação, você pode abrir o console do Appwrite, criar seu primeiro projeto, configurar métodos de autenticação, configurar bancos de dados e buckets de armazenamento e começar a conectar seus aplicativos por meio de APIs e SDKs do Appwrite.


  ⚠️ Observação: Appwrite é principalmente uma plataforma de desenvolvedor, não um aplicativo tradicional de usuário final. Destina-se a usuários que desejam criar, hospedar ou gerenciar o back-end de seus próprios aplicativos e serviços.
