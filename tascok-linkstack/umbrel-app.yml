releaseNotes: >-
  Critical security updates have been implemented, and an issue with cookie deletion in session management has been fixed. After installation, users are now automatically redirected to the dashboard. Unique avatar IDs are available for theme developers, and the info message for single-user mode during installation has been improved. New features include the ability to fetch favicons from CAPTCHA-protected pages and create custom buttons. Additionally, support for Chinese (zh-TW) and Galician (GL) languages has been added, along with a Simplex button.
