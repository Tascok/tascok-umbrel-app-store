releaseNotes: >-
  This update (v1.2.4) resolves various bugs across core features, including Kanban/Eisenhower boards, calendar display, project views, and CalDAV synchronization.


  Additionally, it hardens database migrations for clean installs, optimizes SQLite and Docker volume configurations, and introduces new documentation for MCP integration.
