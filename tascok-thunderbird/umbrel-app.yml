releaseNotes: >-
  In this release, Thunderbird has been updated to version 128.5.1-r0, and the base image has been updated to version 4.6.7. This resolves several issues, such as the web audio feature, TLS connection problems for VNC, and CJK font installation, while also incorporating security fixes from the latest distribution images.
