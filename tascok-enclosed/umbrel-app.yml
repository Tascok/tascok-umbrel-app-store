releaseNotes: >-
  The recent changes include restructuring configuration variables into a table format and increasing the mobile breakpoint for the navbar. Additionally, Crowdin integration for i18n was added, and dependencies for jsdom and esbuild were updated. A stale action workflow was introduced in GitHub. Furthermore, layout issues were fixed, such as adjusting the "new note" button on mobile and preserving line breaks in the note viewer.
