description: >-
  📻 Airstation é um aplicativo da web auto-hospedado de código aberto projetado para permitir aos usuários criar e gerenciar sua própria estação de rádio online. Ele fornece uma interface intuitiva e minimalista para streaming de música pela Internet, tornando mais fácil para qualquer pessoa transmitir suas faixas favoritas para ouvintes em todo o mundo. A plataforma permite aos usuários fazer upload de arquivos de áudio, organizar listas de reprodução e controlar a reprodução por meio de um player simples baseado na web que os ouvintes podem acessar de qualquer dispositivo.


  Tecnicamente, o Airstation aproveita HTTP Live Streaming (HLS) para fornecer streaming de música suave e confiável. Ele utiliza FFmpeg para lidar com tarefas de processamento de áudio, como conversão de formato e otimização de streaming. As informações de metadados e listas de reprodução são armazenadas em um banco de dados SQLite leve, garantindo que o sistema permaneça eficiente e fácil de manter. Para simplificar a implantação, o Airstation é empacotado como um contêiner Docker, permitindo que ele seja executado perfeitamente em várias plataformas, incluindo Raspberry Pi, dispositivos Synology NAS e servidores tradicionais.


  O projeto é lançado sob licença do MIT, oferecendo aos usuários liberdade para usar, modificar e redistribuir o software sem restrições. Airstation é particularmente atraente para aqueles que desejam administrar uma estação de rádio na Internet personalizada sem depender de serviços de terceiros, proporcionando controle total sobre sua experiência de streaming de música. Com documentação clara e um repositório ativo, ele oferece suporte aos entusiastas que procuram uma solução simples, porém poderosa, para hospedar suas próprias transmissões de rádio online.


  ⚙️ O aplicativo está acessível em umbrel.local:7331/studio. Após inserir a senha, você chega à interface do estúdio onde pode adicionar música. Feito isso, você pode remover “/studio” da URL para acessar a interface principal de compartilhamento de suas músicas.
