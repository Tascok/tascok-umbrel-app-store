id: tascok-zen
name: Zen
tagline: Um aplicativo simples para anotações focadas e privadas
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-zen/logo.png
category: files & productivity
version: "1.0.0"
port: 8094
description: >-
  📒 Zen é um aplicativo minimalista de anotações focado em fornecer uma maneira simples e eficiente de capturar e gerenciar informações. Ele permite aos usuários criar notas usando Markdown, suportando uma ampla gama de opções de formatação, como tabelas, listas de verificação, blocos de código e destaque de texto. Todas as notas são armazenadas localmente em um banco de dados SQLite leve, garantindo que seus dados permaneçam privados e totalmente sob seu controle.


  O aplicativo oferece uma interface limpa e sem distrações, projetada para ser fácil de usar em desktops e dispositivos móveis. Inclui uma poderosa função de pesquisa de texto completo que permite aos usuários encontrar rapidamente notas relevantes enquanto digitam e usa tags em vez de pastas tradicionais para organizar o conteúdo de maneira flexível. Os usuários podem fazer upload e visualizar imagens diretamente em suas notas, ajudando a enriquecer as informações armazenadas.


  O Zen também oferece recursos como exclusão reversível e arquivamento, que ajudam a manter seu espaço de trabalho organizado sem perder informações permanentemente. Os atalhos de teclado melhoram a produtividade, permitindo navegação e edição rápidas sem depender apenas do mouse. O aplicativo oferece suporte ao uso offline por meio de sua funcionalidade progressiva de aplicativo da web, para que você possa acessar e editar suas anotações mesmo sem uma conexão com a Internet.


  No geral, o Zen serve como uma ferramenta leve, rápida e focada na privacidade para gerenciamento de conhecimento pessoal, registro em diário ou simples anotações, oferecendo controle total sobre seus dados em um ambiente amigável.
