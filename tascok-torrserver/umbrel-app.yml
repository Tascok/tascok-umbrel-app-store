releaseNotes: >-
  This version introduces several new features and improvements.


  It adds search, Infuse support on the web, a French web translation, and Torrfs (FuseFS/WebDAV).


  DLNA has been updated, storage configuration has been enhanced, and DNS fallback support was added.


  In addition, multiple bug fixes improve the preload process as well as database and cache handling.
