releaseNotes: >-
  Version 0.6.0 introduces support for custom LLM providers like OpenAI, Google Gemini and Mistral, along with improved item detection that can split invoices into multiple transactions. 


  It adds an "Analyze all" button, enhances the design and user experience, and includes bug fixes for authentication sessions, file parsing and transaction exports.
