description: >-
  🍕 FilePizza é um aplicativo simples que permite o compartilhamento direto de arquivos entre pessoas em tempo real. Seu objetivo principal é transferir arquivos instantaneamente, sem criar cópias permanentes ou armazenar dados além da duração da transferência. O remetente permanece no controle total do conteúdo compartilhado durante todo o processo.


  O aplicativo estabelece uma conexão temporária entre os participantes e transmite os dados do arquivo diretamente do remetente para o destinatário. Os arquivos só existem enquanto a transferência está ativa e não são retidos posteriormente. Isso o torna adequado para compartilhar informações confidenciais ou arquivos grandes que não deveriam permanecer disponíveis após a conclusão da troca.


  Os usuários podem compartilhar arquivos únicos ou múltiplos gerando um link de acesso exclusivo para o destinatário. Assim que o destinatário se conecta, a transferência começa e o progresso é mostrado ao vivo. Quando a transferência ou a sessão terminar, os dados compartilhados não estarão mais acessíveis.


  FilePizza também oferece proteção de acesso opcional para que apenas os destinatários pretendidos possam baixar os arquivos. Isso ajuda a evitar acessos indesejados, ao mesmo tempo que mantém a experiência geral simples e eficiente.


  No geral, FilePizza se concentra no compartilhamento rápido, temporário e privado de arquivos. Ele elimina complexidade desnecessária e concentra-se inteiramente na movimentação de arquivos diretamente de uma pessoa para outra de maneira direta.


  ⚠️ Atualmente, este aplicativo não funciona no Raspberry Pi porque está disponível apenas para a arquitetura amd64. Sistemas baseados em ARM como o Raspberry Pi não são suportados no momento.
