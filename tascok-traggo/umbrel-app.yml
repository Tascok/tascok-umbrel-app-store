name: Traggo
tagline: Uma ferramenta de controle de tempo de código aberto projetada para auto-hospedagem
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-traggo/logo.png
category: files & productivity
version: "0.5.0"
port: 3083
description: >-
  Traggo é uma ferramenta de controle de tempo de código aberto que oferece uma solução flexível e auto-hospedada para gerenciar o tempo em projetos e tarefas. Ele foi projetado para ajudar indivíduos e equipes a monitorar com eficiência as horas gastas em diversas atividades, tornando-o ideal para freelancers, pequenas empresas ou organizações maiores que procuram um sistema de controle de tempo personalizável.


  Um dos destaques desta ferramenta é o suporte à organização de tarefas por meio de projetos e tags, permitindo ao usuário categorizar seu trabalho de forma estruturada. Além de seu painel intuitivo, o Traggo facilita a visualização de relatórios e a análise de dados de tempo, fornecendo informações valiosas sobre produtividade e alocação de recursos.


  Com suporte multiusuário, várias pessoas podem colaborar e controlar seu tempo simultaneamente, sendo uma ótima opção para equipes. Por ser uma solução auto-hospedada, oferece aos usuários controle total sobre seus dados, garantindo privacidade e segurança ao rodar em servidores próprios.


  Traggo oferece uma abordagem abrangente e fácil de usar para gerenciamento de tempo, combinando o poder do software de código aberto com a flexibilidade para atender às necessidades de diferentes ambientes de trabalho.


  🔑 O nome de usuário padrão é “admin” e a senha é “umbrel”.
