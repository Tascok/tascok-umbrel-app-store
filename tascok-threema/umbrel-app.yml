description: >-
  📱 Threema Web é uma maneira segura e conveniente de usar o aplicativo de mensagens Threema diretamente de um navegador da web, mantendo a criptografia completa de ponta a ponta. Ao digitalizar um código QR com o aplicativo Threema, os usuários estabelecem uma conexão direta entre o smartphone e o computador, garantindo que nenhuma mensagem ou metadado seja armazenado em servidores externos. A comunicação é feita via WebRTC, que permite uma conexão ponto a ponto privada e criptografada.


  Com o Threema Web, os usuários podem enviar e receber mensagens, compartilhar imagens e arquivos e gerenciar conversas com o conforto de um teclado de tamanho normal e uma tela maior. Como todos os dados permanecem nos dispositivos do usuário e nunca são carregados na nuvem, o Threema Web oferece um alto nível de privacidade e segurança. Isso o torna uma solução ideal para quem deseja uma experiência de mensagens perfeita entre dispositivos, sem sacrificar a confidencialidade.
