  The latest wger update introduces several new features, bug fixes, and improvements. Notable additions include support for exercise videos, ingredient images, and improved exercise recognition, as well as enhancements to the nutrition planner and API functionality. Various bugs have been resolved, such as issues with calorie tracking, exercise downloads, and user preferences, while updates to dependencies and infrastructure ensure better performance and stability.
