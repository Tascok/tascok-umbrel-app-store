description: >-
  🔐 Authentik é um aplicativo de gerenciamento de identidade e acesso que fornece um local central para lidar com processos de autenticação, autorização e ciclo de vida do usuário. Ele se concentra em fornecer uma abordagem flexível e moderna para gerenciar como os usuários fazem login nos aplicativos e como as permissões são concedidas ou restritas. Basicamente, o Authentik atua como um gateway unificado que determina quem é o usuário e qual nível de acesso ele deve receber ao tentar acessar um recurso protegido.


  O aplicativo permite que os usuários se autentiquem por meio de vários métodos, incluindo senhas e opções multifatoriais, ao mesmo tempo em que impõe regras que definem os requisitos de segurança para cada tentativa de login. Ele gerencia usuários, grupos, permissões e informações de sessão de maneira estruturada e consistente, para que os administradores possam manter controle total sobre as políticas de acesso. O Authentik fornece uma maneira padronizada para os aplicativos solicitarem informações de identidade, facilitando o compartilhamento de sessões de login pelos sistemas e reduzindo logins repetitivos.


  As políticas do Authentik permitem que os administradores definam uma lógica sofisticada que rege como e quando os usuários podem acessar determinados aplicativos. Essas regras podem levar em consideração atributos da conta do usuário, fatores ambientais ou informações contextuais do evento de login. Isso permite um controle de acesso refinado que se adapta a diferentes necessidades de segurança.


  Authentik também simplifica a forma como os aplicativos dependem de provedores de identidade externos. Ele pode atuar como ponto central da federação para que os aplicativos não precisem implementar sua própria lógica de autenticação. Em vez disso, podem confiar nas declarações de identidade emitidas pelo Authentik, o que garante consistência e reduz a complexidade. Isso cria uma experiência de login simplificada para os usuários e uma estrutura de segurança mais gerenciável para os administradores.


  No geral, o Authentik funciona como uma plataforma completa para gerenciamento de identidade e acesso controlado, garantindo que a autenticação e autorização do usuário permaneçam seguras, confiáveis ​​e fáceis de gerenciar em diversos tipos de aplicativos.


  ⚙️ Para iniciar a configuração inicial, abra seu navegador e navegue até


  http://<your IP ou nome do host do servidor (por exemplo, umbrel.local)>:3973/if/flow/initial-setup/.


  Isso inicia o fluxo de configuração guiada onde você cria a conta de administrador, define as configurações essenciais e conclui a configuração inicial do sistema.
