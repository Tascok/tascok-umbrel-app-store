releaseNotes: >-
  The v1.2.1 update for Booklore fixes critical issues, including database lockouts caused by duplicate files, and improves file permission management in Docker. Users can now set USER_ID and GROUP_ID to ensure proper ownership of files, preventing previous permission problems.


  A new feature, the “Books Finished per Month” heatmap, has been added to help track reading habits over time. Additional enhancements improve UX, such as expanding menu item clickable areas and preventing race conditions in file operations.


  Several bug fixes address multi-book review dialogs, sidebar filter state on mobile, and rule evaluation in Magic Shelf. The update also includes maintenance and Docker Compose adjustments for smoother operation.
