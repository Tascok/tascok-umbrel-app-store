releaseNotes: >-
  Restreamer 2.12.0 introduces the integration of the wetter.com service and a new option to select which channels are displayed on the player site. Additionally, it includes various bug fixes, such as incorrect filter settings, duplicated filter parameters in the encoder, and address encoding issues, along with an update to public Video.js version 8.
