description: >-
  BlackCandy é um servidor de streaming de música auto-hospedado e de código aberto, projetado para usuários que preferem gerenciar suas próprias bibliotecas de música de forma privada. Construído com a simplicidade em mente, o BlackCandy permite aos usuários fazer upload, organizar e transmitir músicas por meio de uma interface web limpa. Ele suporta formatos de áudio comuns como MP3 e FLAC, e os usuários podem controlar facilmente sua biblioteca a partir de qualquer dispositivo conectado ao servidor. O software é personalizável e seguro, o que o torna ideal para quem valoriza a privacidade e deseja evitar serviços de streaming de terceiros.

   Os principais recursos incluem:

  🌐 Gerenciamento e streaming de biblioteca de música baseado na Web.


  🗂️ Suporta vários formatos de áudio, incluindo MP3 e FLAC.


  📱 Interface compatível com dispositivos móveis para streaming em qualquer lugar.


  🗃️ Capacidade de organizar músicas por artistas, álbuns e playlists.


  🔧 Fácil configuração e instalação para auto-hospedagem em um servidor pessoal.


   Com foco na privacidade e no controle, o BlackCandy é uma ótima alternativa aos serviços comerciais de streaming, dando aos usuários propriedade total de sua coleção de mídia sem qualquer compartilhamento de dados. É ideal para quem deseja um servidor de música leve e pessoal, que possa personalizar e manter.

  🔑 O nome de usuário inicial é admin@admin.com e a senha é foobar.

