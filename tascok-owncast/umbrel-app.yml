manifestVersion: 1
id: tascok-owncast
name: Owncast
tagline: Um servidor de vídeo ao vivo e chat na web gratuito e de código aberto
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-owncast/logo.png
category: social
version: "0.1.3"
port: 8055
description: >-
  Owncast é uma plataforma inovadora de código aberto projetada para transmissão ao vivo auto-hospedada e hospedagem de vídeo. Com o Owncast, os usuários podem transmitir suas transmissões ao vivo diretamente de seus próprios servidores, oferecendo uma alternativa descentralizada aos serviços populares de streaming. Isso permite que os criadores mantenham o controle sobre seu conteúdo, interações com o público e estratégias de monetização sem as restrições das plataformas corporativas.


  Os principais recursos do Owncast incluem:


  📺 Transmissão ao vivo: transmita eventos ao vivo, sessões de jogos ou transmissões criativas com facilidade, permitindo o envolvimento em tempo real com os espectadores.


  📹 Hospedagem de vídeo: carregue e hospede conteúdo de vídeo, criando uma biblioteca personalizada de mídia que pode ser compartilhada com os seguidores.


  🎨 Interface personalizável: personalize a aparência da sua plataforma de streaming para combinar com sua marca e preferências.


  👥 Engajamento da comunidade: promova uma conexão direta com seu público por meio de funcionalidades de chat, enquetes e notificações.


  Quer você seja um jogador, artista, educador ou criador de conteúdo, o Owncast fornece as ferramentas para construir sua experiência de streaming única. Abrace a liberdade da auto-hospedagem e envolva seu público como nunca antes!


  ⚠️ Após iniciar o servidor, digite `umbrel.local:8050/admin` em seu navegador para acessar o painel de administração. O nome de usuário do administrador é 'admin' e a senha é 'abc123'.

developer: Gabe Kangas
