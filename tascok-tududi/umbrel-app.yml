name: Tududi
tagline: Uma maneira cuidadosa de gerenciar tudo
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-tududi/logo.png
category: files & productivity
version: "1.2.4"
