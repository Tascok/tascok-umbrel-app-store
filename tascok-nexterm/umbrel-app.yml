releaseNotes: >-
  The release 1.0.2 introduces several new features, including Google TOTP support, an App Store, clipboard synchronization, multiple user support, and SFTP/file management, along with a bug fix for protocol errors. 


  It also includes a breaking change, requiring users to either remove the database or change their role to admin.
