id: tascok-paisa
name: Paisa
tagline: Um rastreador financeiro completo projetado para ser simples
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-paisa/logo.png
category: finance
version: "0.7.1"
port: 7500
description: >-
  📊 Paisa é um gerenciador de finanças pessoais auto-hospedado projetado para ajudar os usuários a rastrear e gerenciar suas transações financeiras usando um formato de contabilidade simples baseado em texto. Ele se integra perfeitamente a ferramentas como Ledger, hledger e beancount, proporcionando aos usuários controle total sobre seus dados financeiros. A plataforma é construída em torno de princípios básicos de privacidade, propriedade de dados e longevidade.


  Paisa garante que todos os dados do usuário permaneçam privados, sem rastreamento ou coleta de dados de terceiros. Ele suporta a importação e o gerenciamento de vários registros financeiros, ao mesmo tempo que permite fácil migração entre diferentes formatos. Além disso, o Paisa inclui recursos como definição de metas, orçamento e rastreamento de preços de commodities, com a opção para os usuários obterem preços ao vivo de fontes externas, tudo isso respeitando a privacidade, tornando esses recursos opcionais.


  O software é de código aberto, o que o torna transparente e auditável. Também foi concebido a pensar na longevidade, pretendendo ser uma solução sustentável para a gestão das finanças pessoais a longo prazo. A licença AGPL v3 do Paisa garante que ela permaneça disponível gratuitamente e sua estrutura simples permite flexibilidade e personalização na forma como os usuários controlam suas finanças.

