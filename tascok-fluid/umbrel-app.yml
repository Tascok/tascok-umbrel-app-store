releaseNotes: >-
  Version 1.4.0 mainly improves task management and calendar synchronization reliability. Externally synced tasks are now visually marked in the task list, future tasks are detected more accurately, and tasks that are already in progress are no longer automatically rescheduled.


  Several calendar integration issues have also been fixed, including authentication problems when deleting Google Calendar events, recurring task sync issues with Outlook, and CalDAV syncToken handling. The user interface has been improved as well, especially for all-day event creation and the correct detection of overdue tasks.
