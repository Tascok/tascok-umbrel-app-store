  This version of Docspell mainly focuses on bug fixes and maintenance improvements. It resolves issues like sidebar scrolling, duplicate tasks on reboot, and deprecated options in WeasyPrint, while also correcting a German word typo. 


  Additionally, it cleans up development workflows, updates gitignore files, and moves Docker-related workflows to a separate repository.
