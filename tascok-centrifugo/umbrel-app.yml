id: tascok-centrifugo
name: Centrifugo
tagline: Uma plataforma de servidor de mensagens em tempo real altamente escalável
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-centrifugo/logo.png
category: networking
version: "5.4.6"
port: 8086
description: >-
  Centrifugo é um servidor de mensagens em tempo real de código aberto que ajuda os desenvolvedores a criar aplicativos da web escalonáveis ​​com atualizações em tempo real. É comumente usado para enviar mensagens entre um servidor e um cliente em aplicativos que exigem atualizações em tempo real, como aplicativos de bate-papo, ferramentas de edição colaborativa, painéis em tempo real ou notificações em tempo real.


  Algumas características principais do Centrifugo:


  ⏱️ Comunicação em tempo real: permite que o servidor envie dados aos clientes instantaneamente, evitando a necessidade do cliente pesquisar constantemente o servidor em busca de atualizações.


  🔗 Suporte WebSocket: Ele usa WebSockets para comunicação eficiente e de baixa latência, mas também oferece suporte a mecanismos de fallback, como streaming HTTP e sondagem longa.


  📈 Escalabilidade: Centrifugo pode lidar com muitas conexões simultâneas e suporta escalonamento horizontal, o que o torna adequado para aplicações de alto tráfego.


  📬 Canais e Pub/Sub: utiliza o conceito de canais para organizar mensagens em tempo real. Os clientes podem se inscrever em canais e receber dados em tempo real quando novas mensagens forem publicadas.


  📦 Backend agnóstico: embora possa usar Redis (como você está fazendo) para dimensionar e lidar com um grande número de conexões, ele também oferece suporte a outros backends ou pode ser executado de forma independente sem Redis.


  🛡️ Autenticação: Centrifugo suporta autenticação baseada em token, garantindo que apenas clientes autorizados possam assinar canais específicos.


  Para usuários do Umbrel, o Centrifugo, quando integrado ao Redis como back-end, lida com eficiência com o fluxo de mensagens em tempo real em vários serviços ou aplicativos, permitindo atualizações e comunicação em tempo real e contínuas dentro do ambiente do servidor Umbrel.


  🔑 A senha inicial é “umbrel”.

