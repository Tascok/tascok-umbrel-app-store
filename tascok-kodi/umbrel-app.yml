  The recent updates for Kodi include numerous bug fixes, performance improvements, and feature enhancements. Key changes include fixes for heap-user-after-free issues, improved playback performance, enhanced support for various video formats, and several bug fixes related to PVR, video player, and subtitle handling. Additionally, multiple platform-specific issues were addressed, such as improvements for Android, MacOS, Linux, and Xbox, along with updates to the web interface and several backported features for better compatibility and stability.
