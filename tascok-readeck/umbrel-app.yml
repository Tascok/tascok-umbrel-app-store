releaseNotes: >-
  Readeck 0.19.0 introduces email sharing of bookmarks with optional EPUB attachments, a new mosaic view for the bookmark list, and improved browser extension onboarding. The update enhances CSRF protection, fixes issues with SVG images and Wallabag imports, and replaces application passwords with API token support for HTTP Basic Authentication. EPUB exports now include author information.
