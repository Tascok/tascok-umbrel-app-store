description: >-
  👐 OpenHands é um assistente de desenvolvimento de IA local que ajuda os desenvolvedores a automatizar tarefas de programação repetitivas e se concentrar em trabalhos mais significativos. Ele roda inteiramente em seu próprio servidor Umbrel e respeita sua privacidade, mantendo todas as operações offline e sob seu controle. OpenHands entende, edita e melhora o código de forma independente usando agentes de software inteligentes que analisam seus repositórios, executam comandos, trabalham com arquivos e seguem instruções escritas em linguagem natural.


  Ao ter acesso total à sua base de código local e às ferramentas de desenvolvimento, o OpenHands se torna um companheiro poderoso em todos os seus projetos de software. Se você deseja refatorar o código existente, corrigir bugs ou desenvolver novos recursos, o assistente pode sugerir e aplicar alterações, mantendo você sempre informado. Sua interface web moderna oferece uma experiência tranquila com um editor de código e terminal integrados, todos rodando diretamente em seu próprio hardware, sem quaisquer dependências externas.


  Trazer o OpenHands para a Umbrel oferece aos desenvolvedores um assistente de IA totalmente autônomo que não depende de serviços em nuvem. É uma ótima solução para indivíduos com foco na privacidade, desenvolvedores amadores e profissionais que desejam explorar o futuro do desenvolvimento de software com IA.
