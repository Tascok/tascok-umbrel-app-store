releaseNotes: >-
  A new optional layout without a sidebar was added, along with a top bar search and centered content in the default layout. The app now uses a stronger WSGI server, supports ARM64, and has a proper timezone fix. Recent items display how long ago they were played/added, with no cutoff.

  Bug fixes include improved queue management, playlist bounds, keyboard shortcuts, and lyrics plugin functionality.
