manifestVersion: 1
id: tascok-ente-auth
category: files & productivity
name: Ente Auth
tagline: Um autenticador 2FA com backups criptografados de ponta a ponta
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-ente-auth/logo.png
version: "4.3.5"
port: 43000
description: >-
  🔐 Ente Auth é o serviço de autenticação que alimenta o Ente, uma plataforma de backup e sincronização de fotos com foco na privacidade. Ele cuida do gerenciamento de usuários, incluindo registro, login, recuperação de senha e geração de token, servindo como gateway através do qual os usuários acessam seus dados criptografados. O serviço garante processos de autenticação seguros através da implementação de mecanismos robustos de criptografia, protegendo assim as credenciais do usuário e mantendo a integridade do processo de login. Projetado tendo a privacidade como princípio fundamental, o Ente Auth opera de uma forma que nem mesmo o próprio Ente pode acessar os dados do usuário, pois todo o conteúdo é criptografado de ponta a ponta. Esta arquitetura garante que, embora o serviço gerencie a autenticação e o controle de acesso, nunca comprometa a confidencialidade da mídia armazenada. Ao manter protocolos de segurança e padrões de criptografia rígidos, o Ente Auth oferece uma experiência de usuário contínua, porém segura, que se alinha com a missão mais ampla do Ente de priorizar a privacidade dos dados e o controle do usuário.


  ⚠️ Observação: você pode reutilizar sua conta "Ente Photos" existente com "Ente Auth"


  ⚠️ Siga as etapas de configuração após instalá-lo:


  https://github.com/Tascok/tascok-umbrel-app-store/blob/master/tascok-ente-photos/README.md

