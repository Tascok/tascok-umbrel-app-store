version: "0.5.6"
port: 8286
description: >-
  🖼️ Picsur é uma plataforma de hospedagem de imagens leve e auto-hospedada, projetada para simplicidade e controle. Ele permite aos usuários fazer upload, armazenar e compartilhar imagens diretamente de seu próprio servidor, sem depender de serviços de terceiros. Inspirado nas funcionalidades de plataformas como Imgur e Pastebin, o Picsur se concentra em oferecer uma experiência limpa e eficiente para usuários que precisam de uma maneira simples de gerenciar imagens online.


  Ao contrário de soluções de gerenciamento de fotos mais complexas, como PhotoPrism ou Immich, que incluem recursos como reconhecimento facial, álbuns e classificação assistida por IA, o Picsur foi desenvolvido especificamente para uploads rápidos e compartilhamento direto. Ele suporta uma ampla variedade de formatos de imagem, incluindo formatos comuns como JPEG, PNG e GIF, bem como tipos mais novos ou menos padrão, como QOI e arquivos WebP animados. Depois de carregadas, as imagens podem ser editadas com ferramentas básicas, como redimensionar, girar, inverter ou aplicar tons de cinza e efeitos negativos.


  A plataforma inclui uma interface web amigável que suporta uploads de arrastar e soltar e fornece links diretos para compartilhar imagens instantaneamente. Os administradores podem acessar um painel de back-end para gerenciar arquivos carregados e permissões de usuário, oferecendo controle total sobre como o serviço funciona.


  Como o Picsur é auto-hospedado, ele garante o máximo de privacidade e independência dos provedores de nuvem. Ele pode ser implantado usando Docker em sistemas como Synology NAS, tornando-o acessível até mesmo para usuários sem profundo conhecimento técnico. Isso o torna uma solução ideal para indivíduos ou pequenas equipes que desejam hospedar imagens de maneira privada, eficiente e com sobrecarga mínima.
