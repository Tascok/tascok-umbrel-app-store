name: Foldergram
tagline: Um feed privado no estilo Instagram para suas memórias
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-foldergram/logo.png
category: files & productivity
version: "1.2.2"
port: 4141
description: >-
  O Foldergram transforma uma coleção de fotos e vídeos em uma galeria de mídia moderna e limpa. Ele verifica pastas, organiza a mídia descoberta e apresenta tudo em uma interface visual projetada para navegar, redescobrir e gerenciar coleções pessoais de imagens e vídeos.


  O aplicativo cria visualizações de álbuns a partir de estruturas de pastas e facilita a movimentação por grandes bibliotecas sem classificar manualmente cada arquivo. Fotos e vídeos podem ser visualizados em um feed estilo linha do tempo, abertos individualmente, explorados por meio de visualizações recentes e aleatórias ou revisitados por meio de recursos de redescoberta que trazem memórias antigas de volta ao foco.


  Foldergram oferece suporte à navegação na mídia por álbuns, coleções, locais e seções da biblioteca. Ele gera visualizações e miniaturas para que as galerias pareçam rápidas e visualmente organizadas, mesmo quando a biblioteca de mídia contém muitos arquivos. Os vídeos podem ser assistidos diretamente na interface, enquanto as coleções de fotos podem ser exploradas em um layout suave e focado na galeria.


  O aplicativo também inclui ferramentas para organizar e manter uma biblioteca de mídia. Os itens podem ser movidos para a lixeira, as coleções podem ser usadas para agrupar mídias selecionadas e a visualização da biblioteca ajuda a manter fotos e vídeos acessíveis sem alterar a estrutura original baseada em pastas. O Foldergram foi projetado para fazer com que as pastas de mídia existentes pareçam um aplicativo de fotos pessoais sofisticado, com foco na navegação simples, descoberta visual e navegação fácil por memórias pessoais.
