name: Datetime
tagline: Uma poderosa ferramenta de visualização e conversão de tempo
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-datetime/logo.png
category: files & productivity
version: "1.0"
