releaseNotes: >-
  Primeira versão do Minepanel na loja (v1.12.19). Desde a v1.12 o painel gerencia o próprio mc-router (proxy Java em porta única com auto-escala), a conta de administrador é criada na primeira visita pela interface e SMTP/OIDC podem ser configurados direto em Configurações.
