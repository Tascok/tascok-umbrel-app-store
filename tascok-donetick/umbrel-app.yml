description: >-
  Donetick é um aplicativo de gerenciamento de tarefas de código aberto projetado para agilizar a organização das tarefas domésticas e outras responsabilidades recorrentes. Ele fornece um sistema flexível para atribuir tarefas a vários usuários, usando várias estratégias de seleção, como alocação aleatória ou atribuição com base no menor número de tarefas concluídas. As tarefas podem ser agendadas com padrões de recorrência personalizáveis, facilitando o gerenciamento das rotinas diárias e das responsabilidades menos frequentes.


  A plataforma oferece acompanhamento do progresso em tempo real e integra-se a serviços de notificação externos como Telegram e Pushover, garantindo que os usuários permaneçam informados sobre tarefas futuras ou atrasadas. Além disso, Donetick suporta integrações de API, permitindo que tarefas sejam acionadas automaticamente a partir de outros sistemas.


  Para autenticação e gerenciamento de usuários, Donetick suporta Single Sign-On (SSO) e OpenID Connect (OIDC), facilitando a integração com provedores de identidade existentes. Um recurso exclusivo da plataforma é o suporte a tags NFC, permitindo que os usuários concluam tarefas simplesmente digitalizando uma tag. Rótulos e grupos de tarefas melhoram ainda mais a organização, permitindo que as tarefas sejam categorizadas e compartilhadas de forma eficiente entre os membros.


  Com sua combinação de automação, agendamento inteligente e compartilhamento colaborativo de tarefas, Donetick oferece uma solução poderosa e fácil de usar para gerenciar responsabilidades domésticas e de grupo.
