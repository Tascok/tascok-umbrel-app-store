description: >-
  Homepage é um aplicativo de painel personalizável que permite reunir informações importantes em uma única interface organizada. Dá a você controle total sobre o layout usando arquivos de configuração simples que definem o que aparece na tela e como é organizado. Essa abordagem facilita a adaptação do painel às suas próprias necessidades, sem complexidade ou sobrecarga técnica.


  O aplicativo se concentra na clareza e no equilíbrio visual. Apresenta links, widgets e elementos informativos em um design clean que ajuda você a acessar tudo de forma rápida e sem distrações. Se você deseja uma visão geral mínima ou uma exibição de informações mais rica, a estrutura da interface pode ser moldada para corresponder ao seu fluxo de trabalho pessoal.


  A página inicial também oferece suporte a muitos tipos de conteúdo que podem ser combinados livremente. Você pode incluir entradas de aplicativos, métricas, marcadores, campos de pesquisa ou pequenos indicadores de status. Esses itens podem ser agrupados e ordenados para criar um painel que pareça natural e eficiente. A sua flexibilidade torna-o útil tanto para ambientes pessoais como profissionais onde um ponto de partida organizado é essencial.


  Ao manter tudo em um único espaço, o Homepage transforma sua rotina diária em uma experiência tranquila. Ele serve como um local central onde você pode se concentrar no que é mais importante e acessar as ferramentas ou informações nas quais você confia todos os dias.


  ⚙️ A página inicial no Umbrel funciona por meio de um sistema de configuração baseado em arquivos onde todas as configurações e elementos de interface são definidos em arquivos YAML dentro do diretório de dados do aplicativo.


  Todos os arquivos de configuração devem ser colocados em /data/config/ Este diretório deve conter settings.yaml, services.yaml, widgets.yaml e bookmarks.yaml. Após cada modificação, o aplicativo Homepage no Umbrel deve ser reiniciado para que as alterações sejam aplicadas.


  Imagens personalizadas podem ser armazenadas em /data/public/images/ e referenciadas em settings.yaml


  A formatação YAML requer precisão. Sempre use espaços, evite tabulações e mantenha o recuo consistente. Para evitar mensagens de “Informações de erro de API”, remova ou simplifique blocos de widgets que usam chamadas de API externas.


  Para documentação completa, visite https://gethomepage.dev/
