name: NoteDiscovery
tagline: Um aplicativo de anotações leve e focado na privacidade
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-notediscovery/logo.png
category: files & productivity
version: "0.6.1"
port: 8734
description: >-
  📄 NoteDiscovery é uma ferramenta de conhecimento leve e flexível projetada para criar, editar e organizar notas de forma limpa e intuitiva. Ele se concentra inteiramente no processo de escrita e pensamento usando texto simples e Markdown para que cada nota permaneça simples, legível e fácil de estruturar. O editor fornece visualizações em tempo real de texto, código e fórmulas, o que o torna adequado para documentação técnica, notas de estudo ou redação pessoal. As notas podem fazer referência umas às outras por meio de wikilinks, permitindo construir estruturas de conhecimento interconectadas e navegar por elas rapidamente.


  O aplicativo suporta diagramas, notação matemática e blocos de código com destaque de sintaxe, oferecendo uma ampla gama de ferramentas expressivas dentro de uma interface mínima. Tags e metadados frontmatter ajudam a categorizar e filtrar conteúdo, enquanto os modelos facilitam a criação de estruturas repetíveis para tipos de notas recorrentes. Imagens e anexos podem ser adicionados a qualquer nota, e o layout visual se adapta perfeitamente a diferentes tamanhos de tela para que a experiência de escrita permaneça consistente.


  O NoteDiscovery tem como objetivo oferecer um ambiente calmo e sem distrações, onde suas anotações permanecem totalmente acessíveis em texto simples e onde seu conhecimento cresce por meio de conexões simples entre documentos. Seu design incentiva a clareza, a organização de longo prazo e a liberdade de formatos proprietários, tornando-o um companheiro confiável para a gestão do conhecimento pessoal.
