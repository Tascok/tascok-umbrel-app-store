releaseNotes: >-
  Version 1.5.0 adds multi-channel notification support, enabling alerts via Telegram, Discord, Email, Slack, Google Chat, Signal, and custom webhooks. It introduces specialized notification managers for server resources, uptime services, and SSL certificates with customizable templates, detailed status tracking, and immediate delivery. 


  The update also improves message formatting with emojis, structured layouts, color coding, and dynamic placeholders, along with enhancements to translations, table navigation, pagination, agent support, connection updates, SSL checks, and backend rate limiting.
