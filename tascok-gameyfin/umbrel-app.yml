description: >-
  🎮 Gameyfin é uma plataforma de código aberto projetada para organizar e gerenciar coleções pessoais de videogames. Ele verifica diretórios locais para detectar jogos automaticamente e os compila em uma biblioteca digital unificada. Cada entrada é enriquecida com metadados como títulos, descrições, gêneros e capas, criando um catálogo visualmente atraente que ajuda os usuários a redescobrir e navegar em seus jogos sem esforço.


  O sistema foi desenvolvido para ser leve e eficiente, garantindo que mesmo grandes coleções possam ser indexadas e exibidas rapidamente. Ele recupera informações de bancos de dados on-line para fornecer detalhes precisos e arte consistente, reduzindo a necessidade de entrada manual. Os usuários podem explorar toda a sua biblioteca de jogos por meio de uma interface web simples que suporta pesquisa, classificação e visualização de páginas individuais de jogos com informações detalhadas.


  Gameyfin se concentra em dar aos jogadores controle sobre suas bibliotecas digitais, oferecendo uma forma estruturada de acessar e gerenciar jogos próprios. Ele não distribui ou emula jogos, mas fornece um ambiente privado e organizado para acompanhá-los. Ao combinar automação, apresentação limpa e personalização, ele transforma uma pasta de arquivos dispersos em um arquivo pessoal coeso e acessível de entretenimento interativo.


  ⚙️ Coloque arquivos de texto simples diretamente em ${APP_DATA_DIR}/data/games, cada um com o nome de um jogo que você gostaria que aparecesse em sua biblioteca, como “Super Mario 64.txt” ou “Portal 2.txt”. Quando você adiciona esse caminho como uma biblioteca no Gameyfin e executa uma nova verificação, o aplicativo detectará automaticamente esses arquivos como entradas de jogo, permitindo que você explore e teste sua biblioteca sem precisar de nenhum arquivo real do jogo.
