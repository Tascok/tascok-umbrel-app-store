id: tascok-kitchenowl
name: KitchenOwl
tagline: Uma lista de compras e gerenciador de receitas
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-kitchenowl/logo.png
category: files & productivity
version: "0.6.11"
port: 8474
description: >-
  👨‍🍳 KitchenOwl é um aplicativo auto-hospedado e de código aberto projetado para simplificar o gerenciamento doméstico, principalmente quando se trata de organizar compras, receitas, planejamento de refeições e despesas compartilhadas. Construído com a privacidade e a usabilidade em mente, o KitchenOwl capacita indivíduos, famílias e residências compartilhadas a gerenciar de forma colaborativa tarefas relacionadas à cozinha por meio de uma interface elegante e intuitiva disponível em dispositivos móveis, desktops e na web.


  O aplicativo permite aos usuários criar e manter listas de compras dinâmicas que podem ser compartilhadas e editadas em tempo real. À medida que os usuários adicionam itens à lista, o KitchenOwl os categoriza automaticamente e até aprende com os hábitos de compra para melhorar sugestões futuras. Isso torna as compras semanais mais eficientes e menos propensas ao esquecimento de itens essenciais. Os itens podem ser marcados à medida que são comprados e várias listas podem ser mantidas simultaneamente para acomodar diferentes lojas ou necessidades domésticas.


  Outra característica importante do KitchenOwl é a funcionalidade de gerenciamento de receitas. Os usuários podem adicionar manualmente suas próprias receitas ou importá-las de sites populares usando um analisador de receitas integrado. As receitas são armazenadas em um livro de receitas digital centralizado e podem ser pesquisadas ou filtradas por tags, ingredientes ou categorias. Ao planejar as refeições, o usuário pode simplesmente adicionar os ingredientes de uma receita à sua lista de compras com um único clique, agilizando o processo de preparo.


  O planejamento de refeições é perfeitamente integrado, permitindo aos usuários agendar refeições para os próximos dias ou semanas. Esta funcionalidade não só ajuda a manter uma alimentação equilibrada, como também reduz o desperdício alimentar, incentivando a utilização de ingredientes já disponíveis. KitchenOwl até incentiva os usuários a revisitar receitas que não usam há algum tempo, trazendo de volta os favoritos esquecidos.


  Para situações de vida compartilhada, o KitchenOwl inclui recursos de rastreamento de despesas. Os membros da família podem registrar despesas relacionadas a compras de supermercado ou outros custos comunitários, e o aplicativo ajuda a dividir essas despesas de forma justa entre o grupo. Isto reduz o atrito frequentemente associado às finanças partilhadas e garante a transparência dentro do agregado familiar.


  KitchenOwl é desenvolvido e mantido ativamente por uma comunidade de colaboradores que prioriza o acesso aberto e o feedback do usuário. O projeto dá as boas-vindas à participação de novos usuários e desenvolvedores, oferecendo documentação detalhada e suporte para ajudar qualquer pessoa a começar. Com seu design inteligente e conjunto robusto de recursos, KitchenOwl oferece uma solução abrangente para gerenciamento de cozinha moderno e colaborativo.
