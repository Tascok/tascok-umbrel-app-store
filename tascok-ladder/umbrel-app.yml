manifestVersion: 1
id: tascok-ladder
name: Ladder
tagline: Uma solução de proxy adaptável para filtragem da Web segura e baseada em regras
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-ladder/logo.png
category: networking
version: "0.0.21"
port: 8050
description: >-
  🪜 Ladder é um servidor proxy versátil e seguro projetado para filtragem precisa e baseada em regras do tráfego da web, dando aos administradores controle excepcional sobre o acesso aos recursos da web. Desenvolvido para ambientes onde o gerenciamento do acesso às informações é fundamental, especialmente em configurações auto-hospedadas, o Ladder oferece suporte a filtragem de domínio, cabeçalhos personalizados e autenticação de usuário, garantindo que aplicativos confidenciais sejam seguros, mas acessíveis aos autorizados. Como uma alternativa auto-hospedada a serviços como o 12ft.io, o Ladder permite que os usuários contornem certos acessos pagos e conteúdo restrito dentro dos limites de sua própria configuração de servidor, mantendo a acessibilidade sem depender de soluções de terceiros.


  À medida que o acesso à informação se torna cada vez mais restrito por paywalls e políticas de acesso, ferramentas como o Ladder ajudam a manter o equilíbrio, permitindo o acesso controlado sem bloquear totalmente o fluxo de informações. A capacidade do Ladder de autenticar, filtrar e monitorar o tráfego apoia um modelo onde o conhecimento pode ser gerenciado de forma responsável, alinhando-se com a visão da informação como um recurso compartilhado e não como uma mercadoria. Ao apoiar a privacidade e a acessibilidade, o Ladder capacita os administradores a criar ambientes abertos e seguros para uso informado.


  ⚙️ Conjunto de regras: 


  Um conjunto de regras permite aplicar regras personalizadas para modificar a resposta ou o URL solicitado. Isso pode ser usado para remover elementos indesejados ou ajustar partes específicas de uma página. O conjunto de regras pode ser um arquivo YAML, um diretório contendo arquivos YAML ou uma URL apontando para um arquivo YAML. Cada arquivo lista regras para domínios específicos e elas são carregadas na inicialização.


  Um conjunto de regras básico está disponível aqui: https://raw.githubusercontent.com/everywall/ladder-rules/main/ruleset.yaml. Se preferir um arquivo local, você pode usar ${APP_DATA_DIR}/data/ruleset/ruleset.yaml. Alternativamente, você pode adicionar seu próprio arquivo especificando o caminho para ele. Você pode verificar o conjunto de regras em http://umbrel.local:8050/ruleset.


  Alguns exemplos de conjuntos de regras também estão disponíveis aqui: https://github.com/everywall/ladder-rules/tree/main/rulesets.


  🎨 Personalização:


  Com o Ladder, formulários personalizados podem ser aplicados para lidar com solicitações de maneira mais flexível. Isso requer a modificação do arquivo form.html, localizado em ${APP_DATA_DIR}/data/form/. 


  Neste arquivo HTML, você pode definir campos, layouts e scripts para atender a requisitos de entrada específicos. Depois de customizado, o formulário é automaticamente integrado ao Ladder e disponibilizado aos usuários.


  ⚠️ Limitações:


  Alguns sites restringem o acesso ao seu conteúdo para mecanismos de busca, o que pode impedir que esse proxy recupere o conteúdo.


  Observe que alguns sites podem exibir imagens ausentes ou problemas de formatação quando acessados ​​por meio deste proxy. Muitas vezes, isso se deve à dependência do site de JavaScript ou CSS para carregar imagens e outros recursos, que podem não ser totalmente suportados no ambiente de proxy.
