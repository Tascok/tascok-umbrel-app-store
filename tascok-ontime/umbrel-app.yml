releaseNotes: >-
  This version introduces the ability to rename and duplicate rundowns and to create share links for local IP addresses.


  It improves sheet import previews, prevents ID conflicts, and adds a new “none” timer type that hides timestamps. 


  The update also includes network link fixes, container improvements, and a simple health check endpoint for greater stability.
