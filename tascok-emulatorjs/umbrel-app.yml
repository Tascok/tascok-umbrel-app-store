manifestVersion: 1
id: tascok-emulatorjs
name: EmulatorJS
tagline: Uma experiência imersiva de jogo retro no navegador
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-emulatorjs/logo.png
category: gaming
version: "1.9.2"
port: 8662
description: >-
  🎮 EmulatorJS é uma plataforma de software baseada na web que permite aos usuários jogar videogames retrô diretamente em seus navegadores. Funciona emulando consoles de jogos clássicos usando JavaScript, tornando possível rodar jogos antigos sem a necessidade de software ou plug-ins adicionais. O emulador foi projetado para ser leve e eficiente, proporcionando uma jogabilidade suave para uma ampla variedade de sistemas clássicos.


  Ele suporta o carregamento de arquivos ROM localmente ou de um servidor, permitindo que os usuários joguem seus próprios backups de jogos obtidos legalmente ou hospedem bibliotecas de jogos para uso pessoal. O EmulatorJS inclui recursos como salvar estados, suporte a controlador e modo de tela cheia, criando uma experiência que imita de perto o hardware original.


  Sua versatilidade e facilidade de uso tornam-no uma escolha atraente para entusiastas que desejam reviver a nostalgia dos jogos clássicos ou construir suas próprias plataformas de jogos retrô baseadas na web. Como um projeto de código aberto, ele está disponível gratuitamente e pode ser personalizado ou auto-hospedado, oferecendo controle total sobre a aparência e a funcionalidade do ambiente do emulador.


  ⚠️ Certifique-se de seguir as instruções de instalação no README aqui: 


  https://github.com/dennysubke/dennys-umbrel-app-store/blob/master/tascok-emulatorjs/README.md
developer: EmulatorJS
