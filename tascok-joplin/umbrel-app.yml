description: >-
  Joplin Sync Server é um servidor de sincronização de código aberto para Joplin, o popular aplicativo de anotações e tarefas.

  Projetado para gerenciar e sincronizar notas entre dispositivos, o Joplin Server oferece vários recursos importantes:


  🔄 Sincronização: permite a sincronização perfeita de notas, cadernos e etiquetas em vários dispositivos, garantindo que as alterações feitas em um dispositivo sejam refletidas em todos os lugares.


  🛡️ Segurança: O Joplin Server suporta criptografia ponta a ponta, mantendo seus dados seguros durante a transmissão. Isso significa que suas anotações e informações pessoais estão protegidas contra acesso não autorizado.


  🔧 Personalização: Como um projeto de código aberto, o Joplin Server pode ser personalizado e estendido para atender a diversas necessidades. Os usuários podem modificar o servidor para melhor integração com a infraestrutura existente.


  💾 Backup e Restauração: Suporta backups, permitindo aos usuários restaurar seus dados em caso de perda acidental ou corrupção.


  🖥️ Interface Web: O Joplin Server inclui uma interface web para fácil gerenciamento do servidor e monitoramento do status de sincronização.


  🔒 Ao usar o Joplin Server, os usuários podem manter uma experiência de anotações consistente e segura em todos os seus dispositivos, mantendo controle total sobre seus dados.


  🌐 Configuração HTTPS: A versão do aplicativo para navegador pode operar em http, mas o aplicativo móvel requer https. Você pode configurar https usando o aplicativo Cloudflare Tunnel disponível na app store. Instruções detalhadas para configurar o túnel podem ser encontradas aqui: 


  https://github.com/Radiokot/umbrel-cloudflared/wiki/How-to-set-up-Cloudflare-Tunnel-on-your-Umbrel


  🔑 Por padrão, o Joplin Server será configurado com um usuário administrador com email "admin@localhost" e senha "admin".

