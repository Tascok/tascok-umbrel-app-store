name: Erugo
tagline: Uma poderosa plataforma de compartilhamento de arquivos
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-erugo/logo.png
category: files & productivity
version: "0.1.1"
port: 8564
description: >-
  ↗️ Erugo é um aplicativo de compartilhamento de arquivos moderno e elegante, projetado para oferecer uma experiência tranquila e segura ao enviar ou receber arquivos. Ao contrário dos serviços tradicionais baseados em nuvem, o Erugo coloca a simplicidade e a clareza no centro de sua interface, permitindo aos usuários fazer upload de arquivos e gerar instantaneamente links de compartilhamento limpos e legíveis por humanos, fáceis de compartilhar e lembrar.


  Uma das principais características do Erugo é a capacidade de criar solicitações de upload. Eles permitem que os usuários convidem outras pessoas para enviar arquivos de volta para eles por meio de uma página de upload exclusiva, sem exigir uma conta ou qualquer configuração técnica. Isto torna a colaboração e a coleta de arquivos simples e eficientes, seja para uso pessoal ou em ambientes profissionais.


  Com foco em design amigável e funcionalidade prática, Erugo se destaca como uma alternativa consciente da privacidade às principais plataformas de transferência de arquivos, como WeTransfer, Google Drive, Dropbox e Send Anywhere. Embora esses serviços muitas vezes dependam de infraestrutura centralizada e modelos de negócios baseados em publicidade, a Erugo oferece uma experiência refrescante e focada, eliminando complexidades e distrações desnecessárias.


  A plataforma é ideal para quem precisa de uma maneira simples de compartilhar arquivos, sem navegar em painéis desordenados ou ser exposto a anúncios. Cada elemento do Erugo, desde sua interface mínima até a estrutura limpa de seus links compartilháveis, é criado para tornar o compartilhamento de arquivos rápido, confiável e agradável.


  Ao fornecer uma alternativa simples e tranquila aos grandes nomes da transferência de arquivos, Erugo redefine o que pode ser o compartilhamento de arquivos. Ele oferece uma experiência clara, eficiente e verdadeiramente agradável de usar.


  ⚠️ Erugo entrega todo o seu potencial somente quando acessível pela internet. Recomenda-se usar o aplicativo Cloudflare disponível na Umbrel App Store para uma exposição fácil e segura.
