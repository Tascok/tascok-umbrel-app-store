manifestVersion: 1
id: tascok-enclosed
name: Enclosed
tagline: Um aplicativo web minimalista projetado para enviar notas privadas e seguras
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-enclosed/logo.png
category: files & productivity
version: "1.6.9"
port: 8525
description: >-
  Incluído está um aplicativo da web minimalista projetado para enviar notas privadas com segurança. Esteja você compartilhando informações confidenciais ou simplesmente precise de uma maneira simples de enviar mensagens criptografadas, o Enclosed oferece uma interface fácil de usar com recursos de segurança robustos, garantindo que seus dados permaneçam confidenciais.


  Enclosed usa APIs criptográficas de navegador nativo para criptografar e descriptografar notas, fornecendo segurança e alto desempenho. Essas APIs só são acessíveis em contextos seguros (HTTPS). Portanto, se você estiver executando o aplicativo em uma conexão insegura (HTTP), verá um aviso no aplicativo.


  ⚠️ Para configuração HTTPS, você pode usar o aplicativo Cloudflare Tunnel disponível na Umbrel App Store para proteger sua conexão.


