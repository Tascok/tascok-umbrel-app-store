id: tascok-serpbear
name: SerpBear
tagline: Uma ferramenta de SEO projetada para precisão e simplicidade
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-serpbear/logo.png
