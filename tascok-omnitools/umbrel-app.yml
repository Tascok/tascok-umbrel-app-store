releaseNotes: >-
  Version 0.5.0 introduces a wide range of new tools across various categories: image editing (crop, rotate, filters, watermark), PDF editing and conversion, video-to-GIF, and several audio tools like trimming, merging, and speed adjustment. It also adds handy utilities like a Crontab explainer, text censoring, and XML validation and beautification.
