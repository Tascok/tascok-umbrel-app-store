manifestVersion: 1
id: tascok-grimoire
name: Grimoire
tagline: Um gerenciador de favoritos para os assistentes
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-grimoire/logo.png
category: files & productivity
version: "0.5.0"
port: 5173
description: >-
  🧙‍♂️ Grimoire é um gerenciador de favoritos de código aberto e rico em recursos que permite aos usuários armazenar e organizar seus favoritos da web de uma forma que seja visualmente atraente e altamente funcional. Projetado para agilizar a experiência de bookmarking, Grimoire oferece um sistema automático de extração de metadados. Quando os usuários adicionam URLs, a plataforma extrai automaticamente dados relevantes, como título da página, descrição, imagens principais e, às vezes, até mesmo o conteúdo da página. Este recurso reduz significativamente o esforço manual necessário para categorizar e anotar marcadores.


  Além disso, Grimoire permite aos usuários organizar seus favoritos com tags e categorias, fornecendo uma maneira simples e eficiente de classificar links com base em preferências pessoais. A funcionalidade integrada de pesquisa de texto completo facilita a localização de marcadores específicos, verificando títulos, descrições e outros metadados armazenados.


  Para aqueles que desejam adicionar contexto pessoal ou lembretes, o Grimoire permite aos usuários anexar notas aos seus favoritos. Isso pode ser especialmente útil para acompanhar pensamentos ou informações relevantes que podem não ser imediatamente óbvias na própria página da web.


  Grimoire oferece suporte a contas de usuário, para que cada usuário tenha seu próprio espaço exclusivo para armazenar e organizar seus favoritos. Este sistema é particularmente útil para pessoas que gerem um grande número de marcadores e pretendem manter uma coleção personalizada e privada. Além disso, a plataforma é otimizada com recurso de modo escuro, que aumenta o conforto do usuário ao navegar em ambientes com pouca luz.
