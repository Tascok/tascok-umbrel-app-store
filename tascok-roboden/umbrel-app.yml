description: >-
  🤖 Roboden é um jogo de estratégia em tempo real com controle indireto, onde colônias robóticas autônomas competem por recursos, território e sobrevivência. Em vez de comandar cada unidade individualmente, você define prioridades e estratégias enquanto seus drones coletam materiais de forma independente, constroem edifícios, evoluem, defendem a colônia e atacam as forças opostas.


  Cada partida se desenvolve de forma diferente dependendo do modo de jogo selecionado, mapa, configuração da colônia, recursos disponíveis e decisões que você toma. Experimente diferentes núcleos de colônias, combinações de unidades, atualizações e abordagens táticas para construir um ecossistema robótico eficiente, capaz de se adaptar às mudanças nas condições do campo de batalha.


  Roboden inclui vários modos de jogo, cenários gerados processualmente, vários níveis de dificuldade, personalização de colônias, conquistas e suporte para teclado, toque e controladores de jogo compatíveis. O estilo visual minimalista mantém o campo de batalha legível mesmo quando um grande número de unidades estão ativas ao mesmo tempo.


  💡 Este pacote Umbrel executa a versão oficial do WebAssembly localmente através do seu navegador. O progresso e as configurações do jogo são armazenados no perfil do navegador e não no dispositivo Umbrel. Limpar os dados do navegador ou abrir o jogo em outro navegador pode, portanto, resultar em um salvamento separado. Um navegador baseado em Chromium é recomendado para obter o melhor desempenho.
