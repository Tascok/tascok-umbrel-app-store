manifestVersion: 1
id: tascok-syncin
name: Sync-in
tagline: Uma plataforma para sincronizar, compartilhar e colaborar com segurança
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-syncin/logo.png
category: files & productivity
version: "1.3.2"
port: 8943
description: >-
  🔄 Sync-in é uma plataforma colaborativa que permite aos usuários armazenar, gerenciar e trabalhar juntos em arquivos em um ambiente seguro e organizado. Ele permite a colaboração em tempo real em documentos, planilhas e apresentações, completa com comentários, feedback e rastreamento de atividades para manter todos alinhados. Os usuários podem criar espaços dedicados para projetos ou equipes, organizar arquivos sem duplicação e compartilhar conteúdo interna ou externamente com controle preciso sobre acessos e permissões.


  A pesquisa avançada facilita a localização de informações no conteúdo do arquivo, incluindo texto, PDFs e formatos do Office. A plataforma inclui um poderoso gerenciador de arquivos com recursos de arrastar e soltar, classificar, filtrar e visualizar, bem como ferramentas para gerenciar tarefas offline e operações da área de transferência. A sincronização mantém os arquivos atualizados em todos os dispositivos, enquanto o histórico de versões e os registros detalhados garantem transparência e responsabilidade.


  Por meio de edição integrada, opções de compartilhamento seguro e recursos de colaboração estruturada, o Sync-in agiliza o trabalho em equipe e centraliza o conteúdo do projeto em um local acessível.
developer: Johan Legrand
