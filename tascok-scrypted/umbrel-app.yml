releaseNotes: >-
  This update introduces support for notification channels in the SDK's NotifierOptions. Key changes include enhancements to Docker integration for better volume handling and improved error handling during container restoration, along with options to disable auto-enabling of devices. Various optimizations and bug fixes have also been implemented to enhance overall usability and stability.
