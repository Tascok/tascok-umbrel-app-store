releaseNotes: >-
  In the latest version (v0.19.2) of Kestra, several enhancements and bug fixes have been implemented. New features include the addition of an executions tab in the user interface and improved visibility of charts on the flows and logs pages. Additionally, various bug fixes were made, such as correcting typos in French translations and enhancing the user interface to address issues like incorrect date displays and inaccurate dashboard values. Maintenance tasks also focused on the user interface and translations.
