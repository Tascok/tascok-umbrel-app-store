manifestVersion: 1
id: tascok-yadnsb
name: YaDNSb
tagline: Uma ferramenta avançada para testar o desempenho do DNS
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-yadnsb/logo.png
category: networking
version: "0.0.6"
port: 3933
description: >-
  YaDNSb, abreviação de Yet another DNS Benchmark, é uma ferramenta de código aberto projetada para medir e comparar o desempenho de vários servidores e protocolos DNS. Ele foi desenvolvido para fornecer aos usuários uma maneira acessível e confiável de analisar como diferentes configurações de DNS se comportam em cenários do mundo real. Ao simular consultas DNS típicas e rastrear tempos de resposta, o YaDNSb permite que os usuários avaliem a velocidade e a eficiência dos servidores DNS usando protocolos DNS criptografados modernos, como DNS sobre HTTPS, DNS sobre TLS e DNS sobre QUIC, juntamente com DNS tradicional sobre UDP ou TCP.


  O projeto é direcionado a desenvolvedores, administradores de rede e usuários preocupados com a privacidade que desejam avaliar o impacto de diferentes protocolos DNS no desempenho. É particularmente útil para aqueles que estão explorando alternativas ao seu provedor DNS padrão e desejam tomar decisões informadas com base em dados mensuráveis. A ferramenta está disponível como um contêiner Docker, simplificando a implantação e o uso em uma ampla variedade de sistemas.


  YaDNSb vem com uma interface web limpa onde os resultados são visualizados de forma intuitiva, permitindo aos usuários ver quais servidores respondem mais rapidamente em diferentes condições. Uma instância pública também está disponível online para quem quiser experimentar a ferramenta sem hospedá-la. O projeto é licenciado sob a GPL versão 3 e é mantido ativamente, com contribuições bem-vindas da comunidade de código aberto.


  Numa época em que a criptografia e a privacidade do DNS estão se tornando cada vez mais importantes, o YaDNSb serve como um recurso prático para compreender e otimizar o desempenho do DNS usando protocolos clássicos e modernos.
