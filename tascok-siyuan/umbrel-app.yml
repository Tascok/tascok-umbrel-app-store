releaseNotes: >-
  This SiYuan update delivers various usability improvements and bug fixes, particularly enhancing tag handling, table editing, web clipping, and PDF exports. It also improves the user experience on Android and introduces better synchronization and search behavior. 


  Additionally, the software has been upgraded to Electron v34.5.0 and includes refinements to its internal API and plugin system.
