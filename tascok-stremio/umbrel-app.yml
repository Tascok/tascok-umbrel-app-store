id: tascok-stremio
name: Stremio
tagline: Um hub de streaming completo para todas as suas necessidades de entretenimento
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-stremio/logo.png
category: media
version: "1.1.118"
port: 10470
description: >-
  Stremio é uma plataforma de streaming de mídia gratuita e de código aberto que permite aos usuários assistir filmes, programas de TV, TV ao vivo e canais da web em um só lugar. Ele agrega conteúdo de diversas fontes e os apresenta em uma interface fácil de usar, tornando-o um centro completo de entretenimento. A plataforma foi projetada para suportar uma variedade de tipos de mídia e fornece aos usuários um local centralizado para organizar e transmitir conteúdo.


  Uma das principais características do Stremio é o seu sistema complementar, que permite aos usuários integrar várias fontes de streaming. Esses complementos podem vir de fornecedores oficiais e de fontes criadas pela comunidade, permitindo aos usuários acessar uma ampla variedade de conteúdo. Os add-ons são essenciais para a flexibilidade do Stremio e podem ser adicionados ou removidos de acordo com as preferências do usuário, garantindo uma experiência de streaming personalizada.


  A interface de usuário do Stremio é limpa, intuitiva e simples de navegar. Ele permite que os usuários encontrem rapidamente seu conteúdo favorito e o organizem em bibliotecas pessoais. Além disso, o Stremio fornece notificações sobre novos episódios e atualizações, garantindo que os usuários nunca percam seus programas ou filmes favoritos.


  Embora o Stremio em si seja um serviço legítimo e legal, o conteúdo que você acessa por meio de seus complementos pode variar em termos de legalidade. Embora alguns complementos forneçam acesso a conteúdo disponível gratuitamente, outros podem oferecer material protegido por direitos autorais. Os usuários são incentivados a garantir que transmitam apenas conteúdo para o qual tenham os direitos ou permissões necessários.


  No geral, o Stremio é um centro de mídia versátil e fácil de usar que permite aos usuários centralizar todas as suas necessidades de streaming. É ideal para quem deseja gerenciar seu entretenimento em um só lugar, mas é importante estar atento às questões legais relacionadas ao streaming de conteúdo protegido por direitos autorais por meio de complementos de terceiros.


  ⚠️ O Stremio Web Player e o servidor associado são executados no mesmo contêiner e são acessíveis por padrão através das portas 10470 para o Web Player e 11470 para o servidor. Basta inserir o endereço IP da LAN do sistema nas configurações do Stremio para configurar o servidor de streaming.
