id: tascok-vito
name: Vito
tagline: Um aplicativo de compartilhamento de segredos seguro e auto-hospedado
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-vito/logo.png
category: files & productivity
version: "0.0.4"
port: 9998
description: >-
  🕵️‍♂️ Vito é um aplicativo auto-hospedado projetado para compartilhar segredos com segurança, como senhas, tokens de acesso ou outras informações confidenciais. Desenvolvido pelo GlobusGroup, o Vito oferece aos usuários controle total sobre a confidencialidade e o tratamento de seus dados, eliminando a necessidade de depender de serviços de terceiros. O objetivo do projeto é fornecer uma maneira simples e segura para indivíduos ou equipes trocarem informações privadas sem comprometer a privacidade ou a usabilidade.


  A principal força do Vito reside na sua capacidade de criptografar segredos e disponibilizá-los para acesso único através de um link. Depois que um segredo é visualizado, ele é imediatamente excluído para evitar reutilização ou acesso não autorizado. Essa abordagem garante que mesmo que o link seja interceptado após o uso, ele não terá valor, oferecendo uma defesa prática e eficaz contra vazamentos ou violações.


  Vito é de código aberto e licenciado pela AGPL 3.0, o que garante que os usuários sejam livres para inspecionar o código, contribuir com melhorias e implantar o software em ambientes que eles controlam totalmente. A transparência e a soberania do usuário estão no centro do projeto, alinhando-se aos valores de desenvolvedores e administradores preocupados com a privacidade.


  O Vito é particularmente útil para equipes que precisam trocar credenciais confidenciais regularmente, como engenheiros de DevOps, administradores de sistema ou desenvolvedores que trabalham em ambientes com segurança. Ele oferece tranquilidade ao combinar técnicas modernas de criptografia com uma experiência de usuário mínima e focada, tudo sob controle total do usuário.


  Ao escolher o Vito, indivíduos e equipes podem compartilhar segredos com segurança, de forma privada e independente de provedores centralizados.


  ⚠️ Vito requer HTTPS para funcionar corretamente e garantir que todos os segredos sejam transmitidos com segurança. A maneira mais fácil de habilitar HTTPS é usando o aplicativo Cloudflare disponível na Umbrel App Store. 
