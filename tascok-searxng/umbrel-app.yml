name: SearXNG
tagline: Um mecanismo de metabusca gratuito na Internet
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-searxng/logo.png
category: networking
version: "2025.7.19"
