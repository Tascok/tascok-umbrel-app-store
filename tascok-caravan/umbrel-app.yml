category: bitcoin
version: "1.19.2"
port: 8376
description: >-
  🏜️ Caravan é um coordenador multisig de Bitcoin sem estado para criar carteiras, gerar endereços de recebimento, revisar saldos, construir transações e coordenar assinaturas sem entregar a custódia das chaves privadas ao aplicativo.


  Ele suporta fluxos de trabalho multisig comuns baseados em descritores de saída e transações Bitcoin parcialmente assinadas, permitindo que os participantes troquem configurações de carteira, chaves públicas e assinaturas entre dispositivos ou locais separados.


  O Caravan pode funcionar com carteiras de hardware suportadas e com chaves e dados de assinatura importados ou exportados manualmente. As informações do Blockchain podem ser obtidas de provedores públicos, como mempool.space e Blockstream, ou de um endpoint Bitcoin Core configurado separadamente.


  Os arquivos de configuração da carteira e as informações de recuperação devem ter backup independente. O Caravan é intencionalmente apátrida e não armazena as informações necessárias para reconstruir uma carteira multisig no dispositivo Umbrel.
