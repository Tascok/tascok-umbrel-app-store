id: tascok-liquid-photos
name: Liquid Photos
tagline: Uma ferramenta fácil para explorar conjuntos de fotos
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-liquid-photos/logo.png
category: files & productivity
version: "2025.08.22"
port: 6363
description: >-
  📸 Liquid Photos é um visualizador de fotos limpo e eficiente criado para tornar a exploração de grandes coleções de imagens simples e intuitiva. Ele exibe suas fotos usando a mesma estrutura de pastas que você já possui, permitindo navegar naturalmente sem precisar reorganizar nada. A interface concentra-se inteiramente na clareza e facilidade de uso para que suas imagens permaneçam o centro das atenções.


  O aplicativo carrega imagens rapidamente, mesmo em pastas contendo milhares de arquivos, dando acesso imediato a todo o seu arquivo. A rolagem suave faz com que a movimentação por longas listas de imagens seja confortável e responsiva. Cada foto abre instantaneamente em um visualizador nítido que destaca a imagem sem distrações ou controles desnecessários.


  O Liquid Photos foi pensado para quem prefere navegar pelas suas fotos de forma organizada e estruturada. Ele ajuda você a navegar em árvores de pastas profundas com confiança e facilita a revisitação de memórias antigas sem esperar o carregamento das imagens. Funciona bem com coleções muito grandes e mantém tudo acessível através de um layout de navegação simples.


  No geral, ele fornece uma maneira simples e tranquila de visualizar as fotos exatamente como estão armazenadas, fazendo com que até arquivos muito grandes pareçam leves e gerenciáveis.


  ℹ️ As fotos devem ser colocadas dentro da pasta Fotos do aplicativo Umbrel Files.
