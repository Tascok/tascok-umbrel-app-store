description: >-
  🔍 SearxNG é um mecanismo de metabusca que permite aos usuários pesquisar na Internet combinando resultados de vários provedores de pesquisa em uma lista abrangente. Quando um usuário envia uma consulta, o SearxNG a envia simultaneamente para uma variedade de mecanismos e serviços de pesquisa externos. Em seguida, ele coleta e mescla as respostas, apresentando ao usuário um conjunto unificado de resultados de pesquisa. Esta abordagem permite aos usuários acessar uma gama mais ampla de informações de diferentes fontes sem ter que pesquisar cada uma delas individualmente.


  O aplicativo enfatiza a entrega de resultados de pesquisa diversos e equilibrados, agregando resultados de muitas plataformas diferentes. Ao reunir esses vários resultados, o SearxNG ajuda a reduzir o preconceito que pode advir da dependência de um único mecanismo de pesquisa, oferecendo aos usuários uma perspectiva mais neutra e variada sobre seus tópicos de pesquisa. O sistema foi projetado para lidar com diversos tipos de pesquisas, desde páginas da web até imagens, vídeos, notícias e outras categorias, dependendo dos provedores consultados.


  Além disso, o SearxNG foi desenvolvido para respeitar a privacidade do usuário, não armazenando históricos de pesquisa ou dados pessoais. Isso significa que cada pesquisa é tratada de forma independente e não ocorre nenhum rastreamento ou perfil pessoal. O anonimato das pesquisas ajuda os usuários a se sentirem mais seguros ao pesquisar informações online. No geral, o SearxNG funciona como uma ferramenta poderosa de pesquisa, aproveitando os pontos fortes de vários mecanismos de pesquisa, ao mesmo tempo que protege a privacidade do usuário e promove uma experiência de pesquisa aberta e imparcial.
