releaseNotes: >-
  Eigenfocus has introduced significant improvements across versions 1.3.0 through 1.5.1, focusing on enhanced time tracking functionality, better issue management, and improved user experience. The releases bring time tracking alerts to prevent forgotten timers, flexible manual time entry in minutes or hours, easier issue completion workflows, global issue URLs for sharing, and improved draft saving for better collaboration.

  Full release notes can be found at https://github.com/Eigenfocus/eigenfocus/releases
