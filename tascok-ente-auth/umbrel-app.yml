releaseNotes: >-
  Auth v4.3.5 introduces several enhancements and fixes, including updates to custom icons for various services such as AJ Bell, Ankama, Seafile, and LinkedIn. The release also addresses multiple bug fixes, such as improving the 2FA recovery flow, resolving issues with the logout button on the lock screen, and refining the change-password process after login. Additionally, it includes new translations, support for advanced TOTP options, and minor UI adjustments, ensuring a more polished and user-friendly experience.
