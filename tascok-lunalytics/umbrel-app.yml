category: networking
version: "0.9.7"
port: 8183
description: >-
  🔍 Lunalytics oferece um rico conjunto de recursos projetados para lhe dar visibilidade total da saúde de seus serviços. Ele monitora continuamente endpoints HTTP e TCP e fornece estatísticas detalhadas de tempo de atividade e latência com rastreamento preciso do tempo de resposta.


  A ferramenta também inclui monitoramento automático de certificados TLS para que você seja alertado antes que os certificados expirem ou se tornem inválidos. Isso ajuda a evitar tempos de inatividade inesperados causados ​​por problemas de certificados.


  Cada endpoint monitorado pode ser configurado com intervalos, tags e descrições personalizadas, permitindo organização e categorização flexíveis. Você pode agrupar serviços por projeto, tipo ou qualquer outro critério adequado ao seu fluxo de trabalho.


  O sistema de alerta integrado notifica quando um serviço fica inativo ou mostra comportamento anormal para que você possa reagir imediatamente. Os alertas são enviados apenas quando são importantes para evitar ruídos desnecessários.


  Lunalytics oferece suporte a vários usuários com controle de acesso baseado em funções, permitindo que as equipes compartilhem painéis enquanto mantêm os limites de permissão. Os administradores podem convidar usuários e atribuir funções para gerenciar os níveis de acesso de maneira eficaz.


  Todos os dados de monitoramento são exibidos em tempo real através de um painel intuitivo e interativo. Gráficos históricos e registros de solicitações permitem análises mais profundas e ajudam a identificar tendências ou problemas recorrentes ao longo do tempo.
