id: tascok-restreamer
name: Restreamer
tagline: Um servidor de vídeo de código aberto fácil de usar
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-restreamer/logo.png
category: files & productivity
version: "2.12.0"
port: 8135
description: >-
  Restreamer é um servidor de streaming de código aberto desenvolvido pela datarhei, projetado para simplificar a transmissão de vídeo ao vivo. Ele fornece uma interface intuitiva baseada na web que permite aos usuários configurar e gerenciar streams sem a necessidade de conhecimento técnico avançado. Suportando uma variedade de protocolos de streaming, incluindo RTMP, HLS, SRT e WebRTC, permite transmissão de vídeo contínua em diferentes plataformas.


  O software pode receber vídeo de fontes como webcams, câmeras IP ou outros feeds ao vivo e redistribuir o conteúdo para vários destinos, como YouTube, Twitch ou servidores personalizados. Isso o torna uma ferramenta versátil para indivíduos, empresas e organizações que buscam compartilhar conteúdo ao vivo com eficiência.


  O Restreamer é otimizado para baixo consumo de recursos, permitindo que ele seja executado em uma ampla variedade de hardware, incluindo sistemas embarcados e dispositivos com baixo consumo de energia. Seu recurso de reconexão automática garante streaming ininterrupto, mesmo em casos de perda temporária de conexão.


  Com sua combinação de facilidade de uso, flexibilidade e confiabilidade, o Restreamer serve como uma solução poderosa para vários cenários de transmissão ao vivo, desde transmissões pessoais até distribuição de mídia profissional.
