releaseNotes: >-
  Version 0.7.13 introduces the new parseLocalTime function for custom APIs, which defaults to the local timezone when no timezone is specified. It also adds a target property to the search widget for opening results in new tabs. Bug fixes include improved temperature sensor detection in the server stats widget and proper URL escaping in the Reddit widget.
