id: tascok-dockerizalo
name: Dockerizalo
tagline: Uma plataforma de implantação simples
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-dockerizalo/logo.png
category: developer tools
version: "1.4.0"
port: 8522
description: >-
  🐳 Dockerizalo é uma ferramenta de código aberto projetada para simplificar a implantação de aplicativos para auto-hosters. Ele fornece uma interface web que permite aos usuários clonar repositórios Git, construir imagens Docker e executar contêineres com intervenção manual mínima. A ideia principal por trás do Dockerizalo é agilizar o processo de implantação de aplicativos diretamente dos repositórios de código-fonte, facilitando o gerenciamento e a atualização de seus serviços pelos usuários.


  Ao contrário das ferramentas de gerenciamento de contêineres de uso geral, o Dockerizalo se concentra em automatizar todo o fluxo de trabalho de implantação. Isso inclui extrair o código mais recente, construir a imagem Docker correspondente e iniciar os contêineres necessários. O sistema depende de um banco de dados PostgreSQL para armazenar metadados sobre implantações e configurações. A interface da web oferece aos usuários a capacidade de configurar variáveis ​​de ambiente, volumes, portas e segredos. Além disso, oferece logs em tempo real tanto para o processo de construção quanto para a execução de contêineres, para que os usuários possam monitorar seus aplicativos facilmente.


  Dockerizalo pode ser integrado com webhooks para acionar compilações automaticamente sempre que o código é enviado para um repositório, embora isso exija configuração manual. A plataforma em si não inclui proxy reverso ou configuração HTTPS, o que significa que os usuários precisam lidar com o acesso seguro separadamente. Dockerizalo é particularmente adequado para ambientes de laboratório doméstico onde a simplicidade e a automação são prioridades principais. Ele fornece uma alternativa leve para pipelines de CI ou CD mais complexos, combinando gerenciamento de código-fonte com implantação de contêiner em uma única solução.
