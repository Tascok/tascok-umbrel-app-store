description: >-
  slskd é um aplicativo cliente-servidor auto-hospedado projetado para a rede de compartilhamento de arquivos Soulseek. É implementado em C# e distribuído sob a licença AGPL-3.0. Ao contrário do cliente Soulseek tradicional, o slskd é estruturado como um daemon que pode ser executado em várias plataformas, incluindo Linux, e fornece uma interface de usuário moderna baseada na web, acessível por meio de um navegador da web. Essa abordagem permite que os usuários interajam com a rede Soulseek sem depender do cliente oficial, mantendo a capacidade de pesquisar, baixar e compartilhar arquivos.


  O objetivo principal do slskd é oferecer uma maneira mais flexível e acessível de usar o Soulseek, especialmente para aqueles que preferem ou precisam de uma solução auto-hospedada. Ele aproveita um sistema de autenticação baseado em token que se integra perfeitamente com proxies reversos, aumentando a segurança e fornecendo mais controle sobre o acesso. Os usuários podem configurar o aplicativo usando um arquivo de configuração YAML, onde podem inserir suas credenciais de login do Soulseek e ajustar várias configurações de acordo com suas preferências.


  Um dos recursos de destaque do slskd é sua funcionalidade de pesquisa abrangente, permitindo aos usuários realizar várias pesquisas simultâneas, filtrar resultados e gerenciar downloads contínuos por meio de uma interface única e centralizada. A interface web é intuitiva e projetada para ser responsiva, facilitando o gerenciamento de arquivos de qualquer dispositivo com um navegador web.


  Para aqueles que desejam estender ou automatizar suas interações com o slskd, existe uma API Python dedicada chamada slskd-api. Esta API fornece endpoints para interagir com o daemon de forma programática, permitindo que os desenvolvedores integrem a funcionalidade do Soulseek em outros aplicativos ou fluxos de trabalho.


  O slskd também inclui mecanismos para autenticação segura, garantindo que apenas usuários autorizados possam acessar a interface. Isso o torna particularmente adequado para configurações multiusuário ou cenários em que o servidor é exposto à Internet por meio de um proxy reverso.


  No geral, o slskd representa uma abordagem modernizada do Soulseek, combinando a funcionalidade familiar do cliente original com a escalabilidade, segurança e conveniência de um serviço auto-hospedado baseado na web.


  ⚙️ Para obter instruções detalhadas de configuração, consulte a documentação aqui: https://github.com/dennysubke/dennys-umbrel-app-store/blob/master/tascok-slskd/readme.md.
