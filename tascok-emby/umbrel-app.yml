name: Emby
tagline: Um servidor de mídia pessoal
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-emby/logo.png
category: media
version: "4.8.11"
port: 8097
description: >-
  ▶️ Emby é um poderoso software de servidor de mídia projetado para ajudar os usuários a gerenciar, transmitir e desfrutar de sua coleção pessoal de filmes, programas de TV, músicas, fotos e vídeos caseiros em uma ampla variedade de dispositivos. Ele atua como um hub central para todas as suas mídias digitais, organizando automaticamente o conteúdo e enriquecendo-o com metadados como capas, descrições e classificações. Emby fornece uma interface limpa e intuitiva que permite aos usuários navegar e reproduzir facilmente suas mídias, estejam em casa ou em trânsito.


  O sistema oferece suporte a uma ampla variedade de dispositivos, incluindo smart TVs, smartphones, tablets, computadores, caixas de streaming e consoles de jogos. Ele oferece funcionalidade de TV ao vivo e suporte DVR se um hardware de sintonizador compatível estiver conectado. Um dos recursos de destaque do Emby é a capacidade de transcodificar mídia em tempo real, ajustando a qualidade e o formato do vídeo de acordo com as capacidades do dispositivo usado e a velocidade da conexão com a Internet.


  Emby inclui ferramentas de gerenciamento de usuários que permitem às famílias criar contas separadas com restrições de acesso e controles parentais personalizados. Isto é particularmente útil para famílias com crianças, pois ajuda a adaptar a experiência mediática com base na idade e nas preferências de conteúdo.


  O Emby é frequentemente comparado a outros servidores de mídia como Plex e Jellyfin. Ao contrário do Jellyfin, que é totalmente de código aberto, Emby fez a transição para uma licença proprietária, o que levou à criação do Jellyfin como um fork voltado para a comunidade. Apesar disso, Emby continua a se desenvolver rapidamente e mantém uma forte base de usuários graças à sua combinação de facilidade de uso, rico conjunto de recursos e polimento profissional.


  Em resumo, o Emby é a solução ideal para quem deseja assumir o controle total de sua biblioteca de mídia e transmiti-la perfeitamente em diferentes dispositivos, mantendo um ambiente personalizado e privado.
