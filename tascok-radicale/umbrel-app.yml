manifestVersion: 1
id: tascok-radicale
name: Radicale
tagline: Um poderoso servidor CalDAV e CardDAV
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-radicale/logo.png
category: networking
version: "3.5.4.0"
port: 5232
description: >-
  Radicale é um aplicativo de servidor leve projetado para gerenciar e sincronizar calendários e dados de contato usando padrões abertos como CalDAV e CardDAV. Ele permite o compartilhamento e a sincronização contínuos de eventos, tarefas e informações de contato entre vários clientes e dispositivos.


  Ao aderir a protocolos amplamente suportados, o Radicale permite que diferentes aplicativos de calendário e catálogo de endereços se comuniquem entre si, garantindo que os dados permaneçam consistentes e atualizados.


  É capaz de lidar com coleções de dados individuais e compartilhadas, tornando-o adequado para uso pessoal e também para ambientes colaborativos onde vários usuários precisam acessar e atualizar as mesmas informações.


  Radicale se concentra na simplicidade e eficiência, fornecendo uma maneira simples de armazenar e acessar entradas de calendário e detalhes de contato, mantendo a compatibilidade com uma ampla gama de clientes de software.
