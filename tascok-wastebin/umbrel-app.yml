description: >-
  🗑️ Wastebin é um aplicativo da web simples projetado para compartilhar trechos de texto e código de forma rápida e sem distrações. Ele permite que os usuários colem conteúdo em uma interface da web e recebam instantaneamente um link exclusivo que pode ser compartilhado com outras pessoas. O foco do aplicativo está na simplicidade e velocidade, tornando-o ideal para troca rápida de logs, arquivos de configuração, mensagens de erro ou pequenos trechos de código-fonte.


  O aplicativo suporta realce de sintaxe para muitas linguagens de programação, o que melhora a legibilidade ao compartilhar código. Os usuários podem escolher como sua colagem deve se comportar, incluindo opções como definir um prazo de validade ou criar uma pasta que se exclua após ser visualizada uma vez. Isto o torna útil tanto para colaboração temporária quanto para compartilhamento de informações confidenciais que não devem permanecer acessíveis indefinidamente.


  Wastebin armazena pastas em um banco de dados leve e as apresenta por meio de uma interface de usuário limpa e minimalista. Não requer contas ou perfis de usuário, o que reduz a barreira de uso e mantém o fluxo de trabalho simples. Além da interface web, ele expõe uma API simples que permite a criação de pastas de forma programática, facilitando a integração em scripts ou fluxos de trabalho de desenvolvedores.


  No geral, Wastebin é uma ferramenta de compartilhamento de pasta focada que prioriza facilidade de uso, legibilidade e controles de privacidade opcionais sem adicionar recursos ou complexidade desnecessários.
