releaseNotes: >-
  Version 3 of LetoReader optimizes state management, significantly reducing RAM usage by keeping only one text in memory at a time. 


  Keyboard shortcuts have been introduced for easier PC navigation, and popovers have been replaced with dialogs to enhance the mobile experience. Additionally, the update includes a flatter design, various UI improvements, and multiple bug fixes related to state management and loading issues.
