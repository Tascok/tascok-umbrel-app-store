manifestVersion: 1
id: tascok-crafty
name: Crafty Controller
tagline: Uma maneira intuitiva de automatizar e gerenciar seu servidor Minecraft com facilidade
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-crafty/logo.png
category: gaming
version: "4.5.4"
port: 18443
description: >-
  ⛏️ Crafty Controller é uma interface de código aberto baseada na web projetada para gerenciar e controlar Crafty Bots, que são usados ​​para automatizar e gerenciar servidores Minecraft. O próprio Crafty é uma estrutura de bot que permite aos administradores automatizar várias tarefas nos servidores do Minecraft, desde a execução de testes até o gerenciamento de eventos no jogo, controle de configurações do servidor e muito mais. O Crafty Controller fornece uma plataforma centralizada onde os administradores podem monitorar e controlar esses bots em um só lugar.


  O principal benefício do Crafty Controller é sua simplicidade e facilidade de uso. Em vez de ter que interagir manualmente com cada bot por meio de código ou interface de linha de comando, o Crafty Controller fornece um painel da web amigável onde os administradores podem configurar comportamentos do bot, rastrear suas ações e emitir comandos. Ele permite adicionar ou remover bots, visualizar seus status e monitorar logs, o que é especialmente útil para solucionar problemas ou otimizar o desempenho do bot.


  Além disso, o Crafty Controller é altamente personalizável. Os administradores de servidor podem configurar bots para executar ações específicas com base em eventos ou interações do jogador, e os desenvolvedores podem estender a funcionalidade com scripts ou plug-ins personalizados. Essa flexibilidade o torna uma ferramenta valiosa para qualquer pessoa que execute um servidor Minecraft e precise automatizar tarefas ou criar uma jogabilidade personalizada baseada em bots.


  Em última análise, o Crafty Controller é uma ferramenta poderosa para automatizar e gerenciar servidores Minecraft, fornecendo um hub central que simplifica o gerenciamento de bots e permite uma administração mais eficiente das tarefas do servidor.


  ⚠️ Crafty Controller usa HTTPS para proteger seus dados pessoais. Ao acessar o Crafty Controller, você deve digitar explicitamente "https" no endereço, por exemplo, https://umbrel.local:18443.


  ℹ️ O Crafty Controller usa um certificado autoassinado, que pode acionar um aviso do navegador como “Sua conexão não é privada”. Você pode prosseguir com segurança clicando em "Avançado" e depois em "Prosseguir para umbrel.local (inseguro)" ou uma opção semelhante, dependendo do seu navegador.


  🔑 O nome de usuário padrão do Crafty Controller é 'admin' e a senha é gerada aleatoriamente. Você pode encontrar a senha no arquivo localizado em: /umbrel/app-data/tascok-crafty/data/config/default-creds.txt. É altamente recomendável alterar a senha imediatamente após fazer login por motivos de segurança.
