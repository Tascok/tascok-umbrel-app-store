manifestVersion: 1.2
id: tascok-firefox
category: networking
name: Firefox
version: "139.0.4"
tagline: Um navegador gratuito e de código aberto
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-firefox/logo.png
description: >-
  ⚠️ Este aplicativo foi removido da App Store oficial da Umbrel porque foi desativado porque não há mais atualizações que funcionem sem HTTPS.


  Obtenha o navegador que protege o que é importante.


  Nenhuma política de privacidade duvidosa ou portas secretas para os anunciantes. Apenas um navegador extremamente rápido que não o vende.


  Obtenha toda a velocidade e ferramentas sem nenhuma invasão de privacidade. O navegador Firefox coleta tão poucos dados sobre você que nem precisamos do seu endereço de e-mail para fazer o download. Isso ocorre porque, diferentemente de outros navegadores, não temos interesse financeiro em segui-lo pela web.


  O Firefox é para todos:


  Disponível em mais de 90 idiomas e compatível com máquinas Windows, Mac e Linux, o Firefox funciona independentemente do que você esteja usando ou de onde esteja. Certifique-se de que seu sistema operacional esteja atualizado para obter a melhor experiência.
releaseNotes: >-
  This release of Firefox brings multiple bug fixes and improvements:


    - Fixed Firefox freezing when switching between apps or opening certain panels within the browser
    - Fixed difficult selection of drop-down menu options in the Firefox preferences page when selected via the in-page search
    - Fixed various selection issues when triple-clicking text in some situations
    - Fixed an incorrect filename being used when setting an image as the desktop wallpaper on Windows
    - Various security fixes


  Full release notes are available at https://www.mozilla.org/en-US/firefox/notes/
