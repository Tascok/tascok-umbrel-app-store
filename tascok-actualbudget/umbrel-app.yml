releaseNotes: >-
  Actual Budget 26.7.0 introduces a new experimental bank sync provider for New Zealand through Akahu and makes the Actual CLI officially stable.


  The release also improves tag management with show/hide options, better bulk actions, and new tag filters. Reports have been enhanced with configurable average ranges, trend lines, and better Balance Forecast functionality.


  Budget automations received further improvements as well, including mobile support, notes, and more reliable links to schedules.


  In addition, this update includes many bug fixes across bank sync, reports, mobile views, imports, security, and overall performance.
