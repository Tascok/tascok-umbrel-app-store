description: >-
  🛒 Shopstr é um mercado descentralizado de código aberto construído no protocolo Nostr, projetado para permitir o comércio ponto a ponto global sem depender de plataformas centralizadas ou intermediários. Ele permite que os usuários comprem e vendam bens e serviços usando Bitcoin, incluindo suporte para pagamentos Lightning, mantendo controle total sobre seus dados e transações. Ao abraçar os princípios da soberania digital e do acesso sem permissão, a Shopstr oferece uma alternativa resistente à censura às plataformas tradicionais de comércio eletrônico.


  A plataforma faz uso de diversas propostas de melhoria da Nostr para fornecer recursos como identidade do usuário, comunicação criptografada e integração de pagamento. Construído com tecnologias web modernas como TypeScript, Next.js e Tailwind CSS, Shopstr oferece uma experiência rápida e fácil de usar. Ele pode ser auto-hospedado usando Docker e também acessível através da rede Tor para maior privacidade.


  Shopstr é ideal para quem busca um ambiente de comércio descentralizado e aberto, onde as transações são alimentadas por Bitcoin e governadas por protocolos abertos em vez de entidades corporativas.
