description: >-
  🔏 BIP47 Message Verifier é uma ferramenta leve para verificar mensagens assinadas com um endereço de notificação BIP47. BIP47 é um padrão Bitcoin para endereços de pagamento reutilizáveis, porém privados. Em vez de criar um novo endereço para cada transação ou reutilizar o mesmo, o BIP47 permite a comunicação criptografada através do chamado código de pagamento.


  O endereço de notificação é uma parte técnica deste código e é utilizado para estabelecer o contato inicial entre duas carteiras. Com o Verificador de Mensagens BIP47 você pode verificar se uma mensagem foi realmente assinada com o endereço de notificação de um código de pagamento específico. Isto é especialmente útil para usuários PayNym que desejam provar sua identidade ou assinar mensagens sem comprometer sua privacidade.


  Além da Carteira Samourai, que originalmente introduziu o BIP47 e o PayNym, projetos mais recentes como o Ashigaru focam no uso independente e minimalista dessas tecnologias. Ashigaru permite a comunicação PayNym sem infraestrutura centralizada e sem a necessidade de um dispositivo Android.


  Neste contexto, o BIP47 Message Verifier é uma ferramenta prática para verificar mensagens assinadas e estabelecer confiança entre usuários PayNym sem a necessidade de qualquer intermediário.
