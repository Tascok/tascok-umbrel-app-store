description: >-
  🐢 Kurpod é um aplicativo de código aberto que permite aos usuários incorporar contêineres criptografados em arquivos aparentemente comuns, como imagens, vídeos e documentos. O projeto concentra-se na esteganografia, com o objetivo de tornar a presença de dados ocultos indetectável por inspeção casual. Por exemplo, uma simples foto de férias ou um documento PDF pode conter secretamente um arquivo inteiro de arquivos, todos criptografados e completamente invisíveis para qualquer pessoa que abra o arquivo em um visualizador normal.


  Ao contrário de muitas ferramentas de esteganografia mais antigas, o Kurpod enfatiza uma experiência amigável e depende de padrões criptográficos modernos. O objetivo é simplificar para qualquer pessoa a criação e extração de dados ocultos sem a necessidade de conhecimento técnico profundo. A interface baseada na web orienta os usuários no processo de escolha de um arquivo host, upload do conteúdo que desejam ocultar e proteção com uma senha. A saída é um arquivo totalmente funcional que se comporta como seu tipo original, seja um vídeo MP4, uma imagem JPEG ou um documento PDF padrão.


  O Kurpod foi desenvolvido pensando na transparência e na segurança, oferecendo aos usuários uma ferramenta eficaz para preservar a privacidade à vista de todos. É adequado para jornalistas, ativistas ou qualquer pessoa que precise armazenar ou transferir discretamente dados confidenciais.
