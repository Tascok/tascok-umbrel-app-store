description: >-
  SolidInvoice é um aplicativo de cobrança e faturamento de código aberto, desenvolvido principalmente para pequenas empresas, freelancers e agências. Escrito em PHP e construído na estrutura Symfony, ele fornece um conjunto abrangente de ferramentas para agilizar faturamento, cotações e rastreamento de pagamentos.


  Principais recursos:


  💰 Faturamento e cotações: SolidInvoice permite aos usuários criar e enviar faturas e orçamentos profissionais aos clientes com apenas alguns cliques. Modelos personalizáveis ​​e a capacidade de adicionar impostos, descontos e outros detalhes tornam o faturamento versátil e personalizado.


  👥 Gerenciamento de clientes: o aplicativo inclui um sistema de gerenciamento de clientes que organiza e rastreia os detalhes do cliente, permitindo que as empresas armazenem e acessem informações de contato do cliente, histórico de faturamento e faturas ou orçamentos associados.


  ⏰ Controle de tempo: SolidInvoice integra recursos básicos de controle de tempo, úteis para rastrear horas faturáveis ​​diretamente vinculadas a faturas específicas. Esse recurso é ideal para profissionais de serviços que cobram por tempo.


  💱 Suporte para várias moedas e vários idiomas: SolidInvoice oferece suporte a várias moedas e idiomas, tornando-o adequado para negócios internacionais. Os usuários podem faturar clientes em suas moedas locais e selecionar diferentes idiomas conforme necessário.


  💳 Integração de pagamento: O software se integra a gateways de pagamento populares como Stripe e PayPal, permitindo que os clientes paguem faturas online. Os usuários podem rastrear status de pagamento e enviar lembretes automáticos de pagamentos pendentes.


  📊 Relatórios e análises: SolidInvoice fornece relatórios e análises financeiras detalhadas, fornecendo às empresas insights sobre receitas, faturas não pagas e outros dados financeiros importantes.


  🔑 Funções e permissões do usuário: Com um sistema de permissões baseado em funções, o SolidInvoice permite que as empresas controlem os níveis de acesso de cada usuário, facilitando o gerenciamento de equipes e a delegação segura de tarefas.


  ✨ Configurações personalizáveis: os usuários podem personalizar modelos de fatura, definir preferências de negócios, ajustar taxas de impostos e configurar outros aspectos do aplicativo para atender às suas necessidades específicas.


  SolidInvoice é totalmente de código aberto e voltado para a comunidade, com contribuições incentivadas via GitHub. Isso o torna uma excelente escolha para quem procura uma solução de faturamento gratuita, robusta e personalizável.


  ---


  ⚠️ Para configurar o banco de dados SolidInvoice, siga estas instruções para configurar os detalhes da conexão:


  Driver: Selecione "mysql" como driver de banco de dados.


  Host: Insira "tascok-solidinvoice_db_1" como o nome do host.


  Porta: Digite "3306", a porta padrão para MySQL.


  Usuário: Digite “solidinvoice” como nome de usuário do banco de dados.


  Senha: A senha é "umbrel".


  Banco de dados: insira “solidinvoice” como nome do banco de dados.


  Depois que todos os campos estiverem preenchidos, clique em Avançar para prosseguir com a configuração. Esta configuração conectará a aplicação SolidInvoice à instância do banco de dados MySQL. Se você encontrar um erro de tempo limite do gateway durante o processo de configuração, basta atualizar a página no seu navegador. Isso geralmente resolverá problemas temporários de conectividade e permitirá que a configuração continue.

