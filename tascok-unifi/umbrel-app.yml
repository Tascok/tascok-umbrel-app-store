id: tascok-unifi
name: UniFi Network Server
tagline: Uma solução intuitiva para gerenciamento de rede contínuo
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-unifi/logo.png
category: networking
version: "9.0.114"
port: 8892
description: >-
  O UniFi Network Server é uma plataforma de software desenvolvida pela Ubiquiti Networks para gerenciar e monitorar dispositivos de rede UniFi, que incluem roteadores, switches, pontos de acesso e outros hardwares de rede. O ecossistema UniFi foi projetado para fornecer soluções de rede escalonáveis ​​e de alto desempenho, e o Network Server serve como hub central para controlar e supervisionar esses dispositivos. Ele atua como um console de gerenciamento centralizado, permitindo aos administradores de rede configurar, monitorar e manter toda a infraestrutura da rede UniFi a partir de uma única interface.


  O software oferece uma ampla gama de recursos para gerenciamento de rede. Ele permite a configuração de dispositivos como pontos de acesso e switches, a criação e o gerenciamento de configurações de segurança de rede (como firewalls e VPNs) e o monitoramento do tráfego e do desempenho da rede. Os administradores podem visualizar análises detalhadas da rede, incluindo estatísticas de uso e integridade do dispositivo, ajudando-os a solucionar problemas e otimizar o desempenho da rede. Além disso, o UniFi Network Server permite a implantação de atualizações de software e firmware em todos os dispositivos conectados, garantindo que a rede esteja executando as versões mais recentes e seguras do software.


  Um dos principais benefícios do UniFi Network Server é sua interface amigável, que simplifica as tarefas de gerenciamento de rede. Ele fornece uma abordagem simplificada tanto para administradores de rede experientes quanto para aqueles que são novos no gerenciamento de infraestruturas de rede. A plataforma pode ser implantada em servidores locais ou por meio de soluções baseadas em nuvem, oferecendo flexibilidade dependendo das necessidades da organização. No geral, o UniFi Network Server é uma ferramenta essencial para empresas e indivíduos que buscam gerenciar e otimizar com eficiência sua infraestrutura de rede baseada em UniFi.


  ⚙️ O aplicativo de rede UniFi requer várias portas para funcionar corretamente:


  A porta 8893 é usada para a interface web do controlador e só pode ser acessada via HTTPS. A porta 3478/UDP é a porta STUN, que permite a conexão de dispositivos fora da rede local. A porta 10001/UDP é necessária para descobrir pontos de acesso UniFi na rede local. A porta 8080 é usada para comunicação entre o controlador e os dispositivos UniFi.


  A porta 1900/UDP é necessária quando a opção “Tornar o controlador detectável na rede L2” está habilitada. As portas 8843 e 8880 são usadas para o portal de convidados UniFi – 8893 para redirecionamentos HTTPS e 8892 para redirecionamentos HTTP. A porta 6789 permite testes de rendimento por meio do aplicativo móvel UniFi. Finalmente, a porta 5514/UDP é usada para enviar dados syslog remotos para sistemas de registro externos.


  ⚠️ Importante: A interface web só funciona com TLS (HTTPS). O acesso por HTTP simples não é possível. Proxies reversos ou configurações do Cloudflare Tunnel devem encaminhar o tráfego HTTPS diretamente para a porta 8893.
