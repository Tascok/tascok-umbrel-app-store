releaseNotes: >-
  The latest release includes several important updates and fixes. The export logic has been improved for better temporary file clean-up, and in-app export endpoints now have rate limits. Additionally, translations have been updated with the latest Crowdin changes, PHP dependency package versions have been updated, and a fix has been applied to prevent markdown editor focus from jumping when inserting an image.
