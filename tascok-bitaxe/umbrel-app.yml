manifestVersion: 1
id: tascok-bitaxe
name: Bitaxe Webflasher
tagline: Uma ferramenta fácil para atualizar dispositivos Bitaxe
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-bitaxe/logo.png
category: bitcoin
version: "1.0.1"
port: 3640
description: >-
  O Bitaxe Web Flasher é uma ferramenta projetada para atualizar firmware em dispositivos Bitaxe.


  A ferramenta simplifica o processo de atualização, oferecendo suporte à detecção automática de dispositivos, incluindo modelos e versões de placa. Ele oferece uma interface web amigável para selecionar o firmware correto e iniciar o processo.


  ⚠️ O Bitaxe Web Flasher não funciona em dispositivos ARM como o Raspberry Pi. Além disso, é recomendável usar um navegador baseado em Chromium para obter a melhor experiência com a ferramenta.
developer: WantClue
website: https://bitaxeorg.github.io/bitaxe-web-flasher/
