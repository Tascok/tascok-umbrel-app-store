releaseNotes: >-
  The latest v3.0.0-beta.11 release of Palmr focuses on a complete overhaul of the translation system by removing automatic translations and enforcing manual human reviews. It also introduces a new SMTP connection test feature for administrators, along with multi-language updates and bulk file actions in reverse shares for better user experience. 


  Additionally, this version includes various UI improvements, code refactoring, and the removal of outdated translation scripts to streamline the workflow.
