releaseNotes: >-
  This update introduces resumable timers, multiple widgets for a single plugin, and improved input retention when switching tabs on desktop. It also fixes issues with the tracking board not loading after onboarding, plugin titles in the database editor, location caching on startup, and a text overwrite bug in the capture field.
