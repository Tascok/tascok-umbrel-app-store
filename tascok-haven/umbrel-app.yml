id: tascok-haven
name: Haven
tagline: Uma maneira fácil de criar seu próprio blog privado
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-haven/logo.png
category: social
version: "ed8777c"
port: 3338
description: >-
  Haven é uma plataforma de código aberto que permite hospedar seu próprio blog privado em um servidor pessoal. Ele permite que os usuários criem postagens, adicionem imagens e controlem quem tem acesso ao seu conteúdo, tudo isso sem depender de grandes corporações. Haven prioriza privacidade e segurança, evitando anúncios e rastreamento.


  Haven usa Markdown para escrever postagens e fornece uma visualização ao vivo, permitindo que você veja como ficarão suas postagens em tempo real. As imagens enviadas são compactadas automaticamente para tempos de carregamento mais rápidos, enquanto os arquivos originais são preservados para visualização de alta qualidade.


  Um recurso de destaque é o leitor de feeds integrado, que permite aos usuários criar feeds privados de sites e outros refúgios, consolidando todo o conteúdo favorito em um só lugar.


  Haven é ideal para usuários que buscam uma plataforma privada para compartilhar conteúdo com amigos e familiares, em vez de usar blogs públicos ou mídias sociais.


  🔑 Por padrão, o nome de usuário é “haven@umbrel.blog” e a senha é “umbrel”.
