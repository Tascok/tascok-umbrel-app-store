name: HabitTrove
tagline: Um aplicativo gamificado de rastreamento de hábitos
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-habittrove/logo.png
category: files & productivity
version: "0.2.5"
