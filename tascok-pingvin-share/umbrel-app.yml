manifestVersion: 1
id: tascok-pingvin-share
name: Pingvin Share
tagline: Uma solução de compartilhamento de arquivos auto-hospedada, combinando facilidade e elegância
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-pingvin-share/logo.png
category: files & productivity
version: "1.1.3"
port: 6453
description: >-
  Pingvin Share é uma plataforma de compartilhamento de arquivos auto-hospedada de código aberto, projetada para compartilhamento privado e seguro de arquivos sem depender de serviços de nuvem de terceiros. Ele permite que os usuários compartilhem arquivos diretamente entre dispositivos com criptografia ponta a ponta, garantindo a privacidade dos dados.


  A plataforma enfatiza a facilidade de uso, apresentando uma interface de usuário simples e tornando-a ideal para quem prioriza o controle sobre seus dados e deseja evitar soluções de compartilhamento baseadas em nuvem de grandes provedores.


  ⚠️ Recomenda-se usar o aplicativo Cloudflare para hospedar o Pingvin Share para melhorar o desempenho. A maneira mais fácil de fazer isso é usar o aplicativo ‘Cloudflare Tunnel’ da loja de aplicativos Umbrel.

