description: >-
  ⚠️ Este aplicativo consome muita RAM e pode levar 5 minutos para iniciar após a instalação.


  OneDev é uma plataforma Git e DevOps que combina hospedagem de repositório, pipelines de CI/CD, quadros Kanban e gerenciamento de pacotes em um espaço de trabalho limpo. Ele ajuda você a gerenciar código, automatizar compilações, rastrear tarefas e enviar projetos a partir de uma única interface.


  Ele reúne as principais ferramentas para o desenvolvimento de software moderno em um espaço de trabalho limpo, incluindo:
   
    🔍 Controle de versão: Fornece suporte Git integrado, permitindo o gerenciamento de código diretamente na plataforma.
    📦 CI/CD (Integração Contínua/Entrega Contínua): OneDev permite criar pipelines de construção e implantação para testar e entregar alterações de código continuamente.
    🐞 Rastreamento de problemas: Oferece um sistema de gerenciamento de tarefas para organizar projetos e acompanhar o andamento.
    👩‍💻 Revisão de código: os desenvolvedores podem realizar revisões de código diretamente na plataforma para garantir a qualidade.
    📝 Quadros Kanban: OneDev inclui quadros flexíveis para ajudar a gerir tarefas e fluxos de trabalho.
    🔗 Integração de terceiros: Suporta a integração de serviços e ferramentas externas.

  A ferramenta é especialmente atraente para equipes que preferem uma solução DevOps completa em um sistema único e auto-hospedado, sem depender de serviços externos em nuvem.
