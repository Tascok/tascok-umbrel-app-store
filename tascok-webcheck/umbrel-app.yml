releaseNotes: >-
  This is the stable version of WebCheck, developed as a React application. The backend consists of a series of lambda functions and can be deployed to Vercel, Netlify, or any Docker-compatible service. For self-hosting, the Docker container includes a Node server to expose all endpoints locally and to serve the frontend.


  This version is optimized for self-hosting.

