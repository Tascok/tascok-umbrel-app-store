port: 3347
description: >-
  BitPlay é um aplicativo da web de código aberto desenvolvido pela Aculix Technologies que permite aos usuários transmitir conteúdo de vídeo diretamente de arquivos torrent ou links magnéticos sem a necessidade de baixar o arquivo inteiro primeiro. Ele foi projetado para fornecer uma experiência de streaming contínua baseada em navegador usando uma interface limpa e intuitiva. Desenvolvido com Go, o BitPlay gerencia sessões de torrent em segundo plano e reproduz vídeos por meio de um player HTML5 integrado. O aplicativo detecta e converte automaticamente legendas do formato SRT para VTT, tornando-as compatíveis com a maioria dos navegadores modernos.


  Um dos recursos de destaque do BitPlay é o suporte para proxies SOCKS5, permitindo aos usuários rotear todo o tráfego de torrent, incluindo busca de metadados e conexões de pares, por meio de um proxy seguro. Isso ajuda a preservar a privacidade e evitar possíveis restrições de rede. Além disso, o BitPlay se integra a ferramentas como Prowlarr e Jackett, permitindo aos usuários pesquisar torrents diretamente no aplicativo, agilizando ainda mais o processo de descoberta de conteúdo.


  Ele também oferece recursos de gerenciamento de sessão, como limpeza automática de torrents inativos para economizar recursos do sistema.
