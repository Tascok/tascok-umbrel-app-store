name: Mafl
tagline: Um serviço intuitivo para organizar sua página inicial
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-mafl/logo.png
category: files & productivity
version: "0.15.4"
port: 3069
description: >-
  Mafl é uma plataforma de código aberto projetada para facilitar a criação e gerenciamento de homepages personalizadas. Ele permite que os usuários consolidem seus links e serviços online favoritos em um local conveniente, melhorando sua experiência de navegação na web.


  Principais recursos:


  ✨ Personalização: o Mafl permite aos usuários personalizar suas páginas iniciais com diversos temas, tags e opções de agrupamento, facilitando a organização dos serviços com base nas preferências individuais.


  📈 Atualizações em Tempo Real: A plataforma conta com cartões interativos que fornecem informações em tempo real sobre os serviços vinculados na página inicial, aumentando o engajamento do usuário.


  🌍 Suporte multilíngue: Mafl atende a um público global, oferecendo suporte a vários idiomas, garantindo acessibilidade para quem não fala inglês.


  🔧 Configuração fácil: os usuários podem começar a usar o Mafl rapidamente por meio de um arquivo de configuração YAML simples, estejam eles usando o Docker ou configurando-o localmente.


  🚀 Desempenho e Acessibilidade: A ferramenta é otimizada para velocidade, garantindo acesso rápido aos serviços. Além disso, como um Progressive Web App (PWA), ele pode ser instalado em dispositivos para uma experiência semelhante a um aplicativo.


  No geral, o Mafl é uma solução robusta para quem deseja agilizar suas atividades online e manter sua vida digital organizada.


  ⚠️ No Mafl, as configurações de serviços, ícones, idiomas e muito mais são centralizadas em um único arquivo "config.yml". Os usuários devem transferir este arquivo para a pasta App em sua configuração Umbrel usando o terminal, tornando-a uma operação adequada para usuários avançados que estão familiarizados com interfaces de linha de comando.


  As opções de configuração no arquivo “config.yml” permitem aos usuários personalizar vários aspectos do Mafl, incluindo a adição de serviços, a seleção de ícones e preferências de idioma. Instruções detalhadas e exemplos para configurar este arquivo podem ser encontrados na página oficial da documentação do Mafl: https://mafl.hywax.space/reference/configuration.html.

