releaseNotes: >-
  This update introduces several improvements, including live updates on the imports page, better fitness tracking displays, and the ability to hide collections. 


  Show cards now indicate the next or in-progress episode, and integrations automatically disable after repeated errors. 


  Additionally, several bugs have been fixed, including incorrect media counts on person details pages and a long-standing issue in workout logging.
