id: tascok-spacedrive
name: Spacedrive
tagline: Um gerenciador de arquivos do futuro
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-spacedrive/logo.png
category: files & productivity
version: "0.4.2"
port: 8199
description: >-
  Spacedrive é uma solução inovadora de gerenciamento de arquivos que unifica o acesso a arquivos em dispositivos, serviços em nuvem e armazenamento local em uma interface integrada. Ideal para usuários que gerenciam extensas coleções de mídia e dados, o Spacedrive fornece uma plataforma centralizada para organizar, acessar e pesquisar conteúdo de forma eficiente. Por ser uma ferramenta de código aberto, ela prioriza o controle, a privacidade e a personalização do usuário, com opções flexíveis de implantação para uso local ou auto-hospedado. Seu design simplificado, recursos de pesquisa poderosos e configuração adaptável fazem dele um recurso valioso para profissionais e criadores digitais que buscam uma abordagem coesa e eficiente para gerenciamento de arquivos em diversas fontes de dados.


  ⚠️ O Spacedrive está atualmente em fase Alpha, permitindo que os primeiros usuários explorem seus recursos enquanto a plataforma continua a evoluir. Para um desempenho ideal com seu contêiner Docker, é melhor rodar em Linux (linux/amd64), pois o contêiner ainda não está otimizado para outras plataformas. Além disso, o Spacedrive não funciona atualmente em Raspberry Pi (ARM) devido a limitações de compatibilidade. Para a melhor experiência, é altamente recomendável usar o Spacedrive em uma configuração Umbrel Home ou em uma máquina virtual (VM).
