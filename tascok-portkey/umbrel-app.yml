releaseNotes: >-
  In version 1.2.0, released on October 9, 2024, Prometheus metrics were added, enhancing monitoring capabilities. Additionally, dependencies were updated, including the go-release-action from version 1.51 to 1.52 and htmx.org from version 2.0.2 to 2.0.3. Lastly, a change was made to ensure that the Fly machine does not stop.
