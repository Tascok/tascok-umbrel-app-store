name: Palmr
tagline: Uma alternativa privada ao WeTransfer
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-palmr/logo.png
category: files & productivity
version: "3.0.0-beta.11"
port: 5487
description: >-
  🌴 Palmr é uma plataforma de compartilhamento de arquivos de código aberto que oferece controle total sobre seus uploads e downloads. Ele foi projetado para transferências seguras e privadas sem depender de serviços de terceiros.


  Com uma interface limpa e moderna, o Palmr facilita o envio e o recebimento de arquivos de qualquer tamanho, limitado apenas pelo armazenamento disponível. O aplicativo é leve, rápido e fácil de usar, desenvolvido com tecnologias como Fastify, Next.js e SQLite para desempenho ideal.


  Ele oferece suporte a recursos como proteção por senha, autenticação de usuário, marca personalizável e login único opcional por meio do OpenID Connect. Palmr é ideal para quem deseja uma ferramenta de compartilhamento de arquivos simples, mas poderosa, que rode diretamente em seu servidor Umbrel.
