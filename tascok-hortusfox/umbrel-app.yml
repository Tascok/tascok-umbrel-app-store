manifestVersion: 1
id: tascok-hortusfox
name: HortusFox
tagline: Um aplicativo colaborativo de rastreamento e gerenciamento de plantas
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-hortusfox/logo.png
category: files & productivity
version: "5.1"
port: 8838
description: >-
  🌿 HortusFox é um aplicativo da web auto-hospedado desenvolvido para amantes de plantas que desejam gerenciar suas plantas domésticas e jardins de forma estruturada e que respeite a privacidade. É totalmente gratuito e de código aberto, permitindo aos usuários personalizar e ampliar o software para atender às suas necessidades pessoais. Esteja você cuidando de alguns vasos de plantas no parapeito da janela ou administrando um grande jardim, o HortusFox oferece um espaço digital para rastrear, organizar e planejar todos os aspectos do cuidado das plantas.


  Basicamente, o HortusFox permite catalogar suas plantas com informações detalhadas, como nomes de espécies, notas, atributos personalizados e imagens. As plantas podem ser agrupadas por localização, facilitando o gerenciamento de diferentes ambientes ou espaços externos. O sistema suporta tarefas recorrentes e lembretes para atividades como regar, fertilizar ou replantar, ajudando você a manter uma rotina de cuidados consistente.


  HortusFox vai além do rastreamento de plantas, oferecendo ferramentas para gerenciar itens relacionados, como vasos, fertilizantes e ferramentas. Este recurso de inventário ajuda a manter seus materiais de jardinagem organizados e contabilizados. Para jardineiros ao ar livre, a integração de dados meteorológicos apoia uma melhor tomada de decisões, alinhando os cronogramas de cuidados com as condições atuais.


  O aplicativo é colaborativo por design. Se vários usuários estiverem gerenciando a mesma coleção de plantas, uma função integrada de bate-papo em grupo permite que eles se comuniquem e coordenem tarefas. HortusFox também inclui um recurso integrado de reconhecimento de plantas para ajudar na identificação de espécies desconhecidas.


  A interface é responsiva e funciona em vários dispositivos, garantindo que as informações da planta e o gerenciamento de tarefas sejam facilmente acessíveis, esteja você no computador ou no jardim com o telefone. Os usuários também podem personalizar sua experiência selecionando vários temas que correspondam às suas preferências estéticas.


  HortusFox é ideal para indivíduos e famílias que gostam de cuidar de plantas e desejam uma forma moderna, segura e personalizável de apoiar suas rotinas de jardinagem. Com o seu design inteligente e rico conjunto de funcionalidades, transforma a forma como as pessoas interagem com os seus espaços verdes.
