description: >-
  📮 Stalwart é um servidor moderno de correio e colaboração de código aberto projetado para agilizar e modernizar a infraestrutura de e-mail tradicional. Construído desde o início com desempenho, escalabilidade e segurança em mente, ele combina uma ampla gama de funcionalidades em uma única plataforma eficiente. Stalwart oferece suporte a protocolos legados e modernos, tornando-o compatível com uma ampla gama de clientes e serviços. Ele permite comunicação contínua por meio de protocolos como IMAP, SMTP e POP3, ao mesmo tempo que oferece suporte a padrões de próxima geração como JMAP, CalDAV e CardDAV.


  Um dos principais objetivos do Stalwart é fornecer uma solução completa e auto-hospedada para comunicação e colaboração. Além de e-mail, inclui suporte integrado para calendários, contatos e armazenamento de arquivos. Todos esses recursos são baseados em padrões abertos, permitindo a interoperabilidade com outras ferramentas e plataformas. Isto elimina a necessidade de vários sistemas separados e simplifica a administração e a manutenção.


  A segurança é um princípio fundamental da Stalwart. Ele oferece proteção abrangente por meio de recursos como criptografia ponta a ponta, forte segurança da camada de transporte e mecanismos de autenticação robustos. Sua arquitetura foi projetada para prevenir vetores de ataque comuns e garantir a privacidade dos dados, tanto em trânsito quanto em repouso.


  Stalwart é escrito em Rust, uma linguagem de programação de sistemas conhecida por sua segurança e desempenho. Esta escolha permite alcançar alta eficiência, mantendo um baixo consumo de memória e forte estabilidade. Seja implantado em uma única máquina ou dimensionado em uma infraestrutura distribuída, o Stalwart pode lidar com cargas de trabalho exigentes com facilidade.


  O projeto é desenvolvido e mantido pela Stalwart Labs, empresa com sede no Reino Unido e nos Estados Unidos. Desde a sua fundação em 2019, a equipe tem se concentrado na criação de um servidor de e-mail de próxima geração que não seja apenas poderoso e seguro, mas também fácil de implantar e gerenciar. Com sua base de código aberto e design modular, o Stalwart é a escolha ideal para indivíduos, pequenas equipes e empresas que buscam recuperar o controle sobre suas comunicações sem sacrificar recursos modernos ou usabilidade.


  ⚙️ A instalação e configuração estão descritas aqui:


  https://github.com/dennysubke/dennys-umbrel-app-store/blob/master/tascok-stalwart/README.md
