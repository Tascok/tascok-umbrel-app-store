version: "0.6.2"
port: 8732
description: >-
  🦫 BeaverHabits é um aplicativo de rastreamento de hábitos projetado para apoiar a consistência e a atenção plena nas rotinas diárias. Em vez de levar os usuários a metas fixas ou métricas de produtividade, incentiva uma abordagem suave e baseada na repetição para a formação de hábitos. O aplicativo gira em torno da ideia de que mudanças de longo prazo surgem todos os dias, mesmo que o progresso seja gradual. Ele permite que os usuários monitorem uma ampla gama de hábitos – sejam tarefas diárias simples, atividades de bem-estar ou práticas criativas e fornece uma visão geral clara do que foi concluído e do que ainda precisa de atenção.


  Os usuários podem definir horários personalizados para cada hábito, como dias específicos da semana ou intervalos como a cada três dias. Essa flexibilidade facilita a adaptação da experiência aos ritmos e preferências individuais. A interface é limpa, focada e livre de distrações, enfatizando o ato real de rastreamento, em vez de sobrecarregar os usuários com estatísticas ou gamificação. Com o tempo, os usuários podem detectar padrões, manter sequências e desenvolver uma consciência mais profunda de seu comportamento.


  BeaverHabits é ideal para quem busca construir estrutura, manter o equilíbrio ou trazer mais intenção para sua vida diária. Esteja você tentando beber mais água, meditar regularmente ou simplesmente lembrar de se alongar, esta é uma maneira simples e eficaz de se manter no caminho certo.
