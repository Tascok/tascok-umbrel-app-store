name: portkey
tagline: Um hub de inicialização envolvente para links favoritos e páginas personalizadas
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-portkey/logo.png
category: files & productivity
version: "1.2.0"
port: 3343
description: >-
  Portkey é um portal web leve projetado para servir como uma página inicial personalizada, oferecendo aos usuários uma maneira conveniente de acessar uma coleção selecionada de links e URLs. Com sua interface amigável, o Portkey permite uma navegação rápida nos sites favoritos, tornando-o uma solução ideal para indivíduos e equipes que buscam agilizar sua experiência online.


  Principais recursos:


  🔗✨ Links personalizáveis: adicione e organize facilmente links para os sites visitados com mais frequência, garantindo que todos os seus recursos essenciais estejam a apenas um clique de distância.


  📄✨ Páginas Personalizadas: Além dos links, os usuários podem criar pequenas páginas personalizadas de acordo com suas necessidades. Este recurso permite notas pessoais, lembretes ou qualquer outra informação relevante que os usuários desejam manter à mão.


  🗄️🛠️ Arquivo de configuração único: todas as definições e configurações são gerenciadas por meio de um arquivo de configuração único e fácil de editar. Isso simplifica o processo de configuração e facilita aos usuários a personalização de seu portal sem a necessidade de amplo conhecimento técnico.


  📊📈 Métricas Prometheus: Com a introdução das métricas Prometheus, os usuários podem monitorar o desempenho e o uso de seu portal, obtendo insights sobre sua operação e garantindo um desempenho ideal.


  🔄✨ Atualizações regulares: O projeto segue o versionamento semântico e é atualizado regularmente com melhorias, patches de segurança e novos recursos, garantindo uma experiência de usuário robusta e confiável.


  Portkey é perfeito para quem deseja otimizar sua experiência de navegação na web, seja para uso pessoal, fins educacionais ou colaboração em equipe. Pode servir como um centro centralizado de recursos, tornando-o especialmente benéfico para profissionais que dependem de múltiplas ferramentas e plataformas online.


  ⚠️No Portkey, as configurações de serviços, ícones, idiomas e outras opções são centralizadas em um único arquivo "config.yml". Os usuários precisam transferir esse arquivo para a pasta App dentro da configuração do Umbrel usando o terminal, que é mais adequado para usuários avançados que se sentem confortáveis ​​com operações de linha de comando.

   O arquivo “config.yml” permite aos usuários personalizar vários aspectos da chave de portal, incluindo adicionar serviços, selecionar ícones e ajustar preferências de idioma. Para obter instruções detalhadas e exemplos sobre como configurar este arquivo de forma eficaz, você pode consultar a documentação oficial da chave de portal: https://github.com/kodehat/portkey.
