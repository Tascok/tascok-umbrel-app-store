releaseNotes: >-
  This release updates Coolify to version 4.1.2 and improves deployment security, authentication, permission validation, and configuration checks. It also fixes issues with private Git submodules, SSH deploy keys, preview deployments, environment variables, and container image tags. 


  Additional stability and reliability improvements have been added across the deployment workflow.
