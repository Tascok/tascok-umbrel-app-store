version: "0.6.0"
port: 13000
description: >-
  ConvertX é um conversor de arquivos online auto-hospedado rodando em seu servidor Umbrel, suportando a conversão de arquivos em mais de mil formatos diferentes. 


  O aplicativo permite processar vários arquivos simultaneamente, oferece proteção por senha e oferece suporte a várias contas de usuário.

  Com o ConvertX, você tem controle total sobre as conversões de seus arquivos, enquanto aproveita a flexibilidade de uma poderosa ferramenta de conversão diretamente em seu servidor Umbrel.


  Aqui está uma visão geral de alguns formatos suportados para conversão:


  🖼️Imagens: Converte de 211 formatos para 156 formatos.


  📺Vídeo (FFmpeg): Converte de 473 formatos para 280 formatos.


  📄Documentos: Converte de 43 formatos para 65 formatos.


  📦Ativos 3D: Converte de 70 formatos para 24 formatos.


  📐SVG: Converte de 1 formato para 1 formato.


  📊JPEG XL: Converte de 11 formatos para 11 formatos.


  📑LaTeX: Converte de 1 formato para 1 formato.


