id: tascok-addy
name: AnonAddy
tagline: Uma caixa de entrada secreta para as necessidades do seu agente secreto
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-addy/logo.png
category: networking
version: "1.3.5"
port: 8727
description: >-
  🕶️ AnonAddy é um serviço de encaminhamento de e-mail de código aberto que permite aos usuários proteger sua privacidade criando aliases de e-mail anônimos. Ajuda os usuários a gerenciar sua presença online, evitando spam, violações de dados e rastreamento indesejado. Em vez de usar um endereço de e-mail pessoal, os usuários podem gerar aliases exclusivos para diferentes sites e serviços. Os e-mails enviados para esses aliases são encaminhados automaticamente para a caixa de entrada real do usuário, sem revelar seu endereço de e-mail real.


  A plataforma oferece vários recursos, incluindo criptografia PGP para encaminhamento seguro de e-mail, capacidade de responder mensagens anonimamente e suporte para domínios personalizados. Os usuários também podem desativar ou excluir aliases a qualquer momento para evitar futuras comunicações. Isso torna o AnonAddy uma ferramenta poderosa para manter a privacidade e a segurança durante a interação online.


  O serviço opera em um modelo baseado em assinatura com um nível gratuito que inclui aliases limitados, enquanto os planos premium oferecem recursos adicionais como aliases ilimitados, domínios personalizados e maior largura de banda. Opções de auto-hospedagem também estão disponíveis, permitindo que os usuários executem sua própria instância do AnonAddy para controle total sobre o encaminhamento de e-mail.


  ⚠️ Nota: Recomenda-se configurar um domínio personalizado para envio de emails. Além disso, os registros SPF e DKIM TXT devem ser configurados corretamente nas configurações de DNS. Sem esses ajustes, poderão ocorrer problemas na entrega de e-mails, principalmente no Gmail.


  📖 Para mais detalhes sobre configuração, veja: 'https://github.com/anonaddy/docker'
