description: >-
  👾 RomM é um gerenciador de ROM lindamente projetado, poderoso e auto-hospedado que oferece uma solução abrangente para jogadores que desejam organizar, gerenciar e desfrutar de suas coleções de jogos. Com suporte para múltiplas plataformas e convenções de nomenclatura, RomM garante que sua biblioteca ROM esteja organizada e acessível, ao mesmo tempo que adiciona automaticamente metadados e capas para enriquecer a experiência. A plataforma integra perfeitamente um emulador para jogabilidade instantânea, oferecendo uma experiência tranquila e descomplicada, tudo no conforto do seu servidor privado.


  Construído com privacidade e segurança em mente, o RomM permite manter controle total sobre seus dados, eliminando a necessidade de serviços de terceiros. Como um projeto de código aberto e voltado para a comunidade, o RomM está em constante evolução, com atualizações regulares e novos recursos impulsionados pelo feedback de usuários apaixonados. Os planos futuros incluem recursos como sincronização de dispositivos, permitindo que você acesse e jogue seus jogos em vários dispositivos sem esforço. Quer você seja um jogador casual ou um entusiasta retrô, o RomM oferece a ferramenta definitiva para gerenciar sua coleção de ROMs, garantindo uma experiência simplificada, personalizada e segura.


  ⚠️ Para permitir que o RomM busque dados, capas e metadados de jogos de fontes externas, você precisa adicionar manualmente chaves de API ao arquivo 'docker-compose.yml'. Gere as chaves necessárias de IGDB, MobyGames e SteamGridDB e insira-as como variáveis ​​de ambiente no serviço RomM. Após salvar o arquivo, reinicie o aplicativo para aplicar as alterações.


  🔧 Para mais detalhes de configuração, visite o repositório oficial do RomM GitHub: https://github.com/rommapp/romm
