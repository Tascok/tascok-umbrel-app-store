description: >-
  PrivateBin é um serviço pastebin de código aberto, minimalista e criptografado. Ele permite que os usuários compartilhem textos ou trechos de código de forma segura, com criptografia de ponta a ponta, garantindo que apenas o destinatário pretendido possa ler o conteúdo. O servidor que hospeda o PrivateBin não pode descriptografar ou acessar os dados compartilhados, proporcionando um alto nível de privacidade.


  Aqui estão alguns recursos principais do PrivateBin:


  🔒 Criptografia ponta a ponta: todos os dados são criptografados no navegador antes de serem enviados ao servidor. O servidor nunca vê o conteúdo não criptografado.


  🔥 Expiração e gravação após leitura: os usuários podem definir prazos de validade para suas pastas ou optar por uma opção de “gravação após leitura”, onde o conteúdo se autodestrói após uma única visualização.


  👤 Sem contas de usuário: PrivateBin não requer registro ou autenticação de usuário, o que o torna ideal para compartilhamento anônimo de informações confidenciais.


  🛡️ Proteção por senha: os usuários podem adicionar uma camada extra de segurança definindo uma senha para colar.


  📜 Destaque de sintaxe: PrivateBin suporta realce de sintaxe para linguagens de programação, tornando-o útil para compartilhar trechos de código.


  🏠 Auto-hospedado: Como solução auto-hospedada, o PrivateBin oferece controle total sobre onde os dados são armazenados e a capacidade de integrá-los a vários ambientes de servidor.


  🚫 Sem metadados: Ao contrário de alguns outros serviços pastebin, o PrivateBin não armazena endereços IP ou quaisquer metadados identificáveis ​​sobre usuários ou pastas.


  É popular em comunidades preocupadas com a privacidade por compartilhar trechos com segurança, sem deixar rastros.


  ⚠️ Para usar o PrivateBin conforme pretendido, pode ser necessário expô-lo à Internet pública. A maneira mais fácil de fazer isso é baixar o aplicativo “Cloudflare Tunnel” da umbrel app store e expor o PrivateBin (em execução na porta 3070) usando seu próprio domínio.

