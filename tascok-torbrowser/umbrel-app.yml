id: tascok-torbrowser
name: Tor Browser
tagline: Um escudo invisível para sua experiência de navegação
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-torbrowser/logo.png
category: networking
version: "15.0.1"
port: 5832
description: >-
  🧅 Tor Browser é uma ferramenta poderosa projetada para fornecer acesso anônimo, seguro e privado à Internet. Construído no Mozilla Firefox e otimizado para privacidade, o Tor Browser usa a rede Tor (The Onion Router) para proteger as identidades e localizações dos usuários, criptografando e retransmitindo o tráfego da Internet através de vários nós em todo o mundo. Esse processo, conhecido como “roteamento cebola”, oculta os endereços IP dos usuários, tornando extremamente difícil para sites, anunciantes ou entidades de vigilância rastrear atividades de navegação ou identificar locais.


  Para aqueles que valorizam a privacidade ou enfrentam ambientes restritivos da Internet, o Tor Browser oferece recursos importantes de privacidade. Ele bloqueia cookies, rastreadores e tecnologias de impressão digital que normalmente monitoram os usuários em sites e limpa o histórico de navegação e os cookies automaticamente a cada sessão. Isso garante um alto grau de anonimato e protege contra a coleta de dados de uma forma que os navegadores padrão não conseguem.


  Além de maior privacidade, o Tor Browser permite acesso irrestrito à web aberta, permitindo aos usuários contornar a censura local e acessar conteúdo que de outra forma poderia ser bloqueado em determinadas regiões ou redes. Embora algumas compensações incluam velocidades de navegação um pouco mais lentas devido ao roteamento de vários nós, o Tor Browser é uma das ferramentas mais eficazes para acesso seguro e sem censura à Internet. Ele permite que os usuários explorem a Internet com liberdade e confiança, proporcionando uma experiência online mais segura e privada.
