id: tascok-kiwix
name: Kiwix
tagline: Um oceano de conhecimento, pronto para mergulhar off-line
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-kiwix/logo.png
category: files & productivity
version: "3.7.0"
port: 8889
description: >-
  🌐 Kiwix é uma plataforma inovadora de código aberto que revoluciona o acesso à informação digital, disponibilizando-a offline. Projetado para áreas com conectividade limitada ou inexistente à Internet, o Kiwix permite aos usuários baixar sites inteiros ou coleções de conteúdo digital e acessá-los sem a necessidade de uma conexão ativa com a Internet. O seu principal objetivo é colmatar a exclusão digital, garantindo que o conhecimento e a informação sejam acessíveis a todos, independentemente da localização ou das circunstâncias.


  No cerne do Kiwix está sua capacidade de compactar e armazenar grandes quantidades de informações em um formato chamado ZIM. Isso permite que os usuários carreguem extensas bibliotecas, como Wikipedia, Project Gutenberg, TED Talks ou recursos educacionais, em seus dispositivos, mesmo com espaço de armazenamento mínimo. Quer você seja um professor em um vilarejo remoto, um estudante em busca de conhecimento ou um viajante em busca de recursos em trânsito, o Kiwix oferece uma maneira perfeita de acessar informações críticas off-line.


  Kiwix é versátil e fácil de usar, suportando uma ampla variedade de dispositivos e sistemas operacionais, incluindo desktops, laptops, tablets e smartphones. Ele também funciona com eficiência em configurações leves como Raspberry Pi, tornando-o perfeito para escolas, bibliotecas e centros comunitários em áreas desfavorecidas. A plataforma possui um sistema de busca intuitivo, permitindo aos usuários navegar em vastas bibliotecas de conteúdo offline de forma rápida e eficiente.


  Kiwix tornou-se uma ferramenta inestimável para organizações humanitárias, iniciativas educacionais e viajantes que necessitam de acesso confiável à informação sem incorrer em custos de dados ou enfrentar desafios de conectividade. Ao democratizar o acesso ao conhecimento, a Kiwix capacita indivíduos e comunidades a aprender, crescer e prosperar, independentemente das circunstâncias. É mais do que apenas uma ferramenta – é um catalisador de mudança, garantindo que o poder da Internet chega a todos, em qualquer lugar.


  ⚙️ Para configurar arquivos ZIM para o aplicativo Kiwix em seu servidor Umbrel, primeiro você precisa baixar um ou mais arquivos adequados da Biblioteca Kiwix em https://library.kiwix.org. Escolha os arquivos desejados, como diferentes versões da Wikipédia. Após o download, mova os arquivos para a pasta /data/zim/, que está localizada no diretório do seu aplicativo Kiwix no seu servidor Umbrel. 

  No docker-compose.yml, você pode especificar vários arquivos ZIM listando seus nomes na linha de configuração apropriada. 


  Para aplicar as alterações, é importante reiniciar o aplicativo Kiwix. Certifique-se de que todos os nomes de arquivos especificados no arquivo de configuração correspondam aos nomes reais dos arquivos ZIM na pasta. Isso permite que você acesse facilmente vários bancos de dados offline e use-os no Kiwix.
