manifestVersion: 1
id: tascok-luanti
name: Luanti
tagline: Um playground ilimitado para construtores, aventureiros e criadores
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-luanti/logo.png
category: gaming
version: "5.11.0"
port: 30000
description: >-
  🌍 Luanti é um motor de jogo voxel de código aberto que oferece um mundo vasto e envolvente cheio de possibilidades infinitas. Quer você queira explorar, construir, sobreviver ou criar, Luanti lhe dá a liberdade de jogar do seu jeito. Com mapas enormes que se estendem por 62.000 blocos em todas as direções, o mundo parece verdadeiramente ilimitado, convidando você a cavar fundo na terra ou construir estruturas altíssimas sem ficar sem espaço. O mecanismo suporta aventuras para um jogador e experiências multijogador, permitindo que você jogue localmente com amigos ou entre em servidores online cheios de outros jogadores.


  O estilo visual de Luanti é totalmente personalizável por meio de pacotes de textura, garantindo que você possa moldar a aparência do mundo de acordo com suas preferências. Ele também apresenta uma seleção impressionante de geradores de mapas integrados, criando diversas e belas paisagens para você explorar – e se isso não for suficiente, você pode instalar outros por meio de mods.


  Para quem quer ir além do jogo, a API baseada em Lua do Luanti permite que você crie seus próprios jogos, dando vida a novas mecânicas, itens e mundos sem se preocupar com redes ou renderizações complexas. Modding é igualmente acessível, permitindo ajustar jogos existentes ou criar experiências totalmente novas do zero. A plataforma ContentDB hospeda uma enorme biblioteca de mods feitos pela comunidade, prontos para download, uso ou adaptação para seus próprios projetos.


  A comunidade Luanti é acolhedora e solidária, ajudando jogadores e desenvolvedores a tirar o máximo proveito do motor. Como um projeto de código aberto, o Luanti evolui de forma transparente, com novos recursos e melhorias impulsionadas por colaboradores de todo o mundo. Esteja você aqui para jogar, modificar ou criar, Luanti permite que você torne o mundo voxel seu.


  ⚠️ Luanti é um aplicativo do lado do servidor sem interface de usuário (UI), projetado para executar servidores Minetest. Ele roda na porta 30000/UDP. Os mapas mundiais, a pasta mods e os arquivos de configuração podem ser encontrados em /data/minetest_conf. Para garantir uma experiência tranquila, tanto o cliente quanto o servidor devem estar executando a mesma versão do Minetest. Este servidor fornece um ambiente estável para hospedar mundos Minetest, sem a necessidade de interfaces gráficas adicionais.
