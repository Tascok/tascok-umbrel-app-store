id: tascok-nomie
name: Nomie
tagline: Um aplicativo de registro no diário com foco na privacidade para monitorar a vida de acordo com seus termos
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-nomie/logo.png
category: social
version: "6.3.0"
port: 8737
description: >-
  🐘 Nomie é um aplicativo de registro no diário com foco na privacidade, projetado para rastreamento diário sem esforço. Construído com a simplicidade em mente, permite aos usuários registrar atividades, humores, hábitos e experiências pessoais com um único toque. Ao contrário de muitos outros aplicativos de rastreamento, o Nomie garante a propriedade completa dos dados, armazenando tudo localmente ou permitindo que os usuários hospedem seus dados por conta própria. Não há contas, anúncios e análises de terceiros, o que o torna uma solução verdadeiramente privada para registro em diário pessoal.


  A flexibilidade do aplicativo o torna adequado para uma ampla variedade de casos de uso, quer alguém queira monitorar sua saúde mental, monitorar a produtividade ou simplesmente manter um registro da vida diária. Rastreadores personalizáveis ​​permitem que os usuários adaptem a experiência às suas necessidades específicas, e a natureza de código aberto do projeto permite melhorias contínuas impulsionadas pela comunidade. Ao priorizar a privacidade e a facilidade de uso, o Nomie oferece uma maneira perfeita de documentar a vida sem se preocupar com a segurança dos dados ou monitoramento intrusivo.
