version: "10.2.3"
port: 8020
description: >-
  Super Productivity é um aplicativo de produtividade abrangente e de código aberto, feito sob medida para ajudar indivíduos e equipes a organizar seu trabalho com facilidade. Ideal para desenvolvedores, gerentes de projeto, freelancers e qualquer pessoa que busque uma abordagem simplificada para gerenciamento de tarefas e tempo, esta ferramenta combina recursos essenciais em uma plataforma intuitiva.


  Com Super Produtividade, os usuários podem criar listas de tarefas detalhadas, gerenciar tarefas dentro de projetos e acompanhar o progresso com eficiência. Você pode priorizar tarefas facilmente, definir prazos e monitorar sua produtividade com recursos integrados de controle de tempo. Esteja você trabalhando em um único projeto ou realizando malabarismos com várias tarefas, este aplicativo permite que você se mantenha organizado e em dia com seu trabalho.


  Os principais recursos incluem:


  📅 Gerenciamento de tarefas e projetos: crie, organize e priorize tarefas. Agrupe-os em projetos, atribua datas de vencimento e monitore o status de conclusão.


  🕒 Controle de tempo: registre horas de trabalho diretamente no aplicativo para obter informações sobre como seu tempo é gasto. Você também pode monitorar sua produtividade com o cronômetro Pomodoro ou entradas manuais de tempo.


  🔗 O Super Productivity se integra a ferramentas populares como Jira, GitHub e GitLab, para que você possa importar tarefas e gerenciá-las sem sair do seu fluxo de trabalho.


  📊 Relatórios e análises: gere relatórios de tempo para analisar quanto tempo você gastou em tarefas e projetos, ajudando você a tomar decisões baseadas em dados sobre seus hábitos de trabalho.


  📴 Modo Offline: O aplicativo funciona offline, o que significa que você pode continuar gerenciando suas tarefas e monitorando o tempo mesmo sem conexão com a internet.


  🛡️ Privacidade e segurança de dados: como um aplicativo de código aberto, o Super Productivity garante que seus dados permaneçam privados e armazenados localmente, fornecendo uma solução segura e personalizável para suas necessidades de produtividade.


  A Super Produtividade foi projetada para quem deseja aumentar sua produtividade enquanto mantém o controle sobre seus dados. É perfeito para indivíduos que preferem uma ferramenta simples, mas poderosa, e equipes que precisam de gerenciamento contínuo de tarefas e projetos, sem depender de software complexo. Disponível para Windows, macOS, Linux e como aplicativo web, Super Productivity é uma ferramenta versátil que se adapta ao seu fluxo de trabalho, esteja você trabalhando sozinho ou colaborando com outras pessoas.

