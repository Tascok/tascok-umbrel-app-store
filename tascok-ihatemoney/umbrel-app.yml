description: >-
  I Hate Money é um aplicativo web de código aberto desenvolvido para simplificar o gerenciamento de despesas compartilhadas. É comumente usado para atividades em grupo onde várias pessoas estão envolvidas nos custos, como viagens, eventos ou arranjos de vida comunitária.


  Principais recursos:


  💰 Fácil gerenciamento de despesas: os usuários podem adicionar despesas e indicar quem as pagou, ajudando a controlar dívidas e créditos.


  👪 Gerenciamento de Grupos: O aplicativo permite aos usuários criar diferentes grupos para gerenciar despesas de diversas ocasiões ou projetos.


  🧮 Cálculo da dívida: I Hate Money calcula automaticamente quanto cada participante deve aos outros, agilizando o processo de liquidação.


  ✨ Interface amigável: A interface foi projetada para ser intuitiva, tornando-a acessível mesmo para aqueles que não entendem de tecnologia.


  🌐 Código aberto: como um aplicativo de código aberto, os desenvolvedores podem personalizar e estender seus recursos para atender a necessidades específicas.


  I Hate Money é ideal para usuários que desejam gerenciar custos compartilhados sem perder o controle de suas interações financeiras.

