manifestVersion: 1
id: tascok-ente-photos
category: files & productivity
name: Ente Photos
tagline: Uma plataforma criptografada de ponta a ponta para armazenamento e compartilhamento de fotos
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-ente-photos/logo.png
version: "1.0.10"
port: 33000
description: >-
  🐥 Ente Photos é um serviço em nuvem com foco na privacidade, projetado para armazenar e gerenciar fotos e vídeos com segurança. Ao contrário das plataformas convencionais como Google Fotos ou iCloud, o Ente prioriza a privacidade do usuário por meio de criptografia ponta a ponta, garantindo que apenas o usuário tenha acesso aos seus dados. Mesmo o próprio Ente não pode visualizar ou analisar o conteúdo, impedindo a mineração de dados e a publicidade direcionada, ao mesmo tempo que protege informações pessoais confidenciais.


  O Ente Photos é de código aberto, permitindo transparência na sua implementação e possibilitando análises de segurança independentes. O serviço pode ser acessado em várias plataformas, incluindo Android, iOS, Windows, macOS, Linux e web. Ele armazena dados criptografados de forma redundante em três data centers separados, adicionando uma camada extra de segurança e disponibilidade de dados.


  Os usuários podem fazer backup automático de fotos e vídeos de seus dispositivos e organizá-los em álbuns. O aplicativo também oferece ferramentas básicas de edição para cortar, girar e ajustar cores. Embora o Ente não use IA para análise de imagens, ele inclui um recurso de reconhecimento facial local para organizar o conteúdo sem comprometer a privacidade.


  A migração de outros serviços em nuvem é suportada por meio de importações manuais de dados, permitindo que os usuários façam a transição de plataformas como o Google Fotos sem perder mídia. Ente Photos oferece uma alternativa robusta para usuários que buscam uma plataforma segura e voltada para a privacidade para gerenciar suas memórias digitais sem sacrificar a funcionalidade ou a facilidade de uso.


  ⚠️ Siga as etapas de configuração após instalá-lo:


  https://github.com/dennysubke/dennys-umbrel-app-store/blob/master/tascok-ente-photos/README.md
