manifestVersion: 1
id: tascok-actualbudget
name: Actual Budget
tagline: Um aplicativo super rápido com foco na privacidade para gerenciar suas finanças
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-actualbudget/logo.png
category: finance
version: "26.7.0"
port: 5006
description: >-
  Actual Budget é uma ferramenta de finanças pessoais que prioriza a privacidade, projetada para que os usuários hospedem seus dados e gerenciem seus orçamentos com controle total. Oferece orçamento em tempo real, rastreamento detalhado de despesas e relatórios avançados, capacitando os usuários a tomar decisões financeiras informadas. O aplicativo oferece suporte à sincronização criptografada em vários dispositivos e possui aplicativos móveis para iOS e Android, tornando o gerenciamento financeiro acessível em qualquer lugar. Com sua interface limpa e intuitiva, o Actual Budget simplifica finanças complexas e ao mesmo tempo garante que os dados permaneçam seguros e privados.


  Aqui estão alguns recursos principais do orçamento real:


  🗃️ Tudo em um só lugar: adicione todas as suas contas e acompanhe tudo em um só lugar. Obtenha informações valiosas, como patrimônio líquido, de todas as suas contas juntas.


  💰 Beneficiários: gerencie os beneficiários rapidamente. Mescle-os, configure regras personalizadas para a correspondência e use categorias padrão para categorizar transações automaticamente.


  💵 Orçamento: acompanhe seus gastos com orçamentos. Você só pode orçar o dinheiro que tem em mãos, o que significa que seu orçamento permanece realista e você não inventa números.


  📥 Importação de transações: importe transações dos arquivos financeiros mais populares: QIF, OFX, QFX e CSV.


  📂 Migre seus dados: O Actual Budget fornece um importador YNAB4 integrado que mantém todo o seu histórico.


  🔄 Sincronização entre dispositivos: Actual Budget oferece um serviço de sincronização que usa tecnologia sofisticada de sistemas distribuídos para sincronizar alterações em qualquer número de dispositivos.


  📱 Aplicativo móvel: um aplicativo móvel adequado é fundamental para se manter envolvido com suas finanças.


  ➗ Dividir transações: use transações divididas para separar uma única despesa em várias categorias. Um editor embutido torna isso perfeito.


  ➡️ Transferências: Gerencie transferências facilmente criando transações de transferência. Actual vinculará as transações de ambos os lados e as atualizará juntas.


  🔁 Desfazer e refazer: um sistema robusto de desfazer permite reverter quaisquer alterações feitas e refazê-las, se desejar. Nunca se preocupe em cometer erros.


  🔌 API: Use a API completa para escrever importadores personalizados ou criar seus próprios recursos. Esta API simplesmente é executada em seus dados locais.


  🛡️ Criptografia ponta a ponta: Actaul Budget oferece um serviço de sincronização que usa tecnologia sofisticada de sistemas distribuídos para sincronizar alterações em qualquer número de dispositivos.

   
  🔑 Configuração inicial do orçamento real:

   Durante a configuração inicial do Orçamento Real, você precisará de uma senha, que é definida como “senha”. Observe que o aviso HTTPS pode ser ignorado.

