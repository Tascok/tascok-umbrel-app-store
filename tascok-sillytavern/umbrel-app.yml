releaseNotes: >-
  SillyTavern version 1.13.1 introduces important backend updates including support for Google Vertex AI Gemini models, new Gemini 2.5 Pro models in Google AI Studio, and additional features for OpenRouter, MistralAI, and others. 


  The update also brings various improvements like multi-value secrets management, better chat interface controls, video attachments for Gemini models, and performance enhancements. 


  Several bugs related to chat generation, image prompts, and memory leaks have been fixed to ensure a smoother user experience.
