name: Arcane
version: "1.8.0"
tagline: Uma plataforma de gerenciamento Docker fácil e moderna
description: >-
  Arcane é uma plataforma poderosa e moderna de gerenciamento de contêineres projetada para simplificar a maneira como os desenvolvedores interagem com ambientes Docker. Ele fornece uma interface integrada e visualmente atraente que reúne todos os aspectos do gerenciamento de contêineres em um só lugar. Os usuários podem criar, iniciar, parar e inspecionar contêineres, explorar redes, gerenciar imagens e manipular volumes com precisão e controle.


  Além do gerenciamento básico, o Arcane aumenta a produtividade ao oferecer ferramentas integradas nas quais os desenvolvedores normalmente contam durante seus fluxos de trabalho diários. Seu terminal integrado permite interação direta com contêineres em execução, enquanto o editor de código incorporado permite configuração rápida ou ajustes de script sem alternar para aplicativos externos. Insights do sistema em tempo real e registros detalhados oferecem aos usuários uma visão clara do desempenho de sua infraestrutura e do uso de recursos.


  A plataforma foi projetada para preencher a lacuna entre simplicidade e controle avançado. Ele combina um design limpo e moderno com recursos de back-end poderosos, tornando-o igualmente adequado para desenvolvedores que fazem experiências localmente e para profissionais que gerenciam configurações maiores. Com o Arcane, gerenciar contêineres parece mais usar um ambiente de desenvolvimento bem elaborado do que um painel administrativo, permitindo que os usuários se concentrem na construção e execução de aplicativos em vez de lidar com comandos complexos do Docker.



  🧩 Arcane on Umbrel foi projetado para usuários avançados que desejam controle total sobre seus contêineres. Siga estas recomendações para garantir uma experiência confiável e estável.  


  1. Dados persistentes: sempre use volumes nomeados do Docker para seus contêineres e projetos. Quaisquer dados armazenados em montagens vinculadas serão perdidos quando o aplicativo Arcane for atualizado ou reiniciado.  


  2. Uso de portas: Esteja atento aos conflitos de portas entre seus contêineres, serviços do sistema Umbrel e outros aplicativos instalados ou futuros. Atribua números de porta exclusivos para evitar conflitos.  


  3. Comportamento de reinicialização: configure seus contêineres com a política de reinicialização definida como a menos que seja interrompido ou sempre. Isso garante que eles sejam reiniciados automaticamente após a reinicialização ou atualização do Arcane.  


  4. Acesso Web: Você pode acessar qualquer contêiner que exponha uma interface web em `umbrel.local:PORT_NUMBER`. Por exemplo, se seu aplicativo for executado na porta 5050, abra `http://umbrel.local:5050` no seu navegador. 
