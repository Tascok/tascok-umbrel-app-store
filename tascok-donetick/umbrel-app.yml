releaseNotes: >-
  ChatGPT said:This release brings several highly requested features and important refinements. You can now create and manage sub-accounts, a long-awaited addition that makes team organization much easier. It also introduces unassigned tasks that anyone in a group can pick up, along with the ability to assign users directly within a sentence using the “@” symbol.


  On the improvement side, the update enhances frontend performance, resolves issues where task operations didn’t appear immediately, and fixes SSO login problems (currently supported only on the web version). A range of smaller frontend and UI tweaks further polish the overall experience.
