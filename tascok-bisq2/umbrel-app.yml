description: >-
  🟢 Bisq 2 Node executa um backend Bisq 2 privado e continuamente disponível diretamente em seu Umbrel. O aplicativo se conecta à rede descentralizada Bisq por meio de seu serviço Tor integrado e permite acesso seguro usando o aplicativo móvel Bisq Connect.


  A interface web incluída mostra o status atual do nó e fornece um código QR de emparelhamento para conectar seu smartphone. Após o emparelhamento, você pode navegar pelas ofertas, comunicar-se com outros traders, gerenciar negociações e usar o Bisq Easy no seu dispositivo móvel. Como o nó é executado continuamente no Umbrel, ele permanece conectado à rede Bisq mesmo quando o aplicativo móvel é fechado.


  Seus dados comerciais e comunicações permanecem armazenados localmente em seu Umbrel, em vez de serem controlados por uma exchange centralizada. Bisq não assume a custódia de seus fundos e permite que os usuários negociem diretamente entre si. A arquitetura descentralizada elimina a necessidade de contas com uma operadora central e ajuda a preservar sua privacidade. Bisq 2 Node é ideal para usuários que desejam acesso móvel conveniente enquanto mantêm sua infraestrutura comercial privada, descentralizada e auto-hospedada em casa.


  📖 Para obter instruções de configuração, detalhes de uso e informações adicionais, visite:


  https://github.com/dennysubke/dennys-umbrel-app-store/blob/master/tascok-bisq2/README.md
