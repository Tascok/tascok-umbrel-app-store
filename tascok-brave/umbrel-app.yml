manifestVersion: 1
id: tascok-brave
name: Brave
tagline: Um navegador que coloca você em primeiro lugar
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-brave/logo.png
category: networking
version: "1.79.126"
port: 3934
description: >-
  🦁 Brave é um navegador moderno projetado para dar aos usuários controle total sobre sua experiência online, colocando privacidade, segurança e velocidade em primeiro lugar. Ao contrário dos navegadores tradicionais que muitas vezes expõem os usuários a tecnologias de rastreamento e redes de publicidade agressivas, o Brave foi desenvolvido para proteger seus usuários desde o momento em que iniciam a navegação. Ele bloqueia anúncios de terceiros, rastreadores e cookies entre sites por padrão, reduzindo significativamente a coleta de dados e o tempo de carregamento da página. Essa experiência de navegação simplificada não apenas melhora o desempenho, mas também aumenta a segurança do usuário, minimizando a exposição a scripts maliciosos e técnicas de vigilância ocultas.


  Construído no mecanismo Chromium, o Brave garante compatibilidade com os padrões mais modernos da web, ao mesmo tempo que vai além das ofertas típicas de um navegador padrão. Inclui um conjunto de recursos focados na privacidade que são profundamente integrados, em vez de adicionados como extensões opcionais. Esses recursos incluem atualizações automáticas de HTTPS, proteção avançada de impressão digital, bloqueio de scripts e cookies e um painel de privacidade intuitivo que permite aos usuários monitorar e controlar sua pegada de navegação em tempo real.


  O Brave também permite que os usuários explorem a Internet sem concessões, eliminando a dependência de ferramentas externas de privacidade. Ele dá aos usuários a confiança de que suas informações pessoais permanecerão em seus dispositivos e nunca serão coletadas ou monetizadas nos bastidores. Suas configurações padrão são cuidadosamente projetadas para proteger a privacidade sem exigir configurações complicadas, tornando-o acessível até mesmo para usuários sem conhecimentos técnicos.


  Além da privacidade, o Brave apresenta novas maneiras de interagir com o cenário em evolução da Internet. Suporta tecnologias descentralizadas como IPFS e oferece ferramentas nativas para interagir com protocolos web emergentes de forma segura e fácil de usar. O navegador também está comprometido com a transparência e o desenvolvimento aberto, com sua base de código disponível para inspeção e contribuição pública.


  Basicamente, o Brave redefine o relacionamento entre os usuários e a web. Desafia o status quo dos modelos de negócios baseados em dados, provando que uma Internet mais rápida, mais segura e mais respeitosa não só é possível, como já existe. É um navegador que respeita o seu tempo, protege os seus dados e restaura a sensação de confiança e autonomia que há muito faltava na web moderna.


  ⚙️ O aplicativo está disponível em https://umbrel.local:3935. 


  Como é utilizado um certificado SSL autoassinado, seu navegador mostrará um aviso de segurança ao acessar a página pela primeira vez. Você precisa aceitá-lo manualmente para continuar.
