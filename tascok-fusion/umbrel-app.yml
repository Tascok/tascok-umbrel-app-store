description: >-
  📰 Fusion é um aplicativo da web que funciona como um leitor de feed pessoal, permitindo aos usuários coletar, organizar e ler conteúdo de uma ampla variedade de fontes online que publicam feeds RSS, Atom ou JSON. Ele foi projetado para pessoas que preferem consumir notícias e atualizações de vários sites em um ambiente centralizado e sem distrações. Uma vez configurado, o Fusion busca automaticamente novas entradas de feeds assinados em intervalos regulares e as armazena em um banco de dados local, garantindo que o conteúdo esteja sempre disponível e atualizado.


  O aplicativo apresenta artigos em uma interface limpa e responsiva que funciona perfeitamente em vários dispositivos, incluindo desktops, tablets e smartphones. Ele suporta visualizações de texto completo, temas claros e escuros e navegação rápida usando atalhos de teclado, tornando-o uma ferramenta conveniente para leitores frequentes. Os feeds podem ser organizados em categorias personalizadas e entradas individuais podem ser marcadas para leitura posterior. O Fusion também inclui uma poderosa função de pesquisa que permite aos usuários localizar rapidamente artigos com base em palavras-chave ou frases, mesmo em um grande número de entradas de feed.


  A Fusion respeita a privacidade do usuário operando sem rastreamento ou dependendo de serviços externos. Suporta interfaces multilíngues, incluindo inglês, alemão, francês, espanhol, chinês, russo e outros, tornando-o acessível a um público global. O aplicativo permite fácil importação e exportação de assinaturas usando o formato OPML amplamente suportado, para que os usuários possam migrar suas listas de leitura de outros leitores de feeds ou compartilhá-las com outras pessoas.


  Construído com desempenho e simplicidade em mente, o Fusion usa um back-end leve escrito em Go e armazena seus dados em um banco de dados SQLite. Ele pode ser implantado sem esforço via Docker ou como um binário independente e requer recursos mínimos do sistema. Isso o torna particularmente adequado para pequenos servidores, configurações de Raspberry Pi ou qualquer ambiente que valorize eficiência e privacidade. Fusion é uma solução ideal para usuários que desejam controle total sobre sua experiência de leitura de feeds sem depender de plataformas de terceiros.
