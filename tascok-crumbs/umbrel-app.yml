description: >-
  🥨 O Crumbs transforma pensamentos dispersos em um espaço de conhecimento pessoal calmo e organizado. Capture ideias rápidas, notas detalhadas, tarefas, listas de verificação, material de referência e tudo mais sem perder o controle do que é importante.


  Um editor flexível combina Markdown, rich text, tabelas, blocos de código, links e anexos de imagens, enquanto tags, cores, fixação, pesquisa, arquivos e histórico de versões mantêm as coleções crescentes fáceis de navegar. As notas podem ser compartilhadas de forma privada ou publicadas por meio de links somente leitura, e a interface responsiva off-line funciona perfeitamente em desktops e dispositivos móveis.


  Com suporte para vários usuários, autenticação segura, chaves de API e integrações opcionais com OAuth, OpenID Connect, serviços de e-mail e assistentes de IA compatíveis, o Crumbs foi desenvolvido para evoluir de um simples notebook para um poderoso espaço de trabalho pessoal.
