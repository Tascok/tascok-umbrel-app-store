releaseNotes: >-
  Komodo version 1.18.4 introduces support for resource templates that serve as starting points when creating new resources, enhancing workflow flexibility. It also adds container port display and linking features for easier navigation, along with improvements to environment variable handling, server statistics, and internal code refactoring to increase stability and consistency. Both Core and Periphery agents should be updated to ensure full compatibility.
