description: >-
  Twenty é o CRM de código aberto líder, desenvolvido por uma comunidade de centenas de colaboradores para atender às necessidades exclusivas do seu negócio. Projetado para oferecer flexibilidade, ele ajuda empresas de todos os tamanhos a gerenciar com eficiência o relacionamento com os clientes e a simplificar os fluxos de trabalho.


  Com o Twenty, você pode gerenciar facilmente os dados do cliente por meio de seu sistema de gerenciamento de contatos. Você pode criar objetos e campos personalizados para capturar informações específicas de suas operações comerciais, garantindo que seu CRM seja adaptado às suas necessidades. A plataforma oferece visualizações Kanban e Table Views, permitindo visualizar seu fluxo de trabalho e gerenciar projetos da maneira que melhor funciona para sua equipe.


  Ele também possui visualização de pipeline, proporcionando uma visão geral clara de seus processos e ajudando a rastrear seu funil de vendas. A integração de e-mail é outro recurso valioso, permitindo visualizar e-mails relacionados a um cliente ou empresa específica diretamente em seu espaço de trabalho. Essa integração garante que sua equipe possa colaborar de forma eficiente sem sair da plataforma.


  Notas e tarefas podem ser facilmente adicionadas a cada registro, permitindo que sua equipe documente informações importantes e rastreie as interações com os clientes. Para aqueles que precisam de automação mais avançada, o Twenty oferece suporte a API e Webhook, facilitando a conexão com outros aplicativos e automatizando fluxos de trabalho.


  Os benefícios de usar o Twenty incluem organização aprimorada, comunicação simplificada, melhor gerenciamento de dados e colaboração aprimorada dentro de sua equipe. A flexibilidade e as opções de personalização também garantem que o Twenty possa se adaptar à medida que seu negócio cresce e muda.
