name: Cobalt
tagline: Um downloader de mídia que não te irrita
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-cobalt/logo.png
category: media
version: "11.5"
port: 9009
description: >-
  Cobalt é um downloader de mídia poderoso e intuitivo criado para simplificar o processo de salvar seu conteúdo favorito da web. Projetado para usuários que desejam aproveitar sua mídia sem interrupções de anúncios, rastreadores ou acesso pago, o Cobalt oferece uma experiência simplificada. Esteja você baixando vídeos, músicas, imagens ou outros tipos de mídia, o Cobalt atua como um proxy que busca conteúdo diretamente de sua fonte, garantindo um processo rápido e contínuo.


  O que diferencia o Cobalt é o seu compromisso com a privacidade e a liberdade do usuário. A ferramenta não armazena conteúdo em cache, então você sempre baixa diretamente da fonte original. Também evita distrações desnecessárias, como anúncios ou interferência de terceiros, permitindo que você desfrute de um processo de recuperação de mídia mais limpo, rápido e confiável.


  O Cobalt é ideal para quem valoriza a simplicidade e o controle sobre os downloads de mídia. Com sua interface fácil de usar e funcionalidade eficiente, você pode recuperar e armazenar conteúdo rapidamente sem os problemas habituais. Quer você seja um entusiasta da coleta de mídia ou alguém simplesmente tentando acessar conteúdo sem restrições, o Cobalt facilita o download do que você ama, quando quiser.


  ⚠️ Para garantir a funcionalidade adequada, acesse /settings/instances e configure o servidor de processamento para http://umbrel.local:9000.
