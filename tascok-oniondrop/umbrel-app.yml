description: >-
  OnionDrop é um aplicativo de recebimento de arquivos privado projetado especificamente para Umbrel. Ele usa o mecanismo oficial OnionShare para criar caixas de entrada cebola persistentes que podem ser acessadas através do navegador Tor. Pessoas de confiança podem fazer upload de arquivos ou enviar mensagens de texto anônimas sem criar uma conta, revelar seu endereço IP ou depender de um serviço de nuvem de terceiros.


  Cada caixa de entrada pode ser configurada separadamente. Você pode decidir se aceita arquivos, mensagens ou ambos e, opcionalmente, protegê-lo com uma chave de acesso privada. As caixas de entrada também podem receber um prazo de validade, um limite de armazenamento e inicialização automática para que retornem on-line após a reinicialização do OnionDrop ou do Umbrel.


  Todo o conteúdo recebido é armazenado localmente no seu próprio Umbrel. OnionDrop fornece uma interface clara para gerenciar caixas de entrada, copiar detalhes de convites, exibir códigos QR, revisar arquivos recebidos, baixá-los, excluí-los e verificar os registros do serviço OnionShare.


  As configurações persistentes de recebimento do OnionShare também podem ser importadas e exportadas. Isso permite que uma identidade cebola existente seja movida entre instalações OnionShare compatíveis e OnionDrop sem alterar o endereço cebola. OnionDrop combina compatibilidade OnionShare com uma interface Umbrel simples e sempre disponível para entrada de arquivos privados.
