manifestVersion: 1
id: tascok-auto-mcs
name: Auto-MCS
tagline: Um gerenciador de servidor Minecraft multiplataforma
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-auto-mcs/logo.png
category: gaming
version: "2.3.3"
port: 8439
description: >-
  ⛏️ Auto-MCS é uma ferramenta de gerenciamento avançada projetada para simplificar a criação e operação de servidores Minecraft. Ele automatiza quase todos os aspectos da configuração do servidor, desde o download e configuração dos arquivos necessários até o gerenciamento de atualizações, backups e plug-ins. O aplicativo permite que os usuários implantem novos servidores em minutos, enquanto lidam com todas as tarefas complexas, como controle de versão, instalação de mod e plugins e gerenciamento de configuração em segundo plano.


  Oferece suporte integrado para várias edições do Minecraft e carregadores de mod, tornando possível alternar entre diferentes tipos de servidores sem reconfiguração manual. O Auto-MCS também fornece ferramentas integradas para gerenciamento de jogadores, troca de mundo e controle de acesso, garantindo que os administradores possam ajustar facilmente as configurações ou permissões conforme necessário.


  Seus recursos automáticos de detecção e registro de falhas ajudam a manter a estabilidade do servidor e simplificam a solução de problemas quando ocorrem problemas. Além disso, inclui uma interface de console para execução de comandos ao vivo, um sistema de script para automatizar tarefas e um mecanismo de backup que mantém os dados do jogo seguros.


  Através de uma combinação perfeita de automação e controle do usuário, o Auto-MCS transforma o gerenciamento de servidores Minecraft em uma experiência rápida, eficiente e acessível para administradores iniciantes e experientes.


  ⚙️ A porta 7001 é usada pela API Telepath para comunicação remota e gerenciamento de servidor. 


  A porta 25565 é a porta padrão do servidor Minecraft que permite aos jogadores se conectarem ao mundo hospedado.
