id: tascok-gotify
name: Gotify
tagline: Um servidor simples para enviar e receber mensagens
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-gotify/logo.png
category: networking
version: "2.6.3"
port: 8784
description: >-
  📲 Gotify é um servidor de notificação auto-hospedado de código aberto projetado para permitir notificações push em tempo real em vários dispositivos. É um sistema leve e eficiente que permite que aplicativos enviem mensagens ao servidor Gotify por meio de uma API REST. Essas mensagens são então entregues a clientes conectados, incluindo navegadores da web, dispositivos móveis ou outros sistemas que suportam o serviço de notificação push do Gotify.


  O servidor é construído em Go, conhecido por seu alto desempenho e mínimo consumo de recursos, tornando-o adequado para diversos ambientes. A interface web simples e intuitiva do Gotify permite aos usuários gerenciar notificações, configurar aplicativos e gerar tokens API para autenticação e controle de acesso.


  Um dos principais recursos do Gotify é o suporte para notificações em tempo real usando WebSockets. Isso permite que os clientes conectados recebam notificações instantaneamente, garantindo a entrega oportuna das mensagens. Além disso, Gotify oferece suporte à categorização e priorização de notificações, ajudando os usuários a organizar as mensagens recebidas com base na importância.


  Gotify oferece um aplicativo Android nativo, que permite aos usuários receber notificações push diretamente em seus dispositivos. Ele também fornece um aplicativo web, garantindo que os usuários possam se manter atualizados em diferentes plataformas. A arquitetura do sistema foi projetada para oferecer flexibilidade e escalabilidade, permitindo lidar com notificações de diversas fontes, desde alertas de sistema e ferramentas de monitoramento até aplicativos personalizados.


  Como uma solução auto-hospedada, Gotify oferece aos usuários controle total sobre sua infraestrutura de notificação, garantindo privacidade e segurança de dados. Com sua natureza de código aberto, ele pode ser personalizado e estendido para atender a diferentes casos de uso. A capacidade de hospedar notificações localmente, sem depender de serviços de terceiros, torna o Gotify uma opção atraente para quem busca uma solução privada e econômica para entregar notificações em tempo real.


  ⚠️ Para informações mais detalhadas, incluindo configuração avançada e documentação da API, consulte a documentação oficial do Gotify: https://gotify.net/docs/pushmsg.
