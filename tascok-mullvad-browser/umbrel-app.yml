id: tascok-mullvad-browser
name: Mullvad Browser
tagline: Um navegador focado na privacidade projetado para minimizar rastreamento e impressões digitais
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-mullvad-browser/logo.png
category: networking
version: "14.0.5"
port: 5880
description: >-
  Mullvad Browser é um navegador com foco na privacidade desenvolvido pela Mullvad VPN em colaboração com o Projeto Tor. Ele foi projetado para minimizar o rastreamento on-line e impressões digitais, proporcionando aos usuários uma experiência de navegação mais privada sem a necessidade do uso de VPN ou da rede Tor. Construído no Mozilla Firefox, ele incorpora vários recursos de aprimoramento de privacidade, como tecnologia anti-impressão digital, gerenciamento rigoroso de cookies e cache e bloqueio automático de rastreadores e scripts de terceiros.


  Um dos seus principais princípios de design é fazer com que todos os usuários pareçam tão idênticos quanto possível aos sites, reduzindo a eficácia das técnicas de impressão digital do navegador. Ao contrário dos navegadores padrão, que geralmente armazenam muitos dados de navegação, o Mullvad Browser limita a retenção de dados e desativa a telemetria por padrão. Ele também reforça conexões HTTPS sempre que possível e evita vazamentos de WebRTC que poderiam expor o endereço IP real de um usuário.


  Embora o navegador possa ser usado sozinho, ele é particularmente eficaz quando combinado com uma VPN, como o Mullvad VPN, para obter uma camada adicional de anonimato. Ao priorizar a privacidade do usuário em vez da personalização e conveniência, o Mullvad Browser oferece uma solução simples, porém robusta, para quem busca navegar na web com o mínimo de rastreamento e exposição de dados.


  ⚠️ Mullvad Browser é para usuários avançados. Se você estiver usando uma VPN, defina LOCAL_NET=192.168.0.0/16 no arquivo docker-compose para o intervalo de IP da LAN local usando a notação CIDR. Sem ele, você não conseguirá acessar a interface web.
