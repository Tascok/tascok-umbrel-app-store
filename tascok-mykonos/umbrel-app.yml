description: >-
  🏝️ Mykonos Island Voxels é um relaxante construtor de ilhas baseado em navegador que permite criar um pequeno mundo mediterrâneo em uma grade isométrica. Organize casas caiadas, capelas com cúpulas azuis, moinhos de vento, árvores, jardins, caminhos, pontes, água e objetos decorativos para projetar sua própria ilha grega ensolarada.


  Mais de 75 ativos detalhados são divididos em categorias de terreno, natureza, adereços, água e construção. Os objetos podem ser colocados individualmente ou pintados em vários blocos, enquanto as ferramentas de zoom, panorâmica, inversão, controles de grade e apagamento facilitam a remodelagem da ilha a partir de desktops ou dispositivos móveis.


  Não há recursos para coletar, pontuações para perseguir ou objetivos para completar. A experiência se concentra inteiramente em experimentar, decorar e construir no seu próprio ritmo.


  Sua ilha atual é salva automaticamente no armazenamento local do navegador e restaurada quando você retornar. As ilhas salvas estão, portanto, vinculadas ao navegador e ao dispositivo usado e não são sincronizadas entre diferentes dispositivos.
