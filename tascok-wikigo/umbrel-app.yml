id: tascok-wikigo
name: Wiki-Go
tagline: Um wiki moderno de arquivo simples criado com Go
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-wikigo/logo.png
category: files & productivity
version: "1.3.14"
port: 8833
description: >-
  Wiki-Go é um aplicativo wiki leve e auto-hospedado, escrito na linguagem de programação Go. Projetado para simplicidade e velocidade, ele permite aos usuários criar e editar páginas por meio de uma interface limpa baseada na web. Em vez de depender de um banco de dados tradicional, o Wiki-Go armazena todo o seu conteúdo como arquivos Markdown, facilitando o backup, o controle de versão ou a edição com qualquer editor de texto padrão. O aplicativo é compilado em um único binário executável, o que significa que pode ser executado em praticamente qualquer plataforma sem a necessidade de instalações complexas ou dependências externas.


  O projeto visa fornecer um sistema wiki mínimo, porém funcional, que possa ser implantado rapidamente e gerenciado com pouco esforço. Seja usado para anotações pessoais, documentação de projetos ou como base de conhecimento interna para uma pequena equipe, o Wiki-Go oferece uma solução rápida e direta. A interface é intencionalmente minimalista, com foco na criação e legibilidade do conteúdo, ao mesmo tempo que oferece recursos básicos como templates e temas para personalização.


  Por estar escrito em Go, o Wiki-Go tem alto desempenho e pode lidar com um grande número de páginas com eficiência. É particularmente adequado para desenvolvedores ou entusiastas que apreciam software de código aberto e desejam um sistema wiki portátil e descomplicado. Como todo o aplicativo é executado como um único binário, também é fácil conteinerizar ou integrar em ambientes como Docker ou plataformas de auto-hospedagem como Umbrel.


  Em essência, o Wiki-Go é ideal para quem procura um wiki baseado em markdown, leve e com foco na facilidade de uso, implantação e manutenção.
