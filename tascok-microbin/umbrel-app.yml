version: "2.0.4"
port: 8065
description: >-
  MicroBin é uma ferramenta incrivelmente compacta e auto-hospedada para compartilhar rapidamente textos, arquivos e URLs. Em vez de números aleatórios, o MicroBin usa nomes de animais como identificadores para conteúdo compartilhado (“pastas”), que pode ser acessado por meio de URLs como “server.com/file/pig-dog-cat”. Ele suporta upload de arquivos, exibição de texto bruto e encurtamento de URL com redirecionamento. Além disso, códigos QR podem ser gerados para simplificar o acesso ao conteúdo compartilhado.


  MicroBin oferece flexibilidade no gerenciamento de seu conteúdo: você pode escolher entre privado e público, editável e final, “pastas” que expiram automaticamente ou nunca. O realce de sintaxe e o modo escuro automático estão integrados, com uma interface mínima que pode ser facilmente personalizada com seu próprio CSS. Graças à sua estrutura de banco de dados simples (JSON e arquivos), o MicroBin é portátil, permitindo backups simples e integração perfeita com outros sistemas. Você pode listar e remover conteúdo manualmente por meio de uma página “pastalista” dedicada, que também pode ser desativada, se desejar.


  O que exatamente é uma “macarrão”? No MicroBin, uma pasta pode ser muitas coisas: um texto que você deseja transferir de uma máquina para outra, um arquivo grande demais para outras plataformas ou um redirecionamento de URL. O MicroBin pode ser usado de várias maneiras – como encurtador de URL, para enviar textos longos ou arquivos grandes, como servidor web para arquivos ou até mesmo como sistema de anotações. Seja para uso pessoal ou em equipe, o MicroBin oferece uma solução simples e flexível para vários casos de uso.

