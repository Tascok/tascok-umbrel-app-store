releaseNotes: >-
  Pages 0.1.2 introduces a complete global settings area for publishing defaults, Onion services, backups, statistics, privacy, and editor preferences. New sites can now inherit configurable defaults such as templates, publishing state, SPA fallback, CORS, directory listings, and cache duration.


  Automatic backups, retention limits, storage controls, statistics privacy options, and editor auto-save settings have also been added. The Overview layout has been refined for cleaner alignment, consistent spacing, and improved responsiveness.
