name: Swing Music
tagline: Um lindo reprodutor de música auto-hospedado para seus arquivos de áudio locais
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-swingmusic/logo.png
category: media
version: "1.4.8"
port: 1970
description: >-
  Swing Music é um reprodutor de música elegante e auto-hospedado, criado para sua coleção pessoal de áudio. Ao contrário de serviços de streaming como o Spotify, você tem controle total sobre sua biblioteca – apenas as músicas que você adora são selecionadas. Basta iniciar o aplicativo e acessar toda a sua coleção diretamente do seu navegador. Desfrute de reprodução contínua, recursos avançados de lista de reprodução e uma interface amigável que parece um serviço de música personalizado. 


  Com o Swing Music, você aproveita ao máximo sua música sem assinaturas ou anúncios – apenas você e suas músicas favoritas.


  Aqui estão alguns recursos interessantes oferecidos pelo Swing Music:


  🎶 Inferir informações da versão do álbum (deluxe, etc.) a partir do título do álbum e usá-las para agrupar álbuns


  🎧 Descubra novas músicas explorando artistas semelhantes na página do artista


  🆕 Descubra novos álbuns explorando álbuns semelhantes na página do álbum


  ✅ Projetado para ser simples e bonito. É um prazer olhar.


  📚 Navegue em sua biblioteca por pastas. É a maneira mais natural de organizar sua música.


  🖥️ Sem GUI integrada, sem Electron que consome muita memória. Basta carregar a IU no seu navegador favorito.


  📝 Nem sempre você consegue acertar a ortografia. Ele lida com erros de digitação e ortografia como um campeão.


  📑 Ele pode detectar e ocultar faixas duplicadas da sua biblioteca. A faixa com a taxa de bits mais alta é preferida.


  🚀 Swing Music ainda é um projeto jovem e há muitos recursos interessantes para lançamentos futuros. Fique atento!

