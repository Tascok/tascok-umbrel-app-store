description: >-
  👾 PokéRogue é um roguelite de captura de monstros baseado em navegador que combina batalhas por turnos com corridas aleatórias, progressão de longo prazo e formação estratégica de equipes. Os jogadores escolhem seus iniciantes, encontram criaturas selvagens, desafiam treinadores e chefes e viajam por biomas em constante mudança enquanto coletam itens e melhoram sua equipe.


  Cada corrida oferece diferentes encontros, recompensas, habilidades e decisões táticas. Os jogadores podem capturar criaturas adicionais, desbloquear novos iniciantes, chocar ovos, descobrir variantes raras e experimentar diferentes combinações de equipes. Vários modos de jogo e desbloqueios persistentes proporcionam um forte valor de repetição, preservando o ritmo familiar das clássicas batalhas de criaturas baseadas em turnos.


  A dificuldade dinâmica e os encontros inesperados incentivam os jogadores a adaptar suas estratégias ao longo de cada corrida. Uma ampla seleção de criaturas, movimentos, itens e habilidades passivas permite inúmeras combinações táticas, enquanto cada tentativa oferece novas oportunidades de melhoria e progresso.


  ⚠️ Observe que a instalação inicial pode levar até 10 minutos, dependendo do seu dispositivo e da conexão com a internet.


  ℹ️ Para controles de teclado e informações adicionais sobre o jogo, consulte o README: 
      
  https://github.com/dennysubke/dennys-umbrel-app-store/blob/master/tascok-pokerogue/README.md
