releaseNotes: >-
  Version 2.2.2 is a bugfix patch release that resolves four issues and integrates seven pull requests, contributed by four contributors. Key fixes include correcting the TaxType option when adding items, ensuring Money DataTransformer accurately processes cent values, and addressing errors with empty contact type details. Additionally, this update introduces separate configuration paths and enhanced settings for Sentry integration.
