releaseNotes: >-
  The latest updates include numerous fixes for toast messages, sharing text, naming, responsiveness, mobile layout, and various UI elements such as icons, buttons, and dropdowns. 


  Support for HEIC fallback and an additional ffmpeg fallback was added to improve image handling reliability. The README received extensive updates, including new screenshots, PWA information, favorites, share links, licensing details, and general documentation improvements.
