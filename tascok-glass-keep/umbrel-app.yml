releaseNotes: >-
  This update introduced Search & AI Assistance: experience a more powerful way to navigate your data with Deep Search, which now covers titles, Markdown text, tags, checklist items, and image names. You can now ask questions directly about your notes by pressing Enter in the search bar, leveraging Smart Grounding for accurate, private answers based on your content, and enjoy a streamlined experience with a one-click clear that resets your search query when closing the AI response box.
