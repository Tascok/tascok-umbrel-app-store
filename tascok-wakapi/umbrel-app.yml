releaseNotes: >-
  Release 2.12.2 includes several bug fixes and improvements. It also introduces a schema change to the heartbeats table, which may cause extended downtime for large instances with over several hundred thousand records. Users with such instances are advised to manually run the suggested SQL command before upgrading to avoid prolonged downtime.
