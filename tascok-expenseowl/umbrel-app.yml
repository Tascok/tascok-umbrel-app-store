description: >-
  🦉 ExpenseOwl é um aplicativo de rastreamento de despesas simples e focado que permite aos usuários registrar e revisar rapidamente suas atividades financeiras. Ele suporta a adição de receitas e despesas com apenas uma data, valor e categoria, ao mesmo tempo que oferece tags opcionais para organização adicional. O aplicativo oferece uma interface de usuário limpa e responsiva com temas claros e escuros, tornando-o fácil de navegar e visualmente atraente.


  O painel principal apresenta um gráfico mensal que divide as despesas por categoria, junto com um resumo do fluxo de caixa que mostra a receita total, as despesas totais e o saldo resultante. Os usuários podem interagir com o gráfico ocultando ou mostrando categorias para personalizar a visualização. Uma tabela detalhada lista todas as transações cronologicamente e permite fácil pesquisa e exclusão.


  As transações recorrentes são suportadas tanto para receitas quanto para despesas, e os usuários podem personalizar totalmente suas categorias, símbolo monetário e o dia de início de cada mês. As tags são destacadas automaticamente quando usadas, ajudando os usuários a identificar padrões de gastos. O aplicativo também inclui funcionalidade de importação e exportação de CSV para fácil gerenciamento de dados.


  ExpenseOwl foi projetado para fornecer uma visão geral clara e instantânea das finanças pessoais, sem as distrações dos recursos de orçamento ou gerenciamento de contas. Ele se concentra inteiramente no rastreamento rápido e direto e na visualização limpa.
