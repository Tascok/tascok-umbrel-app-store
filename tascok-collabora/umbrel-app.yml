id: tascok-collabora
name: Collabora Office
tagline: Uma solução integrada para tratamento de documentos no Nextcloud
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-collabora/logo.png
category: In Progress
version: "24.04.12.3.1"
port: 9980
description: >-
  📑 Collabora Office for Nextcloud é um pacote de escritório online abrangente projetado para trazer todo o poder de edição, colaboração e gerenciamento de documentos diretamente para seu ambiente Nextcloud. Construído com base na tecnologia LibreOffice, suporta uma ampla variedade de formatos de arquivo, incluindo Microsoft Office (DOCX, XLSX, PPTX) e OpenDocument (ODT, ODS, ODP), garantindo compatibilidade e facilidade de uso. Com seus recursos de colaboração em tempo real, vários usuários podem trabalhar nos mesmos documentos, planilhas ou apresentações simultaneamente, tornando-o uma solução ideal para equipes e organizações.


  O Collabora Office é auto-hospedado, oferecendo controle total sobre seus dados e garantindo os mais altos padrões de privacidade e segurança. Esteja você editando uma planilha complexa, preparando uma apresentação ou redigindo um documento importante, o Collabora Office fornece todas as ferramentas que você precisa, diretamente no Nextcloud. Sua integração perfeita cria uma plataforma unificada para produtividade, tornando mais fácil do que nunca manter-se organizado e trabalhar com eficiência. Tanto para indivíduos quanto para empresas, o Collabora Office é a escolha perfeita para uma alternativa segura e de código aberto às ferramentas proprietárias de escritório baseadas em nuvem.


  ⚙️ Configurando o Collabora Office e integrando-o ao Nextcloud:


  1. Verifique o serviço Collabora Office: Abra seu navegador e visite seu servidor Collabora Online no seguinte URL: http://umbrel.local:9980. Se o serviço estiver funcionando corretamente, você deverá ver uma página com um simples “OK” no canto superior esquerdo.


  2. Acesse a interface administrativa: Para gerenciar o serviço, abra a interface administrativa visitando: http://umbrel.local:9980/browser/dist/admin/admin.html. Faça login com “admin” como nome de usuário e “umbrel” como senha.


  3. Integre o Collabora Office com Nextcloud: Faça login em seu servidor Nextcloud com sua conta de administrador. Vá para Aplicativos e selecione a categoria Office e Texto. Instale Collabora Online ou Nextcloud Office (ambos são iguais). Em seguida, vá para Configurações e role para baixo à esquerda para encontrar Nextcloud Office. Insira a URL do servidor Collabora Online no campo: http://umbrel.local:9980. Salve as configurações. Uma marca de seleção verde deve aparecer.


  4. Editar documentos: A partir de agora, ao criar um novo documento no Nextcloud, o Collabora Online será iniciado automaticamente para permitir que você o edite.


  ⚠️ Recomenda-se instalar o aplicativo Cloudflare da Umbrel App Store para maior segurança e desempenho. O aplicativo fornece criptografia HTTPS fácil, proteção DDoS e cache, melhorando a velocidade e a confiabilidade de seus serviços Collabora Online e Nextcloud.
