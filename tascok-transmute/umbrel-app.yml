description: >-
  Transmute é um aplicativo de conversão de arquivos para transformar arquivos em diferentes formatos através de uma interface limpa e simples. Ele oferece suporte a uma ampla variedade de tipos de arquivos, incluindo imagens, vídeos, arquivos de áudio, documentos, dados estruturados, planilhas, legendas, fontes e diagramas.


  O aplicativo foi desenvolvido para conversões manuais e fluxos de trabalho automatizados. Sua API possibilita conectar o Transmute a outros aplicativos, scripts ou serviços, para que os arquivos possam ser convertidos como parte de um processo maior sem fazer tudo manualmente.


  Transmute ajuda a simplificar as alterações diárias de formato, desde a conversão de arquivos de mídia em formatos mais compatíveis até a transformação de documentos, arquivos de dados e diagramas para uso posterior. Ele reúne muitas tarefas de conversão diferentes em um só lugar e facilita o acesso.
