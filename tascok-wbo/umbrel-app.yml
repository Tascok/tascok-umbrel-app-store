version: "1.20.1"
tagline: Um quadro branco colaborativo online simples, gratuito, fácil de usar e implantar
description: >-
  WBO é uma plataforma de quadro branco colaborativo que permite a interação em tempo real entre vários usuários, tornando-a perfeita para brainstorming criativo, planejamento de projetos, ensino e trabalho em equipe. É baseado em navegador e de código aberto, não exigindo instalações ou contas.


  A interface do WBO oferece ferramentas para desenhar, escrever e fazer anotações, com atualizações imediatas ao vivo em todos os dispositivos conectados. Você pode criar painéis privados personalizados com URLs compartilháveis ​​ou ingressar em painéis públicos para colaboração aberta. Sua simplicidade e flexibilidade tornam-no uma ferramenta altamente acessível para uso casual e profissional, em diversos setores.

