manifestVersion: 1
id: tascok-babybuddy
name: Baby Buddy
tagline: Um rastreador de bebê tudo-em-um
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-babybuddy/logo.png
category: files & productivity
version: "2.7.1"
port: 8673
description: >-
  🍼 Baby Buddy é um aplicativo da web de código aberto desenvolvido para ajudar pais e cuidadores a monitorar e gerenciar todos os aspectos essenciais do cuidado de um bebê. Construída com Django e destinada à auto-hospedagem, a plataforma oferece uma maneira centralizada e que respeita a privacidade de registrar atividades diárias, como alimentação, sono, troca de fraldas, hora de ficar de bruços e muito mais. Seu objetivo é reduzir a carga mental de lembrar e organizar as necessidades de um bebê, ao mesmo tempo que oferece informações valiosas por meio de visualização de dados e estatísticas.


  A interface do usuário é limpa, responsiva e otimizada para uso em desktops e dispositivos móveis. Baby Buddy pode ser instalado usando Docker ou diretamente em um servidor e suporta uma variedade de bancos de dados como SQLite, PostgreSQL ou MySQL. Ele também inclui uma API totalmente funcional, facilitando a conexão com ferramentas ou aplicativos móveis de terceiros. Está disponível um aplicativo Android dedicado que se conecta com segurança ao servidor Baby Buddy e permite a entrada rápida de dados, mesmo quando estiver offline.


  O que torna o Baby Buddy especialmente poderoso é sua capacidade de gerar gráficos e relatórios em tempo real que ajudam os usuários a identificar padrões nas rotinas de seus bebês. Isso inclui monitorar a frequência e a duração das mamadas ou cochilos, monitorar o peso e o crescimento e analisar os ciclos de sono ao longo de dias ou semanas. O aplicativo também inclui um sistema de cronômetro ao vivo, permitindo aos usuários iniciar e parar atividades de monitoramento como sono ou amamentação com um único toque.


  Baby Buddy é multilíngue e apoiado por uma comunidade ativa de código aberto que frequentemente contribui com traduções, novos recursos e melhorias. Também é popular entre os usuários do Home Assistant, pois pode ser integrado a painéis domésticos inteligentes para automatizar notificações ou visualizar dados relacionados ao bebê em monitores montados na parede.


  Com o Baby Buddy, os pais têm controle total sobre seus dados e podem adaptar o sistema para atender às suas necessidades individuais. É uma solução flexível e segura para famílias que desejam acompanhar o desenvolvimento de seus filhos de uma forma estruturada e significativa, sem depender de aplicativos comerciais de rastreamento de bebês baseados em nuvem.
