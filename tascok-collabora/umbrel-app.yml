  The latest release introduced a feature to hide the server signature, improving security by making it harder for attackers to identify the server’s configuration. Additionally, several bug fixes were applied, including resolving an issue where the font list in Impress showed no remote fonts, addressing slow saving of certain spreadsheets, and fixing a copy-paste issue when using Traefik.
