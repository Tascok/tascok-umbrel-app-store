name: Ferdium
tagline: Um hub de mensagens completo
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-ferdium/logo.png
category: files & productivity
version: "2.0.10"
port: 3333
description: >-
  Ferdium é um aplicativo de código aberto projetado para consolidar vários serviços de mensagens e web em uma única interface. Foi criado como um fork do Franz, ferramenta semelhante, com o objetivo de eliminar certas limitações e tornar a plataforma mais amigável e acessível à privacidade. Ao contrário do Franz, o Ferdium não exige que os usuários criem uma conta, permitindo-lhes usar o aplicativo sem depender de servidores externos para autenticação ou sincronização.


  A principal função do Ferdium é agilizar a experiência do usuário integrando várias ferramentas de comunicação e produtividade em um aplicativo unificado. Ele oferece suporte a uma ampla gama de serviços, incluindo aplicativos de mensagens, clientes de e-mail, plataformas de mídia social e ferramentas de colaboração. Os usuários podem acessar várias contas de diferentes serviços sem precisar alternar entre guias do navegador ou aplicativos separados.


  Um dos principais aspectos do Ferdium são suas opções de personalização. Os usuários podem adicionar serviços predefinidos ou criar suas próprias integrações personalizadas, proporcionando flexibilidade no gerenciamento de seu espaço de trabalho digital. Além disso, o aplicativo inclui recursos de privacidade integrados, como bloqueador de anúncios e rastreadores, que ajudam a reduzir distrações e aumentar a segurança.


  Ferdium está disponível para Windows, macOS e Linux, tornando-o uma solução versátil para usuários de diferentes sistemas operacionais. Por ser um projeto de código aberto, beneficia das contribuições da comunidade e de melhorias contínuas, garantindo que continua a ser uma alternativa viável às aplicações proprietárias. Ao fornecer uma alternativa ao Franz mais fácil de usar e preocupada com a privacidade, a Ferdium atrai aqueles que desejam gerenciar com eficiência vários serviços em um só lugar, sem restrições desnecessárias.


  ⚠️ Nota: Este aplicativo não é cliente Ferdium. É o servidor Ferdium. Um servidor personalizado permite que você mesmo gerencie os dados de todos os usuários registrados e adicione suas próprias receitas ao repositório.


  💡 Para usar o Ferdium você também precisa do cliente, que pode ser baixado aqui: ferdium.org/download
