manifestVersion: 1
id: tascok-changedetection
name: Changedetection
tagline: Uma ferramenta fácil para rastrear alterações no site e receber alertas de atualizações
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-changedetection/logo.png
category: networking
version: "0.49.1"
port: 5555
description: >-
  🔍Changedetection é uma ferramenta que rastreia alterações em sites, como atualizações de preços ou revisões de conteúdo. Ele notifica os usuários sobre atualizações por e-mail, Slack ou Discord. Com sua configuração baseada em nuvem, nenhuma instalação é necessária, tornando-o conveniente para monitorar múltiplas páginas. Os recursos incluem alertas personalizados, rastreamento JSON/XML para conteúdo específico e notificações de reabastecimento. É especialmente útil para monitorar produtos com disponibilidade limitada ou conteúdo urgente.
