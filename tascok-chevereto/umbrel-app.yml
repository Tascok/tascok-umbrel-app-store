manifestVersion: 1
id: tascok-chevereto
name: Chevereto
tagline: Uma maneira rápida e confiável de armazenar e compartilhar suas imagens
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-chevereto/logo.png
category: files & productivity
version: "4.2.4"
port: 8048
description: >-
  📸 Chevereto é uma plataforma de hospedagem de imagens versátil e robusta que permite aos usuários criar seu próprio site de hospedagem de imagens personalizado. Ideal para uso pessoal, empresarial ou comunitário, o Chevereto oferece uma ampla gama de recursos projetados para fornecer uma experiência de compartilhamento de imagens contínua e eficiente. Ele é construído em PHP e fornece uma interface limpa e intuitiva para administradores e usuários finais.


  Uma das principais vantagens do Chevereto é a capacidade de permitir aos usuários fazer upload, armazenar e gerenciar imagens com segurança em seu próprio servidor, dando total controle sobre o conteúdo. A plataforma suporta vários formatos e resoluções de imagem, tornando-a adequada para uma ampla variedade de casos de uso, desde o simples compartilhamento de fotos até o armazenamento de imagens em grande escala para organizações ou sites.


  Chevereto também oferece opções poderosas de personalização, incluindo a capacidade de organizar imagens em álbuns, aplicar tags e habilitar categorias para melhor pesquisa. Possui ferramentas de gerenciamento de usuários que permitem criar diferentes funções de usuário, cada uma com permissões personalizáveis, tornando-o perfeito para ambientes colaborativos ou acesso controlado.


  Além disso, o software oferece suporte a uma ampla gama de integrações e extensões, incluindo compactação de imagens, marcas d'água e compartilhamento em mídias sociais, aprimorando a funcionalidade geral. O design responsivo do Chevereto garante que a plataforma seja acessível e fácil de usar em todos os dispositivos, de desktops a smartphones.


  Outra característica importante é sua escalabilidade. À medida que suas necessidades de hospedagem de imagens aumentam, Chevereto pode lidar facilmente com quantidades crescentes de tráfego e armazenamento, garantindo que continue sendo uma solução confiável à medida que sua plataforma se expande. Esteja você procurando construir uma biblioteca de imagens privada ou uma comunidade pública de compartilhamento de imagens, Chevereto oferece um conjunto de ferramentas poderoso e flexível para atender às suas necessidades.


  Com o Chevereto você obtém total propriedade do seu serviço de hospedagem de imagens sem as limitações impostas por serviços de terceiros, sendo uma excelente opção para quem busca privacidade, controle e customização.


  ⚠️ Durante a instalação, utilize os seguintes dados de conexão com o banco de dados: Host: "chevereto-db", Porta: "3306", Nome do banco de dados: "chevereto", Usuário: "chevereto", Senha: "umbrelpass". O prefixo da tabela pode ser deixado em branco ou definido como "chv_".
