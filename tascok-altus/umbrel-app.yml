id: tascok-altus
name: Altus
tagline: Um cliente WhatsApp com temas e suporte para múltiplas contas
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-altus/logo.png
category: files & productivity
version: "5.4.0"
port: 3344
description: >-
  📱 Altus é um poderoso cliente WhatsApp baseado em Electron que aprimora a experiência do WhatsApp no ​​desktop adicionando uma variedade de recursos extras. Usando a estrutura Electron desenvolvida pelo GitHub, a Altus integra o WhatsApp Web ao mesmo tempo em que adiciona funcionalidades que vão além do que o WhatsApp Web padrão oferece. Um dos destaques do Altus é o suporte para múltiplas contas do WhatsApp, permitindo aos usuários gerenciar e alternar entre diferentes contas simultaneamente.


  O aplicativo também oferece suporte de notificação nativo, para que os usuários sejam notificados instantaneamente quando novas mensagens chegarem. Clicar em uma notificação abre o chat correspondente diretamente. Um útil indicador online mostra no canto inferior esquerdo de cada chat se o contato está online no momento, facilitando a comunicação. Para uma experiência mais confortável com pouca luz ou à noite, a Altus oferece um Modo Escuro que reduz o cansaço visual e adapta o design do aplicativo às condições de iluminação.


  Além disso, a Altus permite que os usuários personalizem totalmente sua interface do WhatsApp. Eles podem criar temas personalizados escrevendo seu próprio CSS ou usando o personalizador de tema integrado, que permite fácil seleção de cores para personalizar a aparência do aplicativo. Essa flexibilidade na personalização da interface garante uma experiência de usuário mais personalizada e confortável. A Altus oferece assim não apenas uma solução prática, mas também altamente personalizável para WhatsApp no ​​desktop.
developer: Aman Harwara
