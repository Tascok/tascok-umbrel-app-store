name: Atomify
tagline: Um criador de atmosfera ambiente personalizável
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-atomify/logo.png
category: media
version: "0.0.1"
port: 3821
description: >-
  🌌 Atmoify é um gerador de som ambiente baseado na web projetado para ajudá-lo a criar uma atmosfera pessoal para concentração, relaxamento ou sono. Ele oferece uma interface limpa e intuitiva onde os usuários podem combinar várias fontes de áudio em uma experiência sonora perfeita. Um de seus principais recursos é a capacidade de reproduzir vídeos do YouTube no modo somente áudio, permitindo uma seleção infinita de música de fundo, sons da natureza ou ruído branco sem a distração visual. Além da integração com o YouTube, o Atmoify inclui uma coleção de efeitos ambientais integrados, como chuva, vento, lareira ou ondas do mar, que podem ser dispostos em camadas e ajustados individualmente em volume.


  O aplicativo permite criar e salvar perfis sonoros personalizados, facilitando o retorno à sua paisagem sonora preferida a qualquer momento. Um cronômetro integrado permite definir uma duração para a reprodução, o que é especialmente útil para sessões de trabalho, meditação ou adormecer. Com foco na simplicidade e no áudio que melhora o humor, o Atmoify oferece um espaço tranquilo e sem distrações, adaptado às suas necessidades.
