description: >-
  🔐 Infisical é um aplicativo projetado para gerenciar e distribuir com segurança dados de configuração confidenciais, como segredos, variáveis ​​de ambiente, chaves de API, tokens e credenciais. Ele fornece um sistema centralizado onde os segredos são armazenados de forma criptografada e entregues aos aplicativos somente quando necessário em tempo de execução.


  O aplicativo se concentra em manter dados confidenciais fora dos arquivos de configuração dos repositórios de código-fonte e de outros locais inseguros. Os segredos são criptografados antes do armazenamento e permanecem protegidos durante todo o seu ciclo de vida, garantindo que apenas usuários e sistemas autorizados possam acessá-los. O controle de acesso é feito por meio de permissões detalhadas, permitindo que as equipes definam quem pode visualizar, editar ou usar segredos específicos.


  O Infisical organiza os segredos por projetos e ambientes para que as aplicações possam receber os valores corretos dependendo do seu contexto. Ele suporta controle de versão, o que torna possível rastrear alterações, reverter para valores anteriores e auditar como os segredos evoluem ao longo do tempo. Isso ajuda a reduzir o risco de configuração incorreta acidental e simplifica a rotação secreta.


  O aplicativo também fornece mecanismos para injetar segredos diretamente nos processos em execução, para que os aplicativos possam consumi-los como variáveis ​​de ambiente padrão sem expô-los em arquivos de texto simples. Essa abordagem melhora a segurança e ao mesmo tempo mantém os fluxos de trabalho do desenvolvedor simples e previsíveis.


  No geral, o Infisical atua como uma ponte segura entre dados confidenciais e aplicativos, garantindo a integridade da confidencialidade e o acesso controlado, ao mesmo tempo que elimina a necessidade de codificar segredos ou gerenciá-los manualmente.
