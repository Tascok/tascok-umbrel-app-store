description: >-
  📝 Poznote é um aplicativo limpo e focado, projetado para ajudar os usuários a capturar, estruturar e refinar informações em um espaço de trabalho flexível. Ele combina um editor de rich text com formatação Markdown para suportar anotações rápidas e escritas longas, permitindo que os pensamentos cresçam e mudem sem atrito.


  A interface incentiva a organização fluida por meio de tags, pesquisa e espaços de trabalho personalizáveis ​​para que as ideias permaneçam fáceis de encontrar, mesmo à medida que a coleção se expande. Poznote suporta anexos de imagens, documentos e outros arquivos, tornando possível manter o material relacionado reunido em uma única nota.


  Inclui ferramentas para criar listas de verificação, tarefas e lembretes que se integram diretamente ao fluxo de escrita, em vez de parecerem módulos separados. Uma ferramenta integrada de desenho e diagramação alimentada por uma integração Excalidraw permite aos usuários esboçar conceitos, criar gráficos ou visualizar ideias junto com o texto.


  As notas podem ser editadas, restauradas da lixeira, exportadas para proteção ou duplicadas para atuar como modelos para estruturas recorrentes. Poznote visa criar um ambiente de escrita onde texto, mídia, ideias e tarefas coexistam naturalmente, oferecendo uma forma simplificada de gerenciar informações com clareza e continuidade.
