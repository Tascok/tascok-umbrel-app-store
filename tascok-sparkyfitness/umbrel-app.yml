releaseNotes: >-
  This release focuses on improvements to the mobile app, including a workaround to install the iOS app via AltStore and updated app icons. 


  Several fixes and updates were made to the iOS and GitHub workflows to improve reliability and permissions. 


  The mobile app currently needs to be re-signed every 7 days unless a paid Apple Developer account is used. An official App Store release is planned once the mobile apps are stable.
