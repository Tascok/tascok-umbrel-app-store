releaseNotes: >-
  This update brings a wave of new tutorials and tools, including a reusable Team component built with Next.js and Shadcn, a Grocery Tracker app using Vue and Supabase, and the new SupaWP plugin for seamless WordPress integration. You’ll also find deep dives into multi-tenancy with Clerk, building AI agents powered by n8n and Supabase, setting up custom SMTP for authentication, and using Supabase MCP in VSCode, Cursor, and Agno. 


  On the platform side, Supabase now supports project-scoped roles for all Team plans, has released a new SOC 2 report, and published comprehensive documentation outlining its security practices.
