manifestVersion: 1
id: tascok-freetube
name: FreeTube
tagline: Um aplicativo de código aberto do YouTube para privacidade
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-freetube/logo.png
category: media
version: "v0.23.1-beta"
port: 3422
description: >-
  FreeTube é um cliente de código aberto do YouTube projetado para fornecer uma experiência de visualização mais privada e sem anúncios. Ao contrário do site ou aplicativo oficial do YouTube, o FreeTube permite que os usuários assistam a vídeos sem serem rastreados pelo Google, pois não requer uma conta do Google para funcionar. Em vez de depender dos mecanismos de rastreamento do Google, o FreeTube armazena assinaturas, histórico de exibição e playlists localmente no dispositivo do usuário, garantindo que os dados pessoais permaneçam privados.


  Uma das principais vantagens do FreeTube é a capacidade de bloquear anúncios nativamente, eliminando a necessidade de extensões de navegador adicionais ou bloqueadores de anúncios. Ele consegue isso buscando conteúdo de vídeo diretamente do YouTube, ignorando scripts de rastreamento e elementos indesejados. O software também oferece aos usuários a escolha entre usar a API oficial do YouTube ou o Invidious, uma interface alternativa que oferece um nível ainda maior de privacidade.


  A interface do FreeTube foi projetada para se assemelhar à experiência familiar do YouTube, ao mesmo tempo que permanece leve e personalizável. Os usuários podem organizar suas assinaturas, navegar pelos vídeos mais populares e explorar o conteúdo da mesma forma que fariam na plataforma oficial. Para aqueles que priorizam a privacidade online, mas ainda desejam acesso à vasta biblioteca de conteúdo do YouTube, o FreeTube serve como uma excelente alternativa, oferecendo uma experiência de visualização contínua, não intrusiva e sem anúncios.


  🔑 Por padrão, o nome de usuário é “admin” e a senha é “umbrel”.
