version: "11.3.0"
port: 3384
description: >-
  Grafana é uma plataforma de análise e monitoramento de código aberto projetada para visualizar dados de séries temporais. Ele permite que os usuários criem painéis dinâmicos e personalizáveis ​​que ajudam a rastrear e analisar métricas de várias fontes de dados em tempo real. Com sua interface de usuário intuitiva e recursos poderosos, o Grafana é amplamente utilizado em todos os setores para monitorar aplicativos, infraestrutura e métricas de negócios.


  Principais recursos e casos de uso:


  💾 Integração de fontes de dados: Grafana oferece suporte a uma ampla variedade de fontes de dados, incluindo Prometheus, InfluxDB, Graphite, Elasticsearch, MySQL, PostgreSQL e muito mais. Essa flexibilidade permite que os usuários extraiam dados de vários sistemas e os consolidem em um único painel.


  🎛️ Painéis personalizáveis: os usuários podem criar painéis visualmente atraentes e interativos com vários tipos de painéis, como gráficos, tabelas, mapas de calor e muito mais. Cada painel pode ser personalizado para exibir métricas específicas, permitindo que os usuários adaptem os painéis às suas necessidades.


  🚨 Alertas: o Grafana fornece recursos robustos de alerta que notificam os usuários sobre possíveis problemas em seus dados. Os alertas podem ser configurados com base em condições específicas e as notificações podem ser enviadas por e-mail, Slack, PagerDuty e outros canais.


  🧩 Modelos: os usuários podem criar modelos reutilizáveis ​​para filtrar e manipular dados dinamicamente. Este recurso é particularmente útil para criar painéis que precisam exibir informações de diversas entidades ou ambientes.


  📌 Anotações: Grafana permite aos usuários adicionar anotações aos gráficos, fornecendo contexto para eventos específicos ou alterações nos dados. Esse recurso ajuda as equipes a compreender o impacto de implantações, incidentes ou outros eventos significativos.


  🔐 Gerenciamento e permissões de usuários: Grafana inclui recursos de autenticação e autorização de usuários, permitindo que as organizações gerenciem o acesso a painéis e fontes de dados de maneira eficaz. O controle de acesso baseado em função garante que os usuários tenham as permissões apropriadas com base em suas responsabilidades.


  📦 Plugins e Extensões: Grafana possui um rico ecossistema de plugins que ampliam sua funcionalidade. Os usuários podem encontrar plug-ins para fontes de dados adicionais, tipos de visualização e integrações com outras ferramentas.


  📤 Compartilhamento e Colaboração: Os painéis podem ser facilmente compartilhados com membros da equipe ou partes interessadas, seja por meio de links diretos ou incorporados em outros aplicativos. Grafana também oferece suporte a instantâneos de painéis para compartilhar visualizações estáticas.


  🚦 Monitoramento de infraestrutura: acompanhe a integridade e o desempenho de servidores, bancos de dados e dispositivos de rede.


  📊 Monitoramento de desempenho de aplicativos (APM): visualize métricas de aplicativos para identificar gargalos e otimizar o desempenho.


  🧮 Métricas de negócios: monitore os principais indicadores de desempenho (KPIs) e outras métricas de negócios para orientar a tomada de decisões.


  📈 Visualização de dados IoT: analise e visualize dados de dispositivos IoT em tempo real.


  Grafana é uma ferramenta poderosa para quem deseja obter insights sobre seus dados por meio de visualização e monitoramento. Sua flexibilidade, facilidade de uso e amplo conjunto de recursos o tornam uma escolha popular para organizações de todos os tamanhos. Esteja você monitorando infraestrutura, aplicativos ou métricas de negócios, o Grafana fornece as ferramentas necessárias para visualizar e analisar seus dados de maneira eficaz.


  🗝️ As credenciais de login padrão do Grafana são nome de usuário: “admin” e senha: “admin”. Altere a senha padrão imediatamente após seu primeiro login para aumentar a segurança.
