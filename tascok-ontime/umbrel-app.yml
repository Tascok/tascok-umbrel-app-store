name: Ontime
tagline: Uma ferramenta modular para automação de tempo
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-ontime/logo.png
category: files & productivity
version: "4.1.0"
port: 4101
description: >-
  ⏱️ Ontime é um aplicativo avançado de gerenciamento de eventos e shows projetado para criar, organizar e controlar cronogramas de produção precisos. Ele fornece um ambiente em tempo real onde as equipes podem planejar todos os aspectos de um evento ao vivo, desde o resumo inicial até a sugestão final, enquanto mantêm controle total sobre o tempo e a coordenação. Cada elemento de um evento pode ser agendado com durações, horários de início e transições exatos, permitindo que cada participante permaneça sincronizado e ciente do que acontece a seguir.


  O aplicativo permite a colaboração perfeita entre produtores, gerentes de palco e técnicos, atualizando instantaneamente todos os dispositivos conectados quando alterações são feitas. Sua interface flexível permite que os usuários criem resumos de exibição complexos que exibem os segmentos atuais, próximos e concluídos com contagens regressivas precisas e indicadores de progresso. Isso garante que todos os envolvidos em uma produção permaneçam alinhados, reduzindo erros e confusões de última hora em momentos críticos.


  Ontime também oferece suporte à comunicação visual em diferentes visualizações, mostrando cronômetros, mensagens e dicas personalizadas para funções específicas em uma produção. Um diretor pode monitorar o progresso geral enquanto um operador de palco ou apresentador recebe apenas informações de tempo relevantes. Esta adaptabilidade o torna ideal para concertos, transmissões, conferências e qualquer tipo de performance ao vivo que exija sincronização perfeita.


  Ao focar na precisão do tempo, na colaboração e na clareza, o Ontime transforma o planejamento de eventos complexos em um processo estruturado e controlado. Ajuda as equipes criativas a manter o foco, antecipar ações futuras e fornecer resultados perfeitamente sincronizados, mesmo em ambientes ao vivo de alta pressão.


  ⚙️ Portas OSC


  Ontime suporta Open Sound Control (OSC) — um protocolo comumente usado em ambientes de palco, estúdio e ao vivo para enviar e receber comandos em tempo real entre dispositivos.


  - Porta 4088 (UDP) – Porta de Controle OSC: recebe comandos de controle de dispositivos externos ou software.


  - Porta 4099 (UDP) – Porta de feedback OSC: envia atualizações de status e dados de temporização de volta aos sistemas conectados.
