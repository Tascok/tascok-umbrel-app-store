manifestVersion: 1
id: tascok-noflux
name: Noflux
tagline: Um leitor de feed descentralizado simples desenvolvido pela Nostr
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-noflux/logo.png
category: files & productivity
version: "0.1.0"
port: 8064
description: >-
  📡 Noflux é um leitor de feeds descentralizado baseado no protocolo Nostr. Ele permite que os usuários assinem e acompanhem feeds, de forma semelhante aos leitores RSS tradicionais, mas com os benefícios adicionais de descentralização e resistência à censura. Noflux aproveita o protocolo Nostr para distribuir e receber conteúdo, garantindo que a plataforma permaneça independente de servidores centralizados.


  Ao usar o Nostr, o Noflux oferece aos usuários uma maneira de consumir e compartilhar notícias, postagens e artigos, mantendo controle total sobre seus dados. Essa abordagem descentralizada garante que o conteúdo não possa ser facilmente censurado ou manipulado, proporcionando aos usuários uma forma mais segura e privada de interagir com feeds na web.


  Em essência, o Noflux é um leitor de feeds moderno que combina a funcionalidade do RSS tradicional com o poder da descentralização, oferecendo uma experiência resistente à censura e controlada pelo usuário para consumir e compartilhar conteúdo.


  🔑 Por padrão, o nome de usuário é “admin” e a senha é “umbrel”.
developer: fiatjaf
