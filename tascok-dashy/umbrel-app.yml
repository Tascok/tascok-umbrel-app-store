name: Dashy
tagline: Um painel pessoal criado para você
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-dashy/logo.png
category: files & productivity
version: "3.1.1"
port: 4444
description: >-
  Dashy é um aplicativo de painel moderno e altamente personalizável, projetado para servir como um hub central para gerenciar e acessar todos os seus serviços, ferramentas e links da web auto-hospedados. É comumente usado em ambientes homelab, onde os usuários executam vários serviços em servidores pessoais e precisam de uma maneira visualmente atraente e eficiente de monitorá-los e iniciá-los a partir de uma única interface.


  Basicamente, Dashy fornece uma interface web elegante e responsiva onde os usuários podem organizar seus recursos usando um arquivo de configuração baseado em YAML ou um editor de configuração integrado. A interface oferece suporte a temas, ícones, widgets dinâmicos e indicadores de status de serviço, permitindo aos usuários personalizar a experiência de acordo com suas necessidades. Ele oferece suporte a tudo, desde blocos de links simples até integrações mais avançadas, incluindo monitoramento de contêiner Docker, verificações de tempo de atividade de serviço e incorporação direta de aplicativos externos por meio de iframes.


  Construído usando tecnologias web modernas como Vue.js, Dashy é leve, mas poderoso, oferecendo tempos de carregamento rápidos e uma experiência amigável em desktops e dispositivos móveis. Ele é executado como um aplicativo da web independente, geralmente implantado em contêineres Docker, facilitando a integração em configurações existentes sem a necessidade de dependências pesadas. Os usuários podem configurá-lo atrás de um proxy reverso para acesso remoto seguro e, por ser totalmente de código aberto, é ideal para quem deseja controle total sobre sua infraestrutura sem depender de painéis ou portais de terceiros.


  Dashy também inclui um recurso de pesquisa integrado que permite aos usuários consultar marcadores, serviços internos ou até mesmo acionar mecanismos de pesquisa externos diretamente do painel. Com foco em auto-hospedagem, personalização e facilidade de uso, Dashy se tornou uma escolha popular entre desenvolvedores, administradores de sistema e entusiastas de tecnologia que buscam trazer ordem e eficiência a seus ambientes digitais cada vez mais complexos.
