description: >-
  🌐 Ungoogled Chromium é um navegador de código aberto baseado em Chromium, projetado com privacidade e segurança em mente. Ao contrário do navegador padrão Chromium ou Google Chrome, o Ungoogled Chromium elimina todas as integrações com os serviços do Google e remove vários recursos de rastreamento e coleta de dados. O objetivo é fornecer um navegador rápido e totalmente funcional, ao mesmo tempo que protege a privacidade do usuário, removendo a influência do Google, incluindo recursos como sincronização automática com contas do Google, APIs específicas do Google e coleta de dados de telemetria.


  Esta versão do Chromium oferece aos usuários uma experiência de navegação semelhante ao Chrome do Google, mas com maior ênfase no controle do usuário e na proteção de dados. É altamente personalizável e oferece uma ampla gama de ferramentas para usuários preocupados com a privacidade, incluindo gerenciamento aprimorado de cookies, bloqueio de conteúdo mais forte e rastreamento reduzido.


  Quando integrado como um aplicativo no Umbrel, o Ungoogled Chromium pode servir como um navegador que respeita a privacidade que os usuários podem acessar diretamente da configuração do servidor Umbrel. Esta integração garantiria que todas as atividades de navegação fossem conduzidas com maior segurança e sem dependência dos mecanismos de recolha de dados do Google. Além disso, ao executar o navegador no ambiente Umbrel, os usuários podem se beneficiar da conveniência de usar seu servidor pessoal como um gateway seguro para navegação, ao mesmo tempo que mantêm controle total sobre sua presença online.
