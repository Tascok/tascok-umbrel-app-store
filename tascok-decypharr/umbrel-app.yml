id: tascok-decypharr
name: Decypharr
tagline: Uma solução avançada para downloads automatizados do Debrid
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-decypharr/logo.png
category: files & productivity
version: "1.0.2"
port: 8282
description: >-
  🧩 Decypharr é um aplicativo de código aberto escrito em Go que atua como uma API compatível com qBittorrent enquanto integra suporte para serviços Debrid populares, como Real Debrid, All Debrid, Torbox e Debrid Link. Ele foi projetado para integração perfeita com ferramentas de automação como Sonarr, Radarr e Lidarr, que podem interagir com ele como se fosse um cliente qBittorrent padrão. Isso permite que os usuários automatizem o processo de download de torrents por meio de suas contas Debrid premium sem a necessidade de executar um cliente de torrent tradicional ou manter sua própria seedbox.


  A principal funcionalidade do Decypharr centra-se na interceptação de links torrent e magnéticos das ferramentas de automação conectadas e na sua transmissão para os serviços Debrid configurados. Esses serviços gerenciam o download de torrents em sua própria infraestrutura e fornecem links diretos para download que o Decypharr gerencia localmente. O software inclui uma interface de usuário web simples e funcional que oferece aos usuários a capacidade de monitorar e gerenciar o status de seus downloads.


  Além de sua compatibilidade com API e integração com Debrid, o Decypharr oferece um servidor WebDAV integrado para acessar arquivos baixados, bem como um gerenciador de links simbólicos que garante que os arquivos sejam vinculados corretamente para atualizações da biblioteca de mídia. Também inclui reparadores que verificam links simbólicos ausentes ou quebrados e os corrigem automaticamente, proporcionando uma experiência confiável, especialmente ao lidar com grandes bibliotecas automatizadas. Decypharr é mantido ativamente e oferece uma alternativa moderna para ferramentas mais antigas como Zurg, combinando velocidade, simplicidade e recursos avançados como WebDAV e reparo de link simbólico em uma única solução.


  ⚙️ Para configuração, você deve visitar a documentação oficial em:


  https://sirrobot01.github.io/decypharr/.
