description: >-
  Lucky é um software versátil de gerenciamento de rede originalmente desenvolvido por engenheiros como uma alternativa ao Socat, implementado pela primeira vez no roteador Xiaomi AX6000. O software visa fornecer aos usuários uma solução acessível e fácil de usar para gerenciar sua infraestrutura de rede, especialmente para dispositivos embarcados em Linux. Lucky simplifica o uso de recursos de segurança de rede e permite o redirecionamento de endereços IPv6 públicos para endereços IPv4 da intranet, o que é particularmente útil para residências ou pequenas empresas com necessidades específicas de rede.


  O programa principal do Lucky é desenvolvido em Golang, o que confere ao software alta eficiência, estabilidade e compatibilidade entre plataformas. Para o frontend, Lucky utiliza Vue 3.2, garantindo uma interface amigável e responsiva. O sistema também utiliza uma arquitetura de separação frontend-backend, permitindo que serviços de terceiros como OpenToken integrem facilmente APIs.


  Um dos principais recursos do Lucky é o encaminhamento de porta, que permite aos usuários encaminhar o tráfego TCP/UDP de endereços IPv6 públicos para endereços IPv4 internos. As regras de encaminhamento podem ser criadas, editadas e ativadas ou desativadas de maneira flexível com base em uma programação. Segurança adicional é fornecida pela integração de modos de segurança como Whitelist e Blacklist, que permitem aos usuários controlar o acesso e permitir apenas conexões autorizadas.


  Outro recurso notável é o suporte para DNS Dinâmico (DDNS), permitindo aos usuários integrar vários provedores de DNS, como Cloudflare, GoDaddy e muitos outros. Por meio de funções personalizáveis ​​de retorno de chamada e webhook, os usuários podem automatizar e otimizar suas configurações de DNS. Além disso, Lucky oferece recursos abrangentes de serviços da web, incluindo suporte para proxy reverso, encaminhamento de URL e funcionalidade de lista branca/lista negra de IP. Esses recursos permitem o gerenciamento seguro e fácil de aplicativos da web e fácil integração com serviços externos.


  Lucky vai ainda mais longe ao permitir a penetração na intranet sem a necessidade de um endereço IPv4 público, o que é particularmente útil para redes com configurações NAT. Além disso, o software permite o controle remoto de dispositivos e a integração com plataformas de Internet das Coisas (IoT), permitindo aos usuários controlar seus dispositivos remotamente. A automação de tarefas também é suportada, permitindo aos usuários criar e gerenciar visualmente tarefas agendadas.


  Para usuários que lidam com gerenciamento de certificados, Lucky oferece a capacidade de solicitar e renovar automaticamente certificados ACME, oferecendo uma solução fácil e segura para criptografia SSL/TLS. Por fim, Lucky também oferece uma solução para gerenciamento de armazenamento em rede integrando diversos serviços de arquivos como WebDAV e FTP, permitindo aos usuários integrar recursos de armazenamento adicionais em sua infraestrutura.


  Com esta combinação de recursos versáteis, facilidade de uso e desenvolvimento contínuo, Lucky tornou-se uma ferramenta confiável para gerenciar e otimizar infraestruturas de rede. Ele atende tanto a desenvolvedores experientes quanto a usuários menos técnicos que procuram uma maneira fácil de gerenciar e proteger seus recursos de rede.
