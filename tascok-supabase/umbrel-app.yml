description: >-
  🐊 Supabase é uma plataforma de backend como serviço de código aberto que fornece aos desenvolvedores uma infraestrutura poderosa e escalonável para a construção de aplicativos móveis e web modernos. Ele oferece um conjunto de ferramentas que combinam a conveniência de um back-end tradicional com a flexibilidade e o controle de uma pilha de código aberto. Construído com base no PostgreSQL, o Supabase adiciona recursos em tempo real, APIs instantâneas e autenticação de usuário sem exigir que os desenvolvedores escrevam lógica de back-end complexa.


  Basicamente, o Supabase transforma um banco de dados Postgres em uma solução de back-end completa. Quando uma nova tabela é criada no banco de dados, uma API RESTful e em tempo real é gerada automaticamente, facilitando a interação com os dados do frontend. Isso reduz o tempo de desenvolvimento e elimina a necessidade de código de back-end repetitivo. Os desenvolvedores podem gerenciar seus dados, rastrear alterações em tempo real e até assinar eventos de banco de dados diretamente do cliente.


  A autenticação é outra parte essencial do Supabase. Inclui um sistema completo de gerenciamento de usuários com recursos como login por e-mail e senha, provedores OAuth terceirizados e links mágicos. Todos os eventos de autenticação são integrados diretamente no banco de dados, dando aos desenvolvedores total controle e visibilidade sobre o comportamento do usuário e as regras de acesso.


  O armazenamento é tratado com simplicidade semelhante. Supabase oferece uma solução de armazenamento de arquivos que suporta uploads e downloads seguros, integra-se a políticas de acesso e pode ser gerenciado inteiramente a partir do painel ou por meio de chamadas de API. É particularmente útil para armazenar arquivos de mídia, documentos e outros ativos estáticos relacionados a um aplicativo.


  O painel Supabase fornece uma interface amigável para gerenciar cada parte do backend. Ele permite que os desenvolvedores naveguem em seu banco de dados, executem consultas SQL, definam configurações de autenticação, gerenciem o armazenamento de arquivos e monitorem o uso em tempo real. Ele combina facilidade de uso com funcionalidade profunda, tornando-o acessível para iniciantes e ao mesmo tempo poderoso o suficiente para usuários avançados.


  No geral, o Supabase capacita os desenvolvedores a criar aplicativos prontos para produção com mais rapidez, abstraindo a complexidade do desenvolvimento de back-end e preservando a flexibilidade para personalizar e dimensionar conforme necessário.


  ⚠️ Certifique-se de seguir as etapas de configuração após instalar o Supabase: https://github.com/dennysubke/dennys-umbrel-app-store/blob/master/tascok-supabase/README.md
