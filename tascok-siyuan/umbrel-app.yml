name: SiYuan
tagline: Um sistema de gerenciamento de conhecimento pessoal que prioriza a privacidade
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-siyuan/logo.png
category: files & productivity
version: "3.1.28"
port: 6806
description: >-
  📚 SiYuan é um sistema de gerenciamento de conhecimento pessoal (PKM) poderoso e focado na privacidade, projetado para usuários que valorizam o controle total sobre seus dados. Ao contrário de muitos aplicativos convencionais de anotações que dependem fortemente de armazenamento em nuvem e acesso online, o SiYuan é construído em torno do princípio de armazenamento de dados local e acessibilidade offline. Basicamente, ele emprega um editor baseado em blocos, que permite aos usuários estruturar e interconectar seu conteúdo de uma forma altamente flexível e modular. Essa abordagem oferece suporte a referências refinadas e links bidirecionais entre blocos, incentivando os usuários a construir gráficos de conhecimento ricos e inter-relacionados.


  A experiência do usuário no SiYuan gira em torno de um editor WYSIWYG que preserva a simplicidade do Markdown enquanto o aprimora com recursos avançados, como fórmulas matemáticas, diagramas, fluxogramas, gráficos de Gantt e notação musical. Ele suporta importação e anotação de PDFs, recorte de conteúdo da web e incorporação de vários tipos de mídia, tornando-o adequado não apenas para escrever notas, mas também para gerenciar pesquisas, documentação e projetos criativos. SiYuan também inclui um sistema de repetição espaçada integrado, permitindo aos usuários transformar suas anotações em cartões para retenção de memória de longo prazo.


  Uma das características distintivas da SiYuan é o seu compromisso com a privacidade. Todos os dados permanecem armazenados localmente por padrão e, mesmo quando os usuários optam por sincronizar seus dados entre dispositivos, o SiYuan oferece criptografia ponta a ponta por meio de soluções hospedadas pelo usuário, como S3 ou WebDAV. Isso garante que nenhum terceiro possa acessar o conteúdo das notas de um usuário, mesmo durante a sincronização. Para aqueles que preferem uma experiência mais integrada, a SiYuan oferece serviços opcionais baseados em nuvem, disponíveis sob licença única ou vitalícia, sem comprometer sua filosofia central de autonomia do usuário e propriedade de dados.


  Além da sua robustez funcional, o SiYuan é altamente extensível. Possui um sistema de plugins e temas, permitindo aos usuários personalizar e aprimorar seus fluxos de trabalho. O projeto é de código aberto e mantido ativamente, com uma comunidade crescente de colaboradores e usuários que continuam a expandir suas capacidades. No geral, o SiYuan é adequado para quem procura uma ferramenta abrangente, personalizável e que respeite a privacidade para gerenciar conhecimento pessoal, escrever documentos e construir um segundo cérebro de longo prazo.
