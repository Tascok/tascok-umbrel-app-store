description: >-
  Planka é um software de gerenciamento de projetos de código aberto que oferece às equipes uma maneira eficiente de organizar tarefas e acompanhar o andamento de seus projetos. É baseado no princípio do quadro Kanban, visualizando tarefas em colunas como “A fazer”, “Em andamento” e “Concluído”. Esse método torna mais fácil para as equipes acompanharem seu trabalho e moverem as tarefas entre os estágios à medida que progridem.


  Alguns dos principais recursos do Planka incluem:


  👁️ ️Gerenciamento visual de tarefas: os usuários podem criar tarefas na forma de cartões, que podem ser facilmente movidos entre diferentes colunas usando a funcionalidade de arrastar e soltar.


  ⏱️ Colaboração em tempo real: o Planka permite que vários usuários trabalhem no mesmo quadro simultaneamente, facilitando a colaboração da equipe em tempo real.


  ⚙️ Tarefas personalizáveis: As tarefas podem receber datas de vencimento, rótulos e prioridades para garantir que todos na equipe permaneçam organizados.


  😊 Design fácil de usar: Apesar de sua gama de recursos, o Planka permanece simples e intuitivo, tornando-o adequado para pequenas equipes e projetos.


   Auto-hospedagem: Planka foi projetado para ser hospedado em seus próprios servidores, oferecendo maior privacidade e controle sobre seus dados.

   Como alternativa às ferramentas comerciais de gerenciamento de projetos como Trello ou Jira, o Planka é particularmente atraente para equipes que procuram um sistema flexível, personalizável e seguro. Ele se integra perfeitamente a ambientes como Docker ou plataformas como Umbrel e pode ser adaptado às necessidades específicas da equipe.

   Planka é uma excelente escolha para organizações e equipes que valorizam transparência, facilidade de uso e colaboração em tempo real sem depender de soluções de software proprietárias.


   🔑 Para fazer login pela primeira vez, use as seguintes credenciais:
   
   E-mail: umbrel@planka.login
   Senha: umbrelpass

  🚨 Lembre-se de alterar a senha após seu login inicial.

