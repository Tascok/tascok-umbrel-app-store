releaseNotes: >-
  Version 0.49.1 of Changedetection includes several fixes and improvements, such as fixing custom header parsing, adding Jinja2/browsersteps tests, and supporting multiple semver tags for Docker releases. Additionally, it handles ByteOrderMark in JSON strings and updates Italian translations for the "stock-not-in-stock.js" file.
