manifestVersion: 1
id: tascok-vocechat
name: VoceChat
tagline: Uma solução de chat segura para comunicação com foco na privacidade
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-vocechat/logo.png
category: social
version: "0.4.0"
port: 3197
description: >-
  💬VoceChat é uma plataforma de bate-papo auto-hospedada de código aberto, projetada para oferecer uma solução leve e eficiente para mensagens em tempo real. O objetivo é fornecer uma alternativa fácil de usar para indivíduos, pequenas equipes e comunidades que desejam um espaço de comunicação privado e seguro. Ao contrário dos principais serviços de mensagens, o VoceChat permite aos usuários hospedar seu próprio servidor, garantindo controle total sobre seus dados e comunicações.


  A plataforma oferece suporte a recursos essenciais de mensagens, como mensagens diretas, bate-papos em grupo e canais, todos desenvolvidos com segurança e privacidade em mente. O VoceChat se concentra em oferecer uma experiência de usuário perfeita sem comprometer o desempenho, tornando-o ideal para quem prefere serviços descentralizados em vez de plataformas centralizadas.


  Com o VoceChat, os usuários podem gerenciar facilmente sua própria infraestrutura de chat, sem depender de servidores ou serviços de terceiros. A documentação oficial fornece instruções completas sobre como instalar, configurar e usar a plataforma, tornando-a acessível tanto para iniciantes quanto para usuários avançados. Esteja você procurando construir uma sala de chat privada para sua equipe ou um espaço seguro para uma comunidade maior, o VoceChat é uma opção flexível e personalizável.


  🌐 Configuração HTTPS: A versão do VoceChat para navegador pode operar em http, mas o aplicativo móvel requer https. Você pode configurar https usando o aplicativo Cloudflare Tunnel disponível na app store. Instruções detalhadas para configurar o túnel podem ser encontradas aqui: https://github.com/Radiokot/umbrel-cloudflared/wiki/How-to-set-up-Cloudflare-Tunnel-on-your-Umbrel
developer: The Privoce Project
