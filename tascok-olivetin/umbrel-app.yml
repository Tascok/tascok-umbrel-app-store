manifestVersion: 1
id: tascok-olivetin
name: OliveTin
tagline: Um centro de comando que cabe no seu navegador
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-olivetin/logo.png
category: networking
version: "2025.6.22"
port: 8951
description: >-
  🫒 OliveTin fornece uma interface web simples para executar comandos shell predefinidos por meio de botões, formulários e menus suspensos. Ele transforma scripts personalizados e operações do sistema em ações da web fáceis de usar, sem expor o terminal. Os usuários interagem com uma interface de usuário limpa, onde cada ação é claramente identificada e opcionalmente configurável com parâmetros. Os comandos são definidos em um arquivo YAML, permitindo fácil configuração e personalização. OliveTin garante acesso seguro e controlado, validando entradas e suportando vários métodos de autenticação. É ideal para tarefas como reiniciar serviços, gerenciar contêineres, monitorar o status do sistema ou executar scripts com apenas um clique.


  🛠️ Para personalizar as ações disponíveis, abra o aplicativo Arquivos no Umbrel e navegue até apps → tascok-olivetin → config. Dentro, você encontrará um arquivo config.yaml onde poderá definir ou modificar os comandos mostrados na interface web.
