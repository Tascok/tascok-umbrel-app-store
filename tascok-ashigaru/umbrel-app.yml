description: >-
  🥷 Ashigaru Terminal é um aplicativo baseado em terminal que permite aos usuários participar de ciclos Whirlpool CoinJoin com o objetivo de fortalecer a privacidade nas transações Bitcoin. Ele fornece uma maneira simplificada de entrar no processo Whirlpool construindo transações Tx0, que atuam como porta de entrada para pools de mistura. Depois que um Tx0 é criado, o aplicativo se coordena com o sistema Whirlpool para embaralhar moedas junto com as de outros participantes. Essa mistura deliberada obscurece a relação direta entre entradas e saídas de transações, quebrando assim links rastreáveis ​​no blockchain.


  O aplicativo foi projetado para fornecer aos usuários controle total de suas próprias carteiras e chaves durante todo o processo. Nada é compartilhado além do estritamente necessário para a participação no CoinJoins, garantindo que informações confidenciais, como chaves públicas mestras ou estruturas de carteira, permaneçam privadas. Este princípio de autocustódia está no cerne do Terminal Ashigaru, posicionando-o como uma ferramenta de preservação da privacidade e não como um serviço de custódia.


  A privacidade na camada de rede também é enfatizada. As conexões são roteadas por meio do Tor por padrão, o que impede que os observadores vinculem a atividade a um endereço IP específico e torna significativamente mais difícil correlacionar o comportamento da carteira entre as sessões. Os usuários mantêm a flexibilidade de se conectar através de seus próprios servidores Electrum, se desejarem, mas o design subjacente pressupõe um modelo de ameaça em que o anonimato e a resistência ao rastreamento são fundamentais.


  A experiência do usuário é intencionalmente minimalista, contando com uma interface de texto limpa em vez de um ambiente gráfico. Essa abordagem simplifica a tarefa de participar do CoinJoins, evitando distrações ou recursos desnecessários. O foco permanece inteiramente em iniciar mixagens, circular moedas através de pools e reforçar o conjunto de anonimato. Ao manter essa clareza, o Terminal Ashigaru torna mais fácil para os usuários entenderem o que está acontecendo com seus fundos e como o processo contribui para a privacidade.


  No geral, o Terminal Ashigaru atua como uma ferramenta de privacidade dedicada para indivíduos que desejam acesso direto à Whirlpool sem complexidade adicional. Equilibra a simplicidade de utilização com fortes garantias de controlo e anonimato, permitindo aos utilizadores reforçar a confidencialidade das suas transacções Bitcoin através de um processo de mistura eficiente e transparente.


  ⚙️ Para colar conteúdo no terminal web use ‘Ctrl+Shift+V’ no Windows ou Linux, ou ‘Cmd+Shift+V’ no macOS. No LibreWolf ou Tor Browser, pode ser necessário desabilitar o 'resistFingerprinting' para que o terminal web funcione corretamente. Alternativamente, você pode usar um navegador baseado em Chromium, como o Brave. Para conectar-se a um servidor Electrum via Tor no Terminal Ashigaru, insira o endereço .onion do servidor, selecione a porta Electrum correta e habilite o proxy com o endereço 127.0.0.1 e porta 9050.  


  Observe que as atualizações podem não reter as carteiras existentes. Sempre faça backup de sua frase inicial com segurança, especialmente antes de atualizar ou migrar.  


  O Terminal Ashigaru foi projetado para ser usado em combinação com o aplicativo móvel Ashigaru. O único site oficial é 'ashigaru.rs'. Quaisquer outros sites são fraudulentos, assim como indivíduos que afirmam representar Ashigaru nas redes sociais – Ashigaru não tem presença nas redes sociais. Agir sempre com responsabilidade e em conformidade com a lei. Os desenvolvedores não assumem qualquer responsabilidade por suas ações. Faça sua própria pesquisa e tome decisões informadas.  


