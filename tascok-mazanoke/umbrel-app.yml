description: >-
  Mazanoke é um otimizador de imagens focado na privacidade que roda inteiramente no navegador, sem depender de servidores externos. Desenvolvido como um Progressive Web App (PWA), oferece uma experiência offline perfeita e pode ser instalado diretamente no seu dispositivo para acesso rápido.


  O aplicativo permite aos usuários otimizar e converter imagens sem comprometer sua privacidade. Todas as tarefas como ajuste de qualidade, redimensionamento para dimensões específicas, conversão de formatos e compactação de arquivos são realizadas localmente no dispositivo. Os formatos suportados incluem JPEG, PNG, WebP, bem como SVG e GIF que são convertidos em PNGs otimizados.


  Mazanoke apresenta uma interface ágil e intuitiva que funciona perfeitamente em desktops, tablets e smartphones. Ele se adapta automaticamente ao modo claro ou escuro do sistema para uma experiência de usuário confortável.


  Lançado sob a licença GPL 3.0, Mazanoke é de código aberto e feito para pessoas que desejam ferramentas de imagem poderosas, mantendo controle total sobre seus dados.
