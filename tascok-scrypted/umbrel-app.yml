id: tascok-scrypted
name: Scrypted
tagline: Uma plataforma de integração de vídeo doméstico de alto desempenho
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-scrypted/logo.png
category: Home & Automation
version: "0.122.0"
port: 11080
description: >-
  🎥 Scrypted é uma plataforma de código aberto projetada para automação residencial, fornecendo aos usuários as ferramentas para integrar, gerenciar e automatizar vários dispositivos domésticos inteligentes de forma integrada. Seu foco principal está no gerenciamento de câmeras e vigilância por vídeo, tornando-o uma solução ideal para usuários que buscam aprimorar a segurança de sua casa e, ao mesmo tempo, controlar uma ampla variedade de dispositivos inteligentes.


  Scrypted oferece suporte a uma ampla gama de dispositivos domésticos inteligentes de diferentes fabricantes, permitindo que os usuários criem um ecossistema coeso, independentemente da marca ou tecnologia. Essa flexibilidade permite a integração de dispositivos que utilizam protocolos como Zigbee, Z-Wave e Wi-Fi. Um dos recursos de destaque do Scrypted é seu suporte robusto para câmeras IP e streams de vídeo. Os usuários podem integrar facilmente suas câmeras de segurança existentes para visualizar feeds de vídeo ao vivo, gravar e armazenar imagens com base na detecção de movimento ou em intervalos programados e receber notificações instantâneas para eventos de movimento ou outros gatilhos, melhorando assim a segurança doméstica.


  A plataforma permite aos usuários criar automações e cenas personalizadas que conectam vários dispositivos e definem comportamentos específicos com base em gatilhos. Por exemplo, os usuários podem configurar regras que acendem as luzes quando um movimento é detectado ou ajustam o termostato quando a casa está vazia. Scrypted apresenta uma interface web intuitiva que simplifica o gerenciamento e configuração de dispositivos, permitindo que os usuários acessem seu sistema doméstico inteligente a partir de qualquer navegador da web e facilitando o monitoramento e controle remoto de dispositivos.


  Para usuários da Apple, o Scrypted oferece integração perfeita com o HomeKit da Apple. Este recurso permite que os usuários controlem seus dispositivos inteligentes por meio do aplicativo Apple Home, aproveitando o Siri para comandos de voz e automatizando tarefas usando o ecossistema da Apple. Por ser uma plataforma de código aberto, o Scrypted incentiva os desenvolvedores a criar plug-ins e integrações personalizadas. Esta extensibilidade significa que os utilizadores podem adaptar a plataforma às suas necessidades específicas, incluindo o desenvolvimento de novas funcionalidades ou a incorporação de dispositivos de nicho.


  O Scrypted pode ser implantado em diversas plataformas, incluindo Raspberry Pi e Docker, permitindo aos usuários escolher o ambiente que melhor se adapta à sua configuração. Essa flexibilidade o torna acessível tanto para amadores quanto para aqueles que procuram uma solução robusta para casa inteligente. Por ser um projeto de código aberto, o Scrypted possui uma comunidade ativa de usuários e desenvolvedores que contribuem para seu desenvolvimento contínuo, fornecendo suporte, compartilhando ideias e acessando recursos por meio de fóruns e canais comunitários.


  Concluindo, Scrypted se destaca como uma plataforma de automação residencial versátil e poderosa que se destaca no gerenciamento de vídeo e integração de dispositivos. Sua natureza de código aberto, combinada com o foco na experiência do usuário e na extensibilidade, torna-o uma opção atraente para quem deseja aprimorar a configuração de sua casa inteligente. Quer você seja um iniciante em automação residencial ou um desenvolvedor experiente em busca de uma solução flexível, o Scrypted fornece as ferramentas e recursos para atender às suas necessidades.
