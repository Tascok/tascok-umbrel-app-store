manifestVersion: 1
id: tascok-yopass
name: Yopass
tagline: Uma plataforma segura para compartilhar segredos criptografados
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-yopass/logo.png
category: files & productivity
version: "11.17.0"
port: 8193
description: >-
  Yopass é uma ferramenta segura projetada para minimizar senhas de texto não criptografado em e-mail ou bate-papo, criptografando informações confidenciais e gerando um link de curta duração e uso único. Isto aumenta a segurança, garantindo que os segredos partilhados só sejam acessíveis uma vez, reduzindo as hipóteses de acesso não autorizado. 


  Os principais recursos são:


  🔒 Criptografia ponta a ponta usando OpenPGP

  🔥 Os segredos só podem ser visualizados uma vez

  🚫 Não é necessária nenhuma conta ou gerenciamento de usuários

  💣 Segredos se autodestruem após X horas

  🔑 Opção de senha personalizada

  📂 Funcionalidade limitada de upload de arquivos
    
