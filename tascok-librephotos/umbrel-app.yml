releaseNotes: >-
  Version 2025w28 brings several improvements to LibrePhotos, including a fix for video scanning by correcting aspect ratio detection and improved support for media from Nextcloud. 


  The FaceDashboard frontend now handles cache invalidation more reliably, and the upload documentation was clarified. Dependencies and language strings were also updated.
