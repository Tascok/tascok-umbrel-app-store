id: tascok-webtop
name: Ubuntu Mate
tagline: Um desktop fácil de usar que traz o poder do Ubuntu ao seu alcance
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-webtop/logo.png
