description: >-
  🌱 Plant it é um aplicativo de código aberto desenvolvido para ajudá-lo a manter um registro detalhado e organizado dos cuidados com suas plantas. Ele se concentra inteiramente em documentar o que você faz pelas suas plantas, fornecendo um histórico claro e estruturado de cada ação realizada. Em vez de adivinhar quando foi a última vez que regou ou fertilizou algo, você pode simplesmente verificar sua linha do tempo e ver todas as entradas anteriores com informações precisas.


  O aplicativo permite registrar ações como regar, fertilizar, podar, replantar e muitas outras atividades de cuidado. Cada entrada pode incluir notas, datas e fotos opcionais, o que facilita o acompanhamento do progresso ou a identificação de alterações nas condições de uma planta. Com o tempo, isso cria um diário de cuidados completo que ajuda você a entender como suas rotinas afetam a saúde de suas plantas.


  Plant it também fornece um rico sistema de informações sobre plantas que ajuda a organizar e categorizar sua coleção. Você pode navegar por dados detalhados sobre as espécies e anexar as informações corretas a cada planta adicionada. Isso facilita o gerenciamento de grandes coleções de plantas e a manutenção de uma visão clara do que cada planta precisa.


  Ao combinar documentação estruturada com histórico visual e informações sobre plantas, o Plant it transforma o cuidado das plantas em uma experiência intuitiva e bem organizada. Ele ajuda você a tomar melhores decisões, perceber padrões e manter uma coleção mais saudável por meio de um rastreamento consistente e transparente.


  ⚙️ Guia de configuração rápida: 

       1. Após a instalação, o aplicativo abre às http://umbrel.local:8837. 
       2. Entre http://umbrel.local:8836 como o URL do servidor. (O nome do host pode ser diferente no seu sistema.)
       3. Em seguida, clique em Continuar para concluir o processo de configuração e começar a usar o Plant-it.
