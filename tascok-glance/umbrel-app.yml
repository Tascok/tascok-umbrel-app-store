version: "0.7.13"
port: 8907
description: >-
  Glance é um painel leve e auto-hospedado projetado para ajudar os usuários a acompanhar seus serviços, aplicativos e recursos auto-hospedados de uma forma intuitiva e visualmente atraente. Ao contrário das ferramentas de monitoramento tradicionais que podem ser complexas e sobrecarregadas de dados, o Glance se concentra na simplicidade e na acessibilidade, tornando-o uma excelente escolha tanto para iniciantes quanto para entusiastas experientes de auto-hospedagem.


  Com sua interface limpa e minimalista, o Glance permite que os usuários vejam rapidamente o status de seus serviços, fornecendo uma visão geral rápida sem distrações desnecessárias. Esteja você gerenciando alguns aplicativos essenciais ou um grande número de serviços auto-hospedados, o Glance garante que todas as informações críticas sejam apresentadas em um formato organizado e de fácil leitura.


  Uma das principais vantagens do Glance é a sua flexibilidade. É altamente configurável, permitindo ao usuário personalizar os serviços exibidos e as informações associadas de acordo com suas necessidades. Isso o torna adequado para uma variedade de casos de uso, seja você executando um servidor pessoal, um laboratório doméstico ou até mesmo uma infraestrutura de pequena empresa.


  Como o Glance é totalmente auto-hospedado, os usuários mantêm controle total sobre seus dados e privacidade. Não há dependências de serviços externos ou integrações de terceiros, garantindo que informações confidenciais permaneçam seguras. A natureza de código aberto do projeto também significa que ele é mantido ativamente pela comunidade, com atualizações e melhorias regulares com base no feedback dos usuários.


  Projetado para ser eficiente, o Glance é leve e não requer muitos recursos do sistema para funcionar sem problemas. Ele pode ser facilmente implantado usando Docker ou outros métodos de conteinerização, simplificando a instalação e a manutenção.


  No geral, o Glance é uma excelente ferramenta para quem busca simplificar o gerenciamento de serviços auto-hospedados. Ao fornecer um painel elegante e fácil de usar, ele ajuda os usuários a se manterem organizados, monitorar seus aplicativos sem esforço e manter controle total sobre seu ambiente auto-hospedado.


  ⚙️ Você encontra tudo o que precisa para configurar o aplicativo na documentação oficial: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
