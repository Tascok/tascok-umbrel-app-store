name: Quake III Arena
tagline: Uma viagem explosiva ao coração da loucura dos jogos dos anos 90
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-quakeiii/logo.png
category: gaming
version: "1.0"
port: 8789
description: >-
  Quake III Arena é o jogo definitivo para quem pensa que a gravidade é opcional, os momentos de silêncio são superestimados e as explosões são apenas parte da rotina diária. Este clássico de 1999 não é sobre física realista ou histórias complexas – é sobre ação pura e sem filtros. Você surge, atira, explode e reaparece, tudo antes mesmo de ter a chance de piscar. As armas? Um glorioso arsenal de lançadores de foguetes, canhões elétricos e espingardas, todos projetados para garantir que seus oponentes desapareçam da maneira mais espetacular possível.


  As arenas são armadilhas mortais futurísticas, habilmente elaboradas para testar seus reflexos e deixá-lo um pouco louco. Saúde, armadura e munição estão espalhadas como tesouros, mas apenas se você for rápido o suficiente para agarrá-los antes que o cara com a arma de plasma o faça. E não vamos esquecer dos power-ups – bênçãos momentâneas que transformam você em uma força imparável... até que alguém jogue um foguete na sua cabeça.


  Esteja você lutando contra bots hiperagressivos no modo single player ou enfrentando jogadores reais que não mostram piedade em partidas online, Quake III Arena oferece o caos na velocidade da luz. É rápido, viciante e é a pedra angular da história dos jogos multijogador. Isto não é apenas um jogo; é um legado, uma lembrança da era de ouro dos atiradores. Então pegue seu mouse, bloqueie e carregue seu lançador de foguetes e prove que você é o verdadeiro campeão da arena – pelo menos até que um BFG 10K o mande voando para o esquecimento.


  ⚠️ Quake III funciona melhor em navegadores baseados em Chromium. O Firefox pode encontrar problemas de compatibilidade devido ao WebGL ou restrições de segurança.


  🔧 Requisitos do sistema: Uma máquina do tempo até 99,
                          CPU Pentium II 266 MHz ou AMD K6-2 350 MHz, 
                          64 MB de RAM, 
                          25 MB para arquivos de jogos,
                          (Umbrel Home tem CPU 100x, mas precisará ocupar 0,001192% de espaço livre)
                          É executado no navegador, precisará baixar 0,3906% de mais RAM, se necessário, no navegador.
