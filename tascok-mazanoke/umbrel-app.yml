releaseNotes: >-
  Version 1.1.5 focuses on strengthening the core foundation and expanding file format support, including TIFF and ICO conversions, while maintaining a simple user experience. It adds basic authentication for Docker setups, improves image optimization speed and UI feedback, fixes issues with image downloads and HEIC resizing, and updates documentation for setup and dependencies. The project has seen significant user growth and recent media features.
